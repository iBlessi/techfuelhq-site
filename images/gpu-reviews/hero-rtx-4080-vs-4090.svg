<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="RTX 4080 vs RTX 4090 comparison">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#15152e"/>
    </linearGradient>
    <linearGradient id="g4080" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(118,185,0,0.18)"/>
      <stop offset="100%" stop-color="rgba(118,185,0,0.04)"/>
    </linearGradient>
    <linearGradient id="g4090" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(172,244,0,0.22)"/>
      <stop offset="100%" stop-color="rgba(172,244,0,0.04)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
  </g>

  <!-- Brand mark -->
  <text x="600" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#6b6b8a" text-anchor="middle" letter-spacing="3">TECHFUEL HQ · GPU SHOWDOWN</text>

  <!-- Main title -->
  <text x="600" y="120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="44" font-weight="700" fill="#e8e8f0" text-anchor="middle">RTX 4080 <tspan fill="#6b6b8a" font-weight="400">vs</tspan> RTX 4090</text>
  <text x="600" y="155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" fill="#7a7a96" text-anchor="middle">Is the flagship tax worth $700 more?</text>

  <!-- 4080 Card -->
  <g transform="translate(120,200)">
    <rect width="420" height="370" rx="14" fill="url(#g4080)" stroke="rgba(118,185,0,0.3)" stroke-width="1.5"/>
    <rect x="20" y="20" width="380" height="80" rx="6" fill="none" stroke="rgba(118,185,0,0.25)" stroke-width="1"/>
    <rect x="32" y="32" width="356" height="56" rx="3" fill="rgba(118,185,0,0.08)"/>
    <text x="210" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#76b900" text-anchor="middle" letter-spacing="2">NVIDIA · ADA LOVELACE</text>
    <text x="210" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="600" fill="#76b900" text-anchor="middle">RTX 4080 / Super</text>

    <!-- Stats -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <text x="40" y="145" font-size="13" fill="#7a7a96">CUDA cores</text>
      <text x="380" y="145" font-size="15" fill="#c8c8dc" text-anchor="end" font-weight="500">9,728</text>

      <text x="40" y="180" font-size="13" fill="#7a7a96">VRAM</text>
      <text x="380" y="180" font-size="15" fill="#c8c8dc" text-anchor="end" font-weight="500">16 GB GDDR6X</text>

      <text x="40" y="215" font-size="13" fill="#7a7a96">Memory bus</text>
      <text x="380" y="215" font-size="15" fill="#c8c8dc" text-anchor="end" font-weight="500">256-bit</text>

      <text x="40" y="250" font-size="13" fill="#7a7a96">Power draw</text>
      <text x="380" y="250" font-size="15" fill="#76b900" text-anchor="end" font-weight="500">320W</text>

      <text x="40" y="285" font-size="13" fill="#7a7a96">FPS / dollar (4K)</text>
      <text x="380" y="285" font-size="15" fill="#76b900" text-anchor="end" font-weight="500">0.089</text>

      <line x1="40" y1="305" x2="380" y2="305" stroke="rgba(255,255,255,0.06)"/>

      <text x="40" y="335" font-size="13" fill="#7a7a96">Used street</text>
      <text x="380" y="335" font-size="22" fill="#76b900" text-anchor="end" font-weight="700">~$800</text>
    </g>
  </g>

  <!-- VS divider -->
  <g transform="translate(600,385)">
    <line x1="0" y1="-150" x2="0" y2="150" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="0" cy="0" r="28" fill="#0a0a23" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="0" y="6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#7a7a96" text-anchor="middle" letter-spacing="1">VS</text>
  </g>

  <!-- 4090 Card -->
  <g transform="translate(660,200)">
    <rect width="420" height="370" rx="14" fill="url(#g4090)" stroke="rgba(172,244,0,0.4)" stroke-width="1.5"/>
    <rect x="20" y="20" width="380" height="80" rx="6" fill="none" stroke="rgba(172,244,0,0.3)" stroke-width="1"/>
    <rect x="32" y="32" width="356" height="56" rx="3" fill="rgba(172,244,0,0.1)"/>
    <text x="210" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#c8ff00" text-anchor="middle" letter-spacing="2">NVIDIA · ADA LOVELACE</text>
    <text x="210" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="600" fill="#c8ff00" text-anchor="middle">RTX 4090</text>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <text x="40" y="145" font-size="13" fill="#7a7a96">CUDA cores</text>
      <text x="380" y="145" font-size="15" fill="#c8ff00" text-anchor="end" font-weight="500">16,384</text>

      <text x="40" y="180" font-size="13" fill="#7a7a96">VRAM</text>
      <text x="380" y="180" font-size="15" fill="#c8ff00" text-anchor="end" font-weight="500">24 GB GDDR6X</text>

      <text x="40" y="215" font-size="13" fill="#7a7a96">Memory bus</text>
      <text x="380" y="215" font-size="15" fill="#c8ff00" text-anchor="end" font-weight="500">384-bit</text>

      <text x="40" y="250" font-size="13" fill="#7a7a96">Power draw</text>
      <text x="380" y="250" font-size="15" fill="#c8c8dc" text-anchor="end" font-weight="500">450W</text>

      <text x="40" y="285" font-size="13" fill="#7a7a96">FPS / dollar (4K)</text>
      <text x="380" y="285" font-size="15" fill="#c8c8dc" text-anchor="end" font-weight="500">0.066</text>

      <line x1="40" y1="305" x2="380" y2="305" stroke="rgba(255,255,255,0.06)"/>

      <text x="40" y="335" font-size="13" fill="#7a7a96">Used street</text>
      <text x="380" y="335" font-size="22" fill="#c8ff00" text-anchor="end" font-weight="700">~$1,500</text>
    </g>
  </g>

  <!-- Footer tagline -->
  <text x="600" y="605" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#555570" text-anchor="middle">Aggregated 20-game 4K suite · Used pricing as of April 2026 · techfuelhq.com</text>
</svg>
