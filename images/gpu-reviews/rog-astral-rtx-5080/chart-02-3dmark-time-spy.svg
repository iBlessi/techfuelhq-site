<text x="70" y="470" fill="#4a4a6a" font-size="13">TechFuelHQ first-party &#183; bars proportional to score &#183; Manual OC = GPU Tweak III +328 MHz core, +2996 MHz memory, +12% power target</text>
<text x="1130" y="470" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
