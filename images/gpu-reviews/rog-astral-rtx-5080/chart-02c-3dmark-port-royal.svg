<text x="0" y="34" fill="#c0c0d8" font-size="17" font-weight="600">Stock</text>
<rect x="290" y="12" width="595" height="40" rx="8" fill="#5090e0"/>
<text x="899" y="39" fill="#e8e8f0" font-size="19" font-weight="800">20,300 score</text>
<text x="899" y="56" fill="#6b6b8a" font-size="12.5">stock baseline</text>
