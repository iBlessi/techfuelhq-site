<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1200" height="675" fill="#0a0a23"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="#1e1e3a" stroke-width="2" rx="10"/>
  <rect x="0" y="0" width="1200" height="6" fill="#c8ff00"/>

  <text x="64" y="82" fill="#c8ff00" font-size="16" font-weight="700" letter-spacing="3">TECHFUELHQ · GPU COMPARISON · 2026</text>
  <text x="64" y="140" fill="#f2f2f7" font-size="52" font-weight="800" letter-spacing="-1">RTX 5070 <tspan fill="#79839a" font-weight="600">vs</tspan> RX 9070</text>
  <text x="64" y="182" fill="#9a9ab5" font-size="22">Same $549 launch price — <tspan fill="#c8ff00" font-weight="700">the 9070 is ~11–15% faster at 1440p</tspan></text>
  <line x1="64" y1="212" x2="1136" y2="212" stroke="#1e1e3a" stroke-width="1.5"/>

  <!-- RTX 5070 -->
  <rect x="64" y="240" width="500" height="230" rx="10" fill="rgba(120,180,255,0.05)" stroke="#2a3a55" stroke-width="1"/>
  <text x="88" y="284" fill="#e8e8f0" font-size="26" font-weight="800">RTX 5070</text>
  <text x="88" y="312" fill="#7fb0f0" font-size="15" font-weight="700">FOR RAY TRACING · DLSS 4 · CREATORS</text>
  <text x="88" y="356" fill="#9a9ab5" font-size="17">Shaders <tspan x="540" fill="#e8e8f0" font-weight="700" text-anchor="end">6,144 CUDA</tspan></text>
  <text x="88" y="388" fill="#9a9ab5" font-size="17">VRAM <tspan x="540" fill="#e8e8f0" font-weight="700" text-anchor="end">12GB GDDR7 · 192-bit</tspan></text>
  <text x="88" y="420" fill="#9a9ab5" font-size="17">Board power <tspan x="540" fill="#e8e8f0" font-weight="700" text-anchor="end">250W</tspan></text>
  <text x="88" y="452" fill="#9a9ab5" font-size="17">Street (Jul 2026) <tspan x="540" fill="#c8ff00" font-weight="700" text-anchor="end">~$580–670</tspan></text>

  <!-- RX 9070 -->
  <rect x="636" y="240" width="500" height="230" rx="10" fill="rgba(200,255,0,0.04)" stroke="#3a3a1a" stroke-width="1"/>
  <text x="660" y="284" fill="#e8e8f0" font-size="26" font-weight="800">RX 9070</text>
  <text x="660" y="312" fill="#8fdca0" font-size="15" font-weight="700">THE 1440p RASTER VALUE PICK</text>
  <text x="660" y="356" fill="#9a9ab5" font-size="17">Shaders <tspan x="1112" fill="#e8e8f0" font-weight="700" text-anchor="end">3,584 SP</tspan></text>
  <text x="660" y="388" fill="#9a9ab5" font-size="17">VRAM <tspan x="1112" fill="#e8e8f0" font-weight="700" text-anchor="end">16GB GDDR6 · 256-bit</tspan></text>
  <text x="660" y="420" fill="#9a9ab5" font-size="17">Board power <tspan x="1112" fill="#8fdca0" font-weight="700" text-anchor="end">220W  (–30W)</tspan></text>
  <text x="660" y="452" fill="#9a9ab5" font-size="17">Street (Jul 2026) <tspan x="1112" fill="#c8ff00" font-weight="700" text-anchor="end">~$610–686</tspan></text>

  <!-- center VS badge -->
  <circle cx="600" cy="355" r="30" fill="#0a0a23" stroke="#c8ff00" stroke-width="1.5"/>
  <text x="600" y="362" fill="#c8ff00" font-size="18" font-weight="800" text-anchor="middle">VS</text>

  <!-- Reframe callout -->
  <rect x="64" y="500" width="1072" height="66" rx="8" fill="rgba(200,255,0,0.06)" stroke="#c8ff00" stroke-width="1.2"/>
  <text x="88" y="530" fill="#c8ff00" font-size="20" font-weight="800">Same MSRP, different answer in 2026.</text>
  <text x="88" y="554" fill="#c8c8dc" font-size="16">The 9070 wins raster, VRAM and efficiency; the 5070 wins ray tracing, DLSS 4 and CUDA. Street prices now sit near parity.</text>

  <text x="1136" y="610" fill="#44445a" font-size="14" text-anchor="end">techfuelhq.com · specs: NVIDIA / AMD · benchmarks: GamersNexus</text>
</svg>
