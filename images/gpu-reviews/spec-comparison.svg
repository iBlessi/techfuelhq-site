<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="680" fill="#0a0a23"/>
  <text x="600" y="45" text-anchor="middle" fill="#c8ff00" font-size="24" font-weight="800">FULL SPEC COMPARISON</text>
  <text x="600" y="70" text-anchor="middle" fill="#667" font-size="13">RTX 5060 vs RX 9060 XT — Side by Side</text>
  <!-- Table Header -->
  <rect x="50" y="90" width="1100" height="40" rx="8" fill="#1a1a3e"/>
  <text x="250" y="116" text-anchor="middle" fill="#9999bb" font-size="14" font-weight="700">SPEC</text>
  <text x="600" y="116" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">RTX 5060</text>
  <text x="950" y="116" text-anchor="middle" fill="#e63946" font-size="14" font-weight="700">RX 9060 XT</text>
  <!-- Row 1 -->
  <rect x="50" y="135" width="1100" height="40" rx="0" fill="#0d0d28" opacity="0.6"/>
  <text x="250" y="161" text-anchor="middle" fill="#bbbbcc" font-size="14">Architecture</text>
  <text x="600" y="161" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Blackwell (GB206)</text>
  <text x="950" y="161" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">RDNA 4 (Navi 44)</text>
  <!-- Row 2 -->
  <rect x="50" y="180" width="1100" height="40" rx="0" fill="#13132e" opacity="0.4"/>
  <text x="250" y="206" text-anchor="middle" fill="#bbbbcc" font-size="14">VRAM</text>
  <text x="600" y="206" text-anchor="middle" fill="#ffffff" font-size="14">8 GB GDDR7</text>
  <text x="950" y="206" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">16 GB GDDR6 ✅</text>
  <!-- Row 3 -->
  <rect x="50" y="225" width="1100" height="40" rx="0" fill="#0d0d28" opacity="0.6"/>
  <text x="250" y="251" text-anchor="middle" fill="#bbbbcc" font-size="14">Memory Bus</text>
  <text x="600" y="251" text-anchor="middle" fill="#ffffff" font-size="14">128-bit</text>
  <text x="950" y="251" text-anchor="middle" fill="#ffffff" font-size="14">128-bit</text>
  <!-- Row 4 -->
  <rect x="50" y="270" width="1100" height="40" rx="0" fill="#13132e" opacity="0.4"/>
  <text x="250" y="296" text-anchor="middle" fill="#bbbbcc" font-size="14">Memory Bandwidth</text>
  <text x="600" y="296" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">~448 GB/s ✅</text>
  <text x="950" y="296" text-anchor="middle" fill="#ffffff" font-size="14">~320 GB/s</text>
  <!-- Row 5 -->
  <rect x="50" y="315" width="1100" height="40" rx="0" fill="#0d0d28" opacity="0.6"/>
  <text x="250" y="341" text-anchor="middle" fill="#bbbbcc" font-size="14">PCIe Interface</text>
  <text x="600" y="341" text-anchor="middle" fill="#ffffff" font-size="14">PCIe 5.0 x8</text>
  <text x="950" y="341" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">PCIe 5.0 x16 ✅</text>
  <!-- Row 6 -->
  <rect x="50" y="360" width="1100" height="40" rx="0" fill="#13132e" opacity="0.4"/>
  <text x="250" y="386" text-anchor="middle" fill="#bbbbcc" font-size="14">TDP</text>
  <text x="600" y="386" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">~150W ✅</text>
  <text x="950" y="386" text-anchor="middle" fill="#ffffff" font-size="14">~180W</text>
  <!-- Row 7 -->
  <rect x="50" y="405" width="1100" height="40" rx="0" fill="#0d0d28" opacity="0.6"/>
  <text x="250" y="431" text-anchor="middle" fill="#bbbbcc" font-size="14">Upscaling</text>
  <text x="600" y="431" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">DLSS 4 + MFG ✅</text>
  <text x="950" y="431" text-anchor="middle" fill="#ffffff" font-size="14">FSR 4 + Frame Gen</text>
  <!-- Row 8 -->
  <rect x="50" y="450" width="1100" height="40" rx="0" fill="#13132e" opacity="0.4"/>
  <text x="250" y="476" text-anchor="middle" fill="#bbbbcc" font-size="14">Ray Tracing</text>
  <text x="600" y="476" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">5th Gen RT Cores ✅</text>
  <text x="950" y="476" text-anchor="middle" fill="#ffffff" font-size="14">2nd Gen RT Accelerators</text>
  <!-- Row 9 -->
  <rect x="50" y="495" width="1100" height="40" rx="0" fill="#0d0d28" opacity="0.6"/>
  <text x="250" y="521" text-anchor="middle" fill="#bbbbcc" font-size="14">Encoder</text>
  <text x="600" y="521" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">NVENC 10 (AV1) ✅</text>
  <text x="950" y="521" text-anchor="middle" fill="#ffffff" font-size="14">VCN 5 (AV1)</text>
  <!-- Row 10 -->
  <rect x="50" y="540" width="1100" height="40" rx="0" fill="#13132e" opacity="0.4"/>
  <text x="250" y="566" text-anchor="middle" fill="#bbbbcc" font-size="14">Est. MSRP</text>
  <text x="600" y="566" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">~$299 ✅</text>
  <text x="950" y="566" text-anchor="middle" fill="#ffffff" font-size="14">~$349</text>
  <!-- Footer -->
  <text x="600" y="620" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="600">RTX 5060: 6 wins | RX 9060 XT: 2 wins | 1 tie</text>
  <text x="600" y="650" text-anchor="middle" fill="#556" font-size="11">Specs based on confirmed leaks and official announcements | techfuelhq.com</text>
</svg>