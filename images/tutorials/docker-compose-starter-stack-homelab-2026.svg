<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>Docker Compose homelab starter stack architecture</title>
  <desc>Topology diagram of five Docker services on a shared proxy network: Nginx Proxy Manager as the reverse proxy entry point routing to Portainer, Uptime Kuma, and Gitea, with Watchtower monitoring the Docker socket for automatic updates. Total idle RAM about 250 MB on a Beelink SEi12 Debian 12 LXC.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5090e0"/>
    </marker>
    <marker id="arrowlime" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c8ff00"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="58" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">HOMELAB TUTORIAL · DOCKER COMPOSE</text>
  <text x="70" y="100" fill="#e8e8f0" font-size="40" font-weight="900">Starter Stack Topology</text>
  <text x="70" y="130" fill="#6b6b8a" font-size="18">Five services on one shared <tspan fill="#c8ff00" font-weight="600">proxy</tspan> network · Beelink SEi12 · Debian 12 LXC</text>

  <!-- Internet / router entry -->
  <g transform="translate(70,170)">
    <rect width="190" height="60" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="20" y="27" fill="#6b6b8a" font-size="11" letter-spacing="2" font-weight="700">INTERNET / LAN</text>
    <text x="20" y="48" fill="#c0c0d8" font-size="15">Router · ports 80/443/2222</text>
  </g>

  <!-- proxy network band -->
  <rect x="70" y="270" width="850" height="270" rx="14" fill="none" stroke="#1e1e3a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="86" y="292" fill="#c8ff00" font-size="12" letter-spacing="2" font-weight="700">DOCKER NETWORK · proxy (external)</text>

  <!-- Arrow router -> NPM -->
  <line x1="165" y1="230" x2="165" y2="318" stroke="#c8ff00" stroke-width="2" marker-end="url(#arrowlime)"/>

  <!-- Nginx Proxy Manager (entry, lime accent) -->
  <g transform="translate(90,310)">
    <rect width="210" height="115" rx="12" fill="#101028" stroke="#c8ff00" stroke-width="2"/>
    <text x="18" y="30" fill="#c8ff00" font-size="12" letter-spacing="1" font-weight="700">REVERSE PROXY</text>
    <text x="18" y="58" fill="#e8e8f0" font-size="19" font-weight="700">Nginx Proxy Mgr</text>
    <text x="18" y="80" fill="#6b6b8a" font-size="12">jc21/nginx-proxy-manager</text>
    <text x="18" y="102" fill="#c0c0d8" font-size="13">Ports 80 · 443 · 81 (admin)</text>
  </g>

  <!-- Routed services column -->
  <!-- Portainer -->
  <g transform="translate(370,302)">
    <rect width="240" height="68" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="16" y="27" fill="#e8e8f0" font-size="17" font-weight="700">Portainer CE</text>
    <text x="16" y="48" fill="#6b6b8a" font-size="12">portainer/portainer-ce</text>
    <text x="224" y="48" text-anchor="end" fill="#5090e0" font-size="13" font-weight="600">:9000</text>
  </g>
  <!-- Uptime Kuma -->
  <g transform="translate(370,386)">
    <rect width="240" height="68" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="16" y="27" fill="#e8e8f0" font-size="17" font-weight="700">Uptime Kuma</text>
    <text x="16" y="48" fill="#6b6b8a" font-size="12">louislam/uptime-kuma</text>
    <text x="224" y="48" text-anchor="end" fill="#5090e0" font-size="13" font-weight="600">:3001</text>
  </g>
  <!-- Gitea -->
  <g transform="translate(370,470)">
    <rect width="240" height="68" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="16" y="27" fill="#e8e8f0" font-size="17" font-weight="700">Gitea</text>
    <text x="16" y="48" fill="#6b6b8a" font-size="12">gitea/gitea</text>
    <text x="224" y="48" text-anchor="end" fill="#5090e0" font-size="13" font-weight="600">:3000 · ssh 2222</text>
  </g>

  <!-- Arrows NPM -> routed services -->
  <line x1="300" y1="350" x2="364" y2="336" stroke="#5090e0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="300" y1="368" x2="364" y2="420" stroke="#5090e0" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="300" y1="386" x2="364" y2="504" stroke="#5090e0" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Watchtower (control plane, warn accent) -->
  <g transform="translate(680,386)">
    <rect width="220" height="84" rx="10" fill="#101028" stroke="#e08828" stroke-width="1.5"/>
    <text x="16" y="26" fill="#e08828" font-size="11" letter-spacing="1" font-weight="700">AUTO-UPDATE</text>
    <text x="16" y="49" fill="#e8e8f0" font-size="17" font-weight="700">Watchtower</text>
    <text x="16" y="70" fill="#6b6b8a" font-size="12">containrrr · 4am daily</text>
  </g>
  <!-- docker.sock node -->
  <g transform="translate(680,302)">
    <rect width="220" height="50" rx="10" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="16" y="22" fill="#6b6b8a" font-size="11" letter-spacing="1" font-weight="700">HOST SOCKET</text>
    <text x="16" y="40" fill="#c0c0d8" font-size="13">/var/run/docker.sock</text>
  </g>
  <!-- Watchtower watches socket -->
  <line x1="790" y1="386" x2="790" y2="356" stroke="#e08828" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- override arrow marker color via separate marker not needed; keep dashed -->

  <!-- RAM panel on right -->
  <g transform="translate(950,170)">
    <rect width="180" height="370" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="20" y="34" fill="#6b6b8a" font-size="12" letter-spacing="2" font-weight="700">IDLE RAM</text>

    <text x="20" y="74" fill="#c0c0d8" font-size="14">NPM</text>
    <text x="160" y="74" text-anchor="end" fill="#e8e8f0" font-size="14" font-weight="600">~50 MB</text>

    <text x="20" y="106" fill="#c0c0d8" font-size="14">Portainer</text>
    <text x="160" y="106" text-anchor="end" fill="#e8e8f0" font-size="14" font-weight="600">~35 MB</text>

    <text x="20" y="138" fill="#c0c0d8" font-size="14">Uptime Kuma</text>
    <text x="160" y="138" text-anchor="end" fill="#e8e8f0" font-size="14" font-weight="600">~70 MB</text>

    <text x="20" y="170" fill="#c0c0d8" font-size="14">Watchtower</text>
    <text x="160" y="170" text-anchor="end" fill="#e8e8f0" font-size="14" font-weight="600">~15 MB</text>

    <text x="20" y="202" fill="#c0c0d8" font-size="14">Gitea</text>
    <text x="160" y="202" text-anchor="end" fill="#e8e8f0" font-size="14" font-weight="600">~80 MB</text>

    <line x1="20" y1="222" x2="160" y2="222" stroke="#1e1e3a" stroke-width="1"/>

    <text x="20" y="256" fill="#e8e8f0" font-size="15" font-weight="700">Total</text>
    <text x="160" y="256" text-anchor="end" fill="#c8ff00" font-size="20" font-weight="900">~250 MB</text>

    <text x="20" y="296" fill="#6b6b8a" font-size="12">1.5% of 16 GB RAM</text>
    <text x="20" y="332" fill="#5dca7a" font-size="13" font-weight="600">5 services, one stack</text>
  </g>

  <!-- Footer -->
  <text x="70" y="592" fill="#4a4a6a" font-size="13">TechFuel HQ · Homelab Tutorial · Compose files and RAM figures per the guide</text>
  <text x="1130" y="592" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
