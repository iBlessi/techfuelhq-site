<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>Homelab monitoring stack architecture: Node Exporter agents on the Docker host and three Proxmox nodes plus pve-exporter feed Prometheus, which powers Grafana dashboards and fires alerts through Alertmanager to Discord.</title>
  <desc>Topology diagram. On the left, four Node Exporter targets on port 9100 (Docker host and Proxmox nodes pve01-pve03 at 192.168.1.10-12) and a pve-exporter on port 9221 are scraped every 15 seconds by Prometheus in the center (port 9090, 15-day retention). Prometheus feeds the Grafana dashboard layer on port 3000 and pushes fired alert rules to Alertmanager on port 9093, which routes notifications to Discord.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5090e0"/>
    </marker>
    <marker id="arrowLime" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c8ff00"/>
    </marker>
    <marker id="arrowWarn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e08828"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <text x="70" y="62" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">SETUP TUTORIAL · OBSERVABILITY STACK</text>
  <text x="70" y="104" fill="#e8e8f0" font-size="40" font-weight="900">Homelab Monitoring: Grafana + Prometheus</text>
  <text x="70" y="134" fill="#6b6b8a" font-size="18">Exporters scrape metrics · Prometheus stores them · Grafana visualizes · Alertmanager pages you</text>

  <!-- Column labels -->
  <text x="160" y="190" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700" text-anchor="middle">EXPORTERS / TARGETS</text>
  <text x="600" y="190" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700" text-anchor="middle">COLLECTION + STORAGE</text>
  <text x="1010" y="190" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700" text-anchor="middle">VISUALIZE + ALERT</text>

  <!-- LEFT: exporter targets -->
  <g>
    <rect x="40" y="210" width="240" height="58" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="58" y="238" fill="#e8e8f0" font-size="16" font-weight="700">Node Exporter</text>
    <text x="58" y="258" fill="#c0c0d8" font-size="13">Docker host · :9100</text>

    <rect x="40" y="280" width="240" height="58" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="58" y="308" fill="#e8e8f0" font-size="16" font-weight="700">Node Exporter · pve01</text>
    <text x="58" y="328" fill="#c0c0d8" font-size="13">192.168.1.10 · :9100</text>

    <rect x="40" y="350" width="240" height="58" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="58" y="378" fill="#e8e8f0" font-size="16" font-weight="700">Node Exporter · pve02</text>
    <text x="58" y="398" fill="#c0c0d8" font-size="13">192.168.1.11 · :9100</text>

    <rect x="40" y="420" width="240" height="58" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="58" y="448" fill="#e8e8f0" font-size="16" font-weight="700">Node Exporter · pve03</text>
    <text x="58" y="468" fill="#c0c0d8" font-size="13">192.168.1.12 · :9100</text>

    <rect x="40" y="490" width="240" height="58" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="58" y="518" fill="#c8ff00" font-size="16" font-weight="700">pve-exporter</text>
    <text x="58" y="538" fill="#c0c0d8" font-size="13">per-VM / LXC · :9221</text>
  </g>

  <!-- Scrape arrows to Prometheus (pull model) -->
  <path d="M 280 239 L 458 320" fill="none" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 280 309 L 458 332" fill="none" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 280 379 L 458 350" fill="none" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 280 449 L 458 368" fill="none" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 280 519 L 458 386" fill="none" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="312" y="276" fill="#5090e0" font-size="12" font-weight="700">scrape · every 15s</text>

  <!-- CENTER: Prometheus -->
  <rect x="470" y="280" width="260" height="150" rx="12" fill="#101028" stroke="#c8ff00" stroke-width="2"/>
  <text x="600" y="320" fill="#e8e8f0" font-size="24" font-weight="900" text-anchor="middle">Prometheus</text>
  <text x="600" y="346" fill="#6b6b8a" font-size="13" text-anchor="middle">time-series DB · :9090</text>
  <text x="600" y="378" fill="#c0c0d8" font-size="14" text-anchor="middle">15-day retention</text>
  <text x="600" y="400" fill="#c0c0d8" font-size="14" text-anchor="middle">~500MB–2GB on NVMe</text>
  <text x="600" y="420" fill="#c8ff00" font-size="13" text-anchor="middle" font-weight="700">evaluates alert rules</text>

  <!-- Prometheus -> Grafana -->
  <path d="M 730 330 L 858 270" fill="none" stroke="#c8ff00" stroke-width="2.5" marker-end="url(#arrowLime)"/>
  <text x="744" y="294" fill="#c8ff00" font-size="12" font-weight="700">data source</text>

  <!-- Prometheus -> Alertmanager -->
  <path d="M 730 400 L 858 452" fill="none" stroke="#e08828" stroke-width="2.5" marker-end="url(#arrowWarn)"/>
  <text x="742" y="442" fill="#e08828" font-size="12" font-weight="700">fires alerts</text>

  <!-- RIGHT TOP: Grafana -->
  <rect x="870" y="220" width="280" height="120" rx="12" fill="#101028" stroke="#1e1e3a"/>
  <text x="1010" y="256" fill="#e8e8f0" font-size="22" font-weight="900" text-anchor="middle">Grafana</text>
  <text x="1010" y="280" fill="#6b6b8a" font-size="13" text-anchor="middle">dashboards · :3000</text>
  <text x="1010" y="308" fill="#c0c0d8" font-size="14" text-anchor="middle">Node Exporter Full (1860)</text>
  <text x="1010" y="328" fill="#c0c0d8" font-size="14" text-anchor="middle">Proxmox via pve-exporter (7039)</text>

  <!-- RIGHT BOTTOM: Alertmanager -->
  <rect x="870" y="410" width="280" height="120" rx="12" fill="#101028" stroke="#1e1e3a"/>
  <text x="1010" y="446" fill="#e8e8f0" font-size="22" font-weight="900" text-anchor="middle">Alertmanager</text>
  <text x="1010" y="470" fill="#6b6b8a" font-size="13" text-anchor="middle">routing · :9093</text>
  <text x="1010" y="498" fill="#c0c0d8" font-size="14" text-anchor="middle">NodeDown · HighCPU · DiskFull</text>
  <text x="1010" y="520" fill="#e08828" font-size="14" text-anchor="middle" font-weight="700">→ Discord webhook</text>

  <!-- Resource overhead callout -->
  <text x="470" y="470" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">FULL-STACK OVERHEAD · 5-NODE HOMELAB</text>
  <text x="470" y="496" fill="#5dca7a" font-size="22" font-weight="900">300–600MB RAM</text>
  <text x="630" y="496" fill="#6b6b8a" font-size="14">Prometheus + Grafana + Alertmanager + Node Exporter</text>
  <text x="470" y="522" fill="#c0c0d8" font-size="13">Node Exporter ~10–20MB per node · runs on your existing Docker host</text>

  <text x="70" y="600" fill="#4a4a6a" font-size="13">TechFuel HQ · Setup Tutorial · Ports and config per the Prometheus, Grafana and pve-exporter docs</text>
  <text x="1130" y="600" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
