<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>Self-hosted photo library architecture: Immich vs PhotoPrism vs Ente</title>
  <desc>Side-by-side topology of three self-hosted photo stacks. Immich runs server-side ML (InsightFace, CLIP) on PostgreSQL with VectorChord plus Redis. PhotoPrism CE runs a Go binary with MariaDB and TensorFlow ML, with face recognition gated behind the paid Plus tier. Ente runs encrypted blobs through the Museum server, PostgreSQL, and MinIO or S3, with all ML performed on-device.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b6b8a"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="40" y="48" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">SETUP TUTORIAL · SELF-HOSTED PHOTO LIBRARY · JULY 2026</text>
  <text x="40" y="86" fill="#e8e8f0" font-size="34" font-weight="900">Three Self-Hosted Stacks: Where the ML and Keys Live</text>

  <!-- Shared phone / takeout source row -->
  <g transform="translate(40,108)">
    <rect width="1120" height="44" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="20" y="28" fill="#c0c0d8" font-size="15" font-weight="600">Your photos</text>
    <text x="135" y="28" fill="#6b6b8a" font-size="14">Native iOS / Android app  ·  Google Takeout import  ·  a few TB of family library</text>
    <text x="1100" y="28" text-anchor="end" fill="#6b6b8a" font-size="13" letter-spacing="1">SHARED INPUT</text>
  </g>
  <!-- three down-arrows into the columns -->
  <line x1="207" y1="156" x2="207" y2="178" stroke="#6b6b8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="156" x2="600" y2="178" stroke="#6b6b8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="993" y1="156" x2="993" y2="178" stroke="#6b6b8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ IMMICH COLUMN ============ -->
  <g transform="translate(40,182)">
    <rect width="334" height="356" rx="12" fill="#0d0d28" stroke="#c8ff00" stroke-width="1.5"/>
    <rect x="0" y="0" width="334" height="40" rx="12" fill="#101028"/>
    <rect x="0" y="20" width="334" height="20" fill="#101028"/>
    <text x="18" y="26" fill="#c8ff00" font-size="18" font-weight="900">Immich</text>
    <text x="316" y="26" text-anchor="end" fill="#6b6b8a" font-size="12">v3.0.3 · AGPL-3.0</text>

    <!-- ML container -->
    <rect x="18" y="54" width="298" height="74" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="32" y="76" fill="#e8e8f0" font-size="14" font-weight="700">immich-machine-learning</text>
    <text x="32" y="96" fill="#c0c0d8" font-size="12.5">InsightFace · OpenAI CLIP (ViT-B/32)</text>
    <text x="32" y="114" fill="#c8ff00" font-size="12.5" font-weight="600">Server-side ML · CUDA / OpenVINO / ROCm</text>

    <!-- DB -->
    <rect x="18" y="140" width="142" height="64" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="32" y="162" fill="#e8e8f0" font-size="13" font-weight="700">PostgreSQL</text>
    <text x="32" y="180" fill="#c0c0d8" font-size="12">+ VectorChord</text>
    <text x="32" y="196" fill="#6b6b8a" font-size="11.5">embeddings</text>

    <rect x="174" y="140" width="142" height="64" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="188" y="162" fill="#e8e8f0" font-size="13" font-weight="700">Redis / Valkey</text>
    <text x="188" y="180" fill="#c0c0d8" font-size="12">BullMQ queues</text>
    <text x="188" y="196" fill="#6b6b8a" font-size="11.5">background jobs</text>

    <!-- storage -->
    <rect x="18" y="216" width="298" height="50" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="32" y="238" fill="#e8e8f0" font-size="13" font-weight="700">Flat filesystem (UPLOAD_LOCATION)</text>
    <text x="32" y="256" fill="#6b6b8a" font-size="11.5">originals never modified · no native S3</text>

    <!-- footer facts -->
    <line x1="18" y1="282" x2="316" y2="282" stroke="#1e1e3a"/>
    <text x="18" y="304" fill="#6b6b8a" font-size="12">Idle RAM</text>
    <text x="316" y="304" text-anchor="end" fill="#e8e8f0" font-size="12" font-weight="600">~900 MB – 1.6 GB</text>
    <text x="18" y="326" fill="#6b6b8a" font-size="12">Encryption</text>
    <text x="316" y="326" text-anchor="end" fill="#c0c0d8" font-size="12" font-weight="600">App-level, server keys</text>
    <text x="18" y="346" fill="#c8ff00" font-size="12.5" font-weight="700">Face recognition + search free</text>
  </g>

  <!-- ============ PHOTOPRISM COLUMN ============ -->
  <g transform="translate(433,182)">
    <rect width="334" height="356" rx="12" fill="#0d0d28" stroke="#5090e0" stroke-width="1.5"/>
    <rect x="0" y="0" width="334" height="40" rx="12" fill="#101028"/>
    <rect x="0" y="20" width="334" height="20" fill="#101028"/>
    <text x="18" y="26" fill="#5090e0" font-size="18" font-weight="900">PhotoPrism CE</text>
    <text x="316" y="26" text-anchor="end" fill="#6b6b8a" font-size="12">build 260601 · AGPL</text>

    <!-- Go binary + ML -->
    <rect x="18" y="54" width="298" height="74" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="32" y="76" fill="#e8e8f0" font-size="14" font-weight="700">PhotoPrism (Go binary)</text>
    <text x="32" y="96" fill="#c0c0d8" font-size="12.5">TensorFlow v2.18.0 · CNN face engine</text>
    <text x="32" y="114" fill="#e08828" font-size="12.5" font-weight="600">Faces need Plus · €6+/mo</text>

    <!-- DB -->
    <rect x="18" y="140" width="142" height="64" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="32" y="162" fill="#e8e8f0" font-size="13" font-weight="700">MariaDB</text>
    <text x="32" y="180" fill="#c0c0d8" font-size="12">index database</text>
    <text x="32" y="196" fill="#6b6b8a" font-size="11.5">SQLite test-only</text>

    <rect x="174" y="140" width="142" height="64" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="188" y="162" fill="#e8e8f0" font-size="13" font-weight="700">Ollama</text>
    <text x="188" y="180" fill="#c0c0d8" font-size="12">captioning</text>
    <text x="188" y="196" fill="#6b6b8a" font-size="11.5">added Mar 2026</text>

    <!-- storage -->
    <rect x="18" y="216" width="298" height="50" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="32" y="238" fill="#e8e8f0" font-size="13" font-weight="700">originals/ + XMP / JSON sidecars</text>
    <text x="32" y="256" fill="#6b6b8a" font-size="11.5">limited S3 · transcoding-only GPU</text>

    <!-- footer facts -->
    <line x1="18" y1="282" x2="316" y2="282" stroke="#1e1e3a"/>
    <text x="18" y="304" fill="#6b6b8a" font-size="12">Idle RAM</text>
    <text x="316" y="304" text-anchor="end" fill="#e8e8f0" font-size="12" font-weight="600">Light Go binary</text>
    <text x="18" y="326" fill="#6b6b8a" font-size="12">Encryption</text>
    <text x="316" y="326" text-anchor="end" fill="#c0c0d8" font-size="12" font-weight="600">App-level, server keys</text>
    <text x="18" y="346" fill="#e08828" font-size="12.5" font-weight="700">Mobile is PWA only (3rd-party native)</text>
  </g>

  <!-- ============ ENTE COLUMN ============ -->
  <g transform="translate(826,182)">
    <rect width="334" height="356" rx="12" fill="#0d0d28" stroke="#5dca7a" stroke-width="1.5"/>
    <rect x="0" y="0" width="334" height="40" rx="12" fill="#101028"/>
    <rect x="0" y="20" width="334" height="20" fill="#101028"/>
    <text x="18" y="26" fill="#5dca7a" font-size="18" font-weight="900">Ente (self-hosted)</text>
    <text x="316" y="26" text-anchor="end" fill="#6b6b8a" font-size="12">v1.3.58 · AGPLv3</text>

    <!-- on-device ML note -->
    <rect x="18" y="54" width="298" height="74" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="32" y="76" fill="#e8e8f0" font-size="14" font-weight="700">On-device ML (client app)</text>
    <text x="32" y="96" fill="#c0c0d8" font-size="12.5">ONNX · MobileCLIP · YOLO5Face</text>
    <text x="32" y="114" fill="#5dca7a" font-size="12.5" font-weight="600">CPU / battery cost is on the phone</text>

    <!-- server + DB -->
    <rect x="18" y="140" width="142" height="64" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="32" y="162" fill="#e8e8f0" font-size="13" font-weight="700">Museum (Go)</text>
    <text x="32" y="180" fill="#c0c0d8" font-size="12">+ PostgreSQL</text>
    <text x="32" y="196" fill="#6b6b8a" font-size="11.5">encrypted blobs</text>

    <rect x="174" y="140" width="142" height="64" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="188" y="162" fill="#e8e8f0" font-size="13" font-weight="700">MinIO / S3</text>
    <text x="188" y="180" fill="#c0c0d8" font-size="12">native object store</text>
    <text x="188" y="196" fill="#6b6b8a" font-size="11.5">any S3 bucket</text>

    <!-- storage / keys -->
    <rect x="18" y="216" width="298" height="50" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="32" y="238" fill="#e8e8f0" font-size="13" font-weight="700">True end-to-end · on-device keys</text>
    <text x="32" y="256" fill="#6b6b8a" font-size="11.5">server cannot decrypt · Cure53 audited</text>

    <!-- footer facts -->
    <line x1="18" y1="282" x2="316" y2="282" stroke="#1e1e3a"/>
    <text x="18" y="304" fill="#6b6b8a" font-size="12">Idle RAM</text>
    <text x="316" y="304" text-anchor="end" fill="#e8e8f0" font-size="12" font-weight="600">~130 – 500 MB</text>
    <text x="18" y="326" fill="#6b6b8a" font-size="12">Encryption</text>
    <text x="316" y="326" text-anchor="end" fill="#5dca7a" font-size="12" font-weight="600">True E2E, on-device</text>
    <text x="18" y="346" fill="#5dca7a" font-size="12.5" font-weight="700">Native S3 · fastest mobile cadence</text>
  </g>

  <!-- Verdict strip -->
  <g transform="translate(40,550)">
    <rect width="1120" height="30" rx="6" fill="#101028" stroke="#1e1e3a"/>
    <text x="16" y="20" fill="#c8ff00" font-size="13" font-weight="700">VERDICT</text>
    <text x="92" y="20" fill="#c0c0d8" font-size="13">Immich = safe pick for most homelabbers · PhotoPrism = if you already pay for Plus · Ente = if you mean it about E2E</text>
  </g>

  <!-- Footer -->
  <text x="40" y="608" fill="#4a4a6a" font-size="13">TechFuel HQ · Architecture Diagram · Components per each project's official docs &amp; GitHub releases (July 2026)</text>
  <text x="1160" y="608" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
