<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>Sanoid and Syncoid ZFS snapshot and replication architecture</title>
  <desc>Flow diagram showing a Sanoid systemd timer running every 15 minutes to snapshot ZFS datasets on a Proxmox source host using production, media and vm_disks retention templates, then Syncoid replicating incremental snapshots over SSH to a remote backup host pool, with health monitoring pushed to Uptime Kuma.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5090e0"/>
    </marker>
    <marker id="arrowLime" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c8ff00"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="62" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">SETUP TUTORIAL · ZFS SNAPSHOT + REPLICATION</text>
  <text x="70" y="104" fill="#e8e8f0" font-size="40" font-weight="900">Sanoid &amp; Syncoid Topology</text>
  <text x="70" y="134" fill="#6b6b8a" font-size="17">Policy-driven ZFS snapshots on Proxmox VE 8 / Debian 12, replicated over SSH</text>

  <!-- ===== SOURCE HOST PANEL ===== -->
  <g transform="translate(70,170)">
    <rect width="640" height="390" rx="14" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="24" y="34" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">SOURCE HOST · PROXMOX VE 8</text>

    <!-- Sanoid timer -->
    <g transform="translate(24,52)">
      <rect width="270" height="78" rx="10" fill="#101028" stroke="#c8ff00" stroke-width="1.5"/>
      <text x="18" y="30" fill="#c8ff00" font-size="18" font-weight="700">sanoid.timer</text>
      <text x="18" y="54" fill="#c0c0d8" font-size="14">systemd · fires every 15 min</text>
      <text x="18" y="72" fill="#6b6b8a" font-size="12.5">reads /etc/sanoid/sanoid.conf</text>
    </g>

    <!-- monitor -->
    <g transform="translate(330,52)">
      <rect width="286" height="78" rx="10" fill="#101028" stroke="#1e1e3a"/>
      <text x="18" y="30" fill="#5dca7a" font-size="16" font-weight="700">sanoid --monitor-snapshots</text>
      <text x="18" y="54" fill="#c0c0d8" font-size="13.5">Nagios-style health check</text>
      <text x="18" y="72" fill="#6b6b8a" font-size="12.5">pushes status to Uptime Kuma</text>
    </g>

    <!-- arrow timer -> datasets -->
    <line x1="159" y1="130" x2="159" y2="172" stroke="#c8ff00" stroke-width="2" marker-end="url(#arrowLime)"/>
    <text x="168" y="158" fill="#c8ff00" font-size="12.5" font-weight="600">autosnap / autoprune</text>

    <!-- ZFS pool / datasets -->
    <g transform="translate(24,174)">
      <rect width="592" height="190" rx="10" fill="#101028" stroke="#1e1e3a"/>
      <text x="18" y="28" fill="#e8e8f0" font-size="15" font-weight="700">ZFS pool: datapool</text>

      <!-- dataset rows -->
      <g transform="translate(18,42)">
        <rect width="556" height="30" rx="6" fill="#0d0d28"/>
        <text x="12" y="20" fill="#c0c0d8" font-size="14">datapool/documents</text>
        <text x="544" y="20" text-anchor="end" fill="#c8ff00" font-size="13.5" font-weight="600">template_production · 24h / 30d / 12m</text>
      </g>
      <g transform="translate(18,76)">
        <rect width="556" height="30" rx="6" fill="#13132e"/>
        <text x="12" y="20" fill="#c0c0d8" font-size="14">datapool/vm-disks</text>
        <text x="544" y="20" text-anchor="end" fill="#5090e0" font-size="13.5" font-weight="600">template_vm_disks · 48h / 14d / 3m</text>
      </g>
      <g transform="translate(18,110)">
        <rect width="556" height="30" rx="6" fill="#0d0d28"/>
        <text x="12" y="20" fill="#c0c0d8" font-size="14">datapool/media</text>
        <text x="544" y="20" text-anchor="end" fill="#5090e0" font-size="13.5" font-weight="600">template_media · 7d / 3m</text>
      </g>
      <g transform="translate(18,144)">
        <rect width="556" height="30" rx="6" fill="#13132e"/>
        <text x="12" y="20" fill="#c0c0d8" font-size="14">datapool/backups</text>
        <text x="544" y="20" text-anchor="end" fill="#e08828" font-size="13.5" font-weight="600">autosnap = no (PBS handles it)</text>
      </g>
    </g>
  </g>

  <!-- ===== SYNCOID TRANSPORT ===== -->
  <g transform="translate(740,300)">
    <rect width="120" height="128" rx="10" fill="#101028" stroke="#c8ff00" stroke-width="1.5"/>
    <text x="60" y="34" text-anchor="middle" fill="#c8ff00" font-size="17" font-weight="700">syncoid</text>
    <text x="60" y="58" text-anchor="middle" fill="#c0c0d8" font-size="12">incremental</text>
    <text x="60" y="76" text-anchor="middle" fill="#c0c0d8" font-size="12">zfs send/recv</text>
    <text x="60" y="98" text-anchor="middle" fill="#6b6b8a" font-size="11.5">SSH · ed25519</text>
    <text x="60" y="115" text-anchor="middle" fill="#6b6b8a" font-size="11.5">daily 03:00</text>
  </g>

  <!-- arrow source -> syncoid -->
  <line x1="710" y1="364" x2="738" y2="364" stroke="#c8ff00" stroke-width="2.5" marker-end="url(#arrowLime)"/>
  <!-- arrow syncoid -> dest -->
  <line x1="860" y1="364" x2="912" y2="364" stroke="#5090e0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="886" y="352" text-anchor="middle" fill="#5090e0" font-size="11.5" font-weight="600">--recursive</text>

  <!-- ===== DEST HOST PANEL ===== -->
  <g transform="translate(914,170)">
    <rect width="216" height="390" rx="14" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="22" y="34" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">BACKUP HOST</text>

    <g transform="translate(22,52)">
      <rect width="172" height="78" rx="10" fill="#101028" stroke="#5090e0" stroke-width="1.5"/>
      <text x="16" y="30" fill="#5090e0" font-size="16" font-weight="700">backuppool</text>
      <text x="16" y="52" fill="#c0c0d8" font-size="13">remote ZFS pool</text>
      <text x="16" y="70" fill="#6b6b8a" font-size="12">mirrored snapshots</text>
    </g>

    <g transform="translate(22,148)">
      <rect width="172" height="92" rx="10" fill="#101028" stroke="#1e1e3a"/>
      <text x="16" y="28" fill="#e8e8f0" font-size="14" font-weight="700">Replicated sets</text>
      <text x="16" y="52" fill="#c0c0d8" font-size="13">documents</text>
      <text x="16" y="74" fill="#c0c0d8" font-size="13">vm-disks</text>
    </g>

    <g transform="translate(22,256)">
      <rect width="172" height="108" rx="10" fill="#101028" stroke="#5dca7a"/>
      <text x="16" y="28" fill="#5dca7a" font-size="14" font-weight="700">Restore test</text>
      <text x="16" y="52" fill="#c0c0d8" font-size="12.5">zfs clone snapshot</text>
      <text x="16" y="72" fill="#c0c0d8" font-size="12.5">mount + verify files</text>
      <text x="16" y="93" fill="#6b6b8a" font-size="11.5">not optional</text>
    </g>
  </g>

  <!-- Retention math callout -->
  <text x="70" y="588" fill="#6b6b8a" font-size="13.5">Production retention overhead: <tspan fill="#c8ff00" font-weight="700">66 snapshots</tspan> ≈ <tspan fill="#c8ff00" font-weight="700">66 GB</tspan> for a 1 GB/day dataset (unchanged blocks shared)</text>

  <!-- Footer -->
  <text x="70" y="615" fill="#4a4a6a" font-size="13">TechFuel HQ · Setup Tutorial · Config per sanoid.conf in this guide</text>
  <text x="1130" y="615" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
