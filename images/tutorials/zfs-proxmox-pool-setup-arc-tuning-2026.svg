<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>ZFS on Proxmox VE 8 storage architecture: physical drives to vdevs to pool, RAM split between ARC and VMs, datasets, and scrub/snapshot/replication flows</title>
  <desc>Topology diagram for a ZFS pool named datapool on Proxmox VE 8. Four 16TB drives feed mirror or RAIDZ1 vdevs that form the pool. Host RAM is split into 10GB ARC cache, 48GB VM RAM, and 6GB OS headroom on a 64GB host. The pool hosts vm-disks (lz4), backups (zstd-3), media (off), and docker (lz4) datasets, with monthly scrubs, sanoid snapshots, and zfs send replication to a remote host.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5090e0"/>
    </marker>
    <marker id="arrowlime" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c8ff00"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="58" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">SETUP TUTORIAL · STORAGE ARCHITECTURE</text>
  <text x="70" y="98" fill="#e8e8f0" font-size="40" font-weight="900">ZFS on Proxmox VE 8: Pool, ARC &amp; Datasets</text>
  <text x="70" y="126" fill="#6b6b8a" font-size="17">datapool — from physical drives to VM storage, scrubs, and replication</text>

  <!-- COLUMN 1: Physical drives -->
  <text x="70" y="172" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">PHYSICAL DRIVES · /dev/disk/by-id/</text>
  <g>
    <rect x="70" y="186" width="210" height="46" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="84" y="208" fill="#e8e8f0" font-size="14" font-weight="600">16TB Seagate IronWolf</text>
    <text x="84" y="225" fill="#6b6b8a" font-size="12">ata-ST16000NM001G ×2</text>

    <rect x="70" y="244" width="210" height="46" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="84" y="266" fill="#e8e8f0" font-size="14" font-weight="600">16TB WD Gold</text>
    <text x="84" y="283" fill="#6b6b8a" font-size="12">ata-WDC_WD161KRYZ ×2</text>
  </g>

  <!-- COLUMN 2: vdevs -->
  <text x="330" y="172" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">VDEV TOPOLOGY</text>
  <g>
    <rect x="330" y="186" width="190" height="46" rx="8" fill="#101028" stroke="#c8ff00"/>
    <text x="344" y="208" fill="#c8ff00" font-size="14" font-weight="700">mirror vdev ×2</text>
    <text x="344" y="225" fill="#c0c0d8" font-size="12">2× IOPS · best for VMs</text>

    <rect x="330" y="244" width="190" height="46" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="344" y="266" fill="#e8e8f0" font-size="14" font-weight="600">raidz1 (4-disk)</text>
    <text x="344" y="283" fill="#6b6b8a" font-size="12">max capacity · 1-drive FT</text>
  </g>

  <!-- COLUMN 3: Pool -->
  <text x="570" y="172" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">ZPOOL</text>
  <rect x="570" y="186" width="160" height="104" rx="10" fill="#101028" stroke="#5090e0"/>
  <text x="650" y="226" text-anchor="middle" fill="#5090e0" font-size="20" font-weight="900">datapool</text>
  <text x="650" y="250" text-anchor="middle" fill="#c0c0d8" font-size="12">ashift=12</text>
  <text x="650" y="270" text-anchor="middle" fill="#c0c0d8" font-size="12">compression=lz4</text>

  <!-- arrows drives -> vdev -->
  <line x1="280" y1="209" x2="328" y2="209" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="267" x2="328" y2="267" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- arrows vdev -> pool -->
  <line x1="520" y1="209" x2="568" y2="222" stroke="#c8ff00" stroke-width="2" marker-end="url(#arrowlime)"/>
  <line x1="520" y1="267" x2="568" y2="254" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RAM split panel (right) -->
  <text x="770" y="172" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">HOST RAM · 64GB EXAMPLE</text>
  <rect x="770" y="186" width="360" height="104" rx="10" fill="#101028" stroke="#1e1e3a"/>
  <!-- stacked bar -->
  <rect x="786" y="206" width="100" height="30" rx="4" fill="#c8ff00"/>
  <rect x="886" y="206" width="200" height="30" rx="4" fill="#5090e0"/>
  <rect x="1086" y="206" width="28" height="30" rx="4" fill="#6b6b8a"/>
  <text x="836" y="227" text-anchor="middle" fill="#0a0a23" font-size="13" font-weight="700">ARC 10GB</text>
  <text x="986" y="227" text-anchor="middle" fill="#0a0a23" font-size="13" font-weight="700">VM RAM 48GB</text>
  <text x="786" y="266" fill="#c0c0d8" font-size="12.5">zfs_arc_max caps ARC so it can't starve VMs.</text>
  <text x="786" y="283" fill="#6b6b8a" font-size="12.5">Default ARC = 50% of RAM · OS headroom 6GB (right).</text>

  <!-- DATASETS row -->
  <text x="70" y="332" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">DATASETS · per-workload compression</text>
  <g>
    <rect x="70" y="346" width="255" height="64" rx="9" fill="#101028" stroke="#1e1e3a"/>
    <text x="86" y="372" fill="#e8e8f0" font-size="15" font-weight="600">datapool/vm-disks</text>
    <text x="86" y="394" fill="#c8ff00" font-size="13" font-weight="700">compression=lz4</text>

    <rect x="340" y="346" width="255" height="64" rx="9" fill="#101028" stroke="#1e1e3a"/>
    <text x="356" y="372" fill="#e8e8f0" font-size="15" font-weight="600">datapool/backups</text>
    <text x="356" y="394" fill="#5dca7a" font-size="13" font-weight="700">compression=zstd-3</text>

    <rect x="610" y="346" width="255" height="64" rx="9" fill="#101028" stroke="#1e1e3a"/>
    <text x="626" y="372" fill="#e8e8f0" font-size="15" font-weight="600">datapool/media</text>
    <text x="626" y="394" fill="#e08828" font-size="13" font-weight="700">compression=off</text>

    <rect x="880" y="346" width="250" height="64" rx="9" fill="#101028" stroke="#1e1e3a"/>
    <text x="896" y="372" fill="#e8e8f0" font-size="15" font-weight="600">datapool/docker</text>
    <text x="896" y="394" fill="#c8ff00" font-size="13" font-weight="700">compression=lz4</text>
  </g>
  <!-- pool -> datasets connector -->
  <line x1="650" y1="290" x2="650" y2="316" stroke="#1e1e3a" stroke-width="2"/>
  <line x1="197" y1="316" x2="1005" y2="316" stroke="#1e1e3a" stroke-width="2"/>
  <line x1="197" y1="316" x2="197" y2="344" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="467" y1="316" x2="467" y2="344" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="737" y1="316" x2="737" y2="344" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1005" y1="316" x2="1005" y2="344" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DATA INTEGRITY & PROTECTION row -->
  <text x="70" y="450" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">INTEGRITY &amp; PROTECTION JOBS</text>
  <g>
    <rect x="70" y="464" width="345" height="92" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="86" y="490" fill="#5dca7a" font-size="15" font-weight="700">Monthly scrub</text>
    <text x="86" y="513" fill="#c0c0d8" font-size="13">systemd: zfs-scrub@datapool.timer</text>
    <text x="86" y="533" fill="#6b6b8a" font-size="12.5">~100–200MB/s · 40TB array = 2–5 days</text>
    <text x="86" y="550" fill="#6b6b8a" font-size="12.5">reads every block, compares checksums</text>

    <rect x="430" y="464" width="345" height="92" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="446" y="490" fill="#5090e0" font-size="15" font-weight="700">sanoid snapshots</text>
    <text x="446" y="513" fill="#c0c0d8" font-size="13">copy-on-write · instant · autoprune</text>
    <text x="446" y="533" fill="#6b6b8a" font-size="12.5">vm-disks: 24 hourly · 30 daily · 3 monthly</text>
    <text x="446" y="550" fill="#6b6b8a" font-size="12.5">backups: 7 daily · 2 monthly</text>

    <rect x="790" y="464" width="340" height="92" rx="10" fill="#101028" stroke="#c8ff00"/>
    <text x="806" y="490" fill="#c8ff00" font-size="15" font-weight="700">zfs send replication</text>
    <text x="806" y="513" fill="#c0c0d8" font-size="13">incremental send → ssh root@192.168.1.20</text>
    <text x="806" y="533" fill="#6b6b8a" font-size="12.5">syncoid automates the send/receive cycle</text>
    <text x="806" y="550" fill="#6b6b8a" font-size="12.5">remote: backuppool/vm-disks-from-proxmox</text>
  </g>

  <!-- Footer -->
  <text x="70" y="592" fill="#4a4a6a" font-size="13">TechFuel HQ · Setup Tutorial · Topology per OpenZFS / Proxmox VE 8 commands in this guide</text>
  <text x="1130" y="592" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
