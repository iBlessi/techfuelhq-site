<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>Home Assistant OS as a Proxmox VM — architecture diagram</title>
  <desc>Topology of HAOS running as a VM on a Proxmox host: q35 UEFI VM with SCSI disk and VirtIO network on vmbr0, the Supervisor orchestrating add-ons (Zigbee2MQTT, Frigate, Tailscale, Rclone), USB passthrough of a Zigbee/Z-Wave coordinator by vendor/product ID, the HA UI on port 8123, and a two-layer backup of PBS VM snapshots plus HA config backups to a NAS.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5090e0"/>
    </marker>
    <marker id="arrowLime" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#c8ff00"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <text x="70" y="60" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">SETUP TUTORIAL · PROXMOX VE + HOME ASSISTANT OS</text>
  <text x="70" y="104" fill="#e8e8f0" font-size="44" font-weight="900">Home Assistant OS as a Proxmox VM</text>
  <text x="70" y="136" fill="#6b6b8a" font-size="18">The supported path: HAOS in a q35/UEFI VM — Supervisor, add-ons, and HA snapshots intact</text>

  <!-- Proxmox host outer container -->
  <rect x="60" y="168" width="700" height="392" rx="14" fill="#0d0d28" stroke="#1e1e3a" stroke-width="1.5"/>
  <text x="84" y="200" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">PROXMOX VE HOST · NODE</text>
  <text x="736" y="200" text-anchor="end" fill="#5dca7a" font-size="13" font-weight="700">CPU type: host</text>

  <!-- HAOS VM -->
  <rect x="84" y="216" width="652" height="236" rx="12" fill="#101028" stroke="#c8ff00" stroke-width="1.5"/>
  <text x="104" y="246" fill="#c8ff00" font-size="15" letter-spacing="1" font-weight="800">HAOS VM · ID 200</text>
  <text x="716" y="246" text-anchor="end" fill="#c0c0d8" font-size="13">q35 · OVMF (UEFI) · SCSI · VirtIO</text>

  <!-- Supervisor band -->
  <rect x="104" y="262" width="612" height="38" rx="8" fill="#13132e" stroke="#1e1e3a"/>
  <text x="120" y="286" fill="#e8e8f0" font-size="15" font-weight="700">Home Assistant Supervisor</text>
  <text x="700" y="286" text-anchor="end" fill="#6b6b8a" font-size="13">manages OS updates + add-on store</text>

  <!-- Add-on tiles -->
  <g>
    <rect x="104" y="312" width="146" height="62" rx="8" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="177" y="338" text-anchor="middle" fill="#e8e8f0" font-size="14" font-weight="700">Zigbee2MQTT</text>
    <text x="177" y="358" text-anchor="middle" fill="#6b6b8a" font-size="12">/dev/ttyACM0</text>
  </g>
  <g>
    <rect x="260" y="312" width="146" height="62" rx="8" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="333" y="338" text-anchor="middle" fill="#e8e8f0" font-size="14" font-weight="700">Frigate NVR</text>
    <text x="333" y="358" text-anchor="middle" fill="#6b6b8a" font-size="12">video add-on</text>
  </g>
  <g>
    <rect x="416" y="312" width="146" height="62" rx="8" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="489" y="338" text-anchor="middle" fill="#e8e8f0" font-size="14" font-weight="700">Tailscale</text>
    <text x="489" y="358" text-anchor="middle" fill="#6b6b8a" font-size="12">remote access</text>
  </g>
  <g>
    <rect x="572" y="312" width="144" height="62" rx="8" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="644" y="338" text-anchor="middle" fill="#e8e8f0" font-size="14" font-weight="700">Rclone</text>
    <text x="644" y="358" text-anchor="middle" fill="#6b6b8a" font-size="12">off-site sync</text>
  </g>

  <!-- VM resource footer -->
  <rect x="104" y="388" width="612" height="48" rx="8" fill="#13132e" stroke="#1e1e3a"/>
  <text x="120" y="408" fill="#6b6b8a" font-size="12" letter-spacing="1" font-weight="700">RESOURCES</text>
  <text x="120" y="427" fill="#c0c0d8" font-size="14">Min <tspan fill="#e8e8f0" font-weight="700">2 vCPU · 2GB · 32GB</tspan>  ·  Recommended <tspan fill="#c8ff00" font-weight="700">4 vCPU · 4GB</tspan></text>
  <text x="700" y="427" text-anchor="end" fill="#c0c0d8" font-size="14">Disk grows on resize: <tspan fill="#e8e8f0" font-weight="700">qm resize 200 scsi0 +32G</tspan></text>

  <!-- USB coordinator box -->
  <rect x="60" y="488" width="340" height="72" rx="12" fill="#101028" stroke="#e08828" stroke-width="1.5"/>
  <text x="80" y="514" fill="#e08828" font-size="13" letter-spacing="2" font-weight="700">USB PASSTHROUGH</text>
  <text x="80" y="538" fill="#c0c0d8" font-size="14">Zigbee / Z-Wave coordinator</text>
  <text x="80" y="556" fill="#6b6b8a" font-size="12">by vendor:product ID (e.g. 1a86:55d4)</text>

  <!-- LAN / network box -->
  <rect x="416" y="488" width="344" height="72" rx="12" fill="#101028" stroke="#5090e0" stroke-width="1.5"/>
  <text x="436" y="514" fill="#5090e0" font-size="13" letter-spacing="2" font-weight="700">NETWORK · vmbr0 (LAN BRIDGE)</text>
  <text x="436" y="538" fill="#c0c0d8" font-size="14">VirtIO NIC · DHCP · host "homeassistant"</text>
  <text x="436" y="556" fill="#6b6b8a" font-size="12">HA dashboard at http://&lt;ip&gt;:8123</text>

  <!-- arrows from peripherals into VM -->
  <line x1="200" y1="488" x2="200" y2="454" stroke="#e08828" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="488" x2="560" y2="454" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right column: backup + clients -->
  <!-- Backup panel -->
  <rect x="800" y="168" width="336" height="232" rx="14" fill="#101028" stroke="#1e1e3a"/>
  <text x="824" y="200" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">TWO-LAYER BACKUP</text>

  <rect x="824" y="216" width="288" height="78" rx="8" fill="#0d0d28" stroke="#1e1e3a"/>
  <text x="844" y="244" fill="#e8e8f0" font-size="15" font-weight="700">PBS · full VM snapshot</text>
  <text x="844" y="268" fill="#c0c0d8" font-size="13">Proxmox Backup Server captures the</text>
  <text x="844" y="285" fill="#c0c0d8" font-size="13">entire HAOS VM (3-2-1)</text>

  <rect x="824" y="306" width="288" height="78" rx="8" fill="#0d0d28" stroke="#1e1e3a"/>
  <text x="844" y="334" fill="#e8e8f0" font-size="15" font-weight="700">HA config backups → NAS</text>
  <text x="844" y="358" fill="#c0c0d8" font-size="13">Supervisor .tar snapshots over</text>
  <text x="844" y="375" fill="#c0c0d8" font-size="13">SMB/CIFS, smaller and portable</text>

  <!-- Remote access panel -->
  <rect x="800" y="416" width="336" height="144" rx="14" fill="#101028" stroke="#1e1e3a"/>
  <text x="824" y="448" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">REMOTE ACCESS</text>
  <text x="824" y="478" fill="#c0c0d8" font-size="14">Tailscale add-on <tspan fill="#5dca7a" font-weight="700">(free, tailnet)</tspan></text>
  <text x="824" y="505" fill="#c0c0d8" font-size="14">Nabu Casa Cloud <tspan fill="#c8ff00" font-weight="700">($65/yr)</tspan></text>
  <text x="824" y="532" fill="#c0c0d8" font-size="14">NGINX Proxy Manager <tspan fill="#6b6b8a">(HTTPS)</tspan></text>

  <!-- connectors from VM to backup + remote -->
  <line x1="736" y1="320" x2="800" y2="285" stroke="#c8ff00" stroke-width="2" marker-end="url(#arrowLime)"/>
  <line x1="736" y1="360" x2="800" y2="470" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="70" y="600" fill="#4a4a6a" font-size="13">TechFuel HQ · Tutorial · Architecture per the HAOS-on-Proxmox install guide; HA system requirements per Home Assistant docs</text>
  <text x="1130" y="600" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
