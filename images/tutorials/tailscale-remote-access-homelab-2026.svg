<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>Tailscale homelab remote access topology</title>
  <desc>Architecture diagram: remote laptop and phone connect over the Tailscale tailnet (100.x.x.x, WireGuard, DERP relay for CGNAT) to a Proxmox or LXC subnet router that advertises the home LAN 192.168.1.0/24, reaching the NAS, router, Pi-hole, IP camera and printer.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c8ff00"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5090e0"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="60" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">SETUP TUTORIAL · MESH VPN TOPOLOGY</text>
  <text x="70" y="104" fill="#e8e8f0" font-size="44" font-weight="900">Tailscale Remote Access for the Homelab</text>
  <text x="70" y="136" fill="#6b6b8a" font-size="18">One subnet router on Proxmox reaches every device on your LAN — no port forwarding</text>

  <!-- Column labels -->
  <text x="195" y="184" text-anchor="middle" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">REMOTE CLIENTS</text>
  <text x="600" y="184" text-anchor="middle" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">TAILNET · 100.x.x.x</text>
  <text x="1000" y="184" text-anchor="middle" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">HOME LAN · 192.168.1.0/24</text>

  <!-- ===== Remote clients ===== -->
  <g>
    <rect x="70" y="210" width="250" height="86" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="90" y="244" fill="#e8e8f0" font-size="18" font-weight="700">Laptop</text>
    <text x="90" y="270" fill="#c0c0d8" font-size="14">Hotel WiFi · ssh proxmox</text>
    <text x="90" y="288" fill="#6b6b8a" font-size="13">--accept-routes</text>

    <rect x="70" y="316" width="250" height="86" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="90" y="350" fill="#e8e8f0" font-size="18" font-weight="700">Phone</text>
    <text x="90" y="376" fill="#c0c0d8" font-size="14">Cellular / CGNAT</text>
    <text x="90" y="394" fill="#6b6b8a" font-size="13">routes accepted automatically</text>
  </g>

  <!-- Client -> tailnet arrows -->
  <line x1="320" y1="253" x2="448" y2="290" stroke="#c8ff00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="359" x2="448" y2="322" stroke="#c8ff00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Tailnet core ===== -->
  <g>
    <rect x="452" y="222" width="296" height="170" rx="14" fill="#0d0d28" stroke="#c8ff00" stroke-width="1.5"/>
    <text x="600" y="252" text-anchor="middle" fill="#c8ff00" font-size="17" font-weight="800">WireGuard Mesh VPN</text>
    <line x1="478" y1="266" x2="722" y2="266" stroke="#1e1e3a" stroke-width="1"/>
    <text x="478" y="294" fill="#c0c0d8" font-size="14">Encrypted peer-to-peer tunnels</text>
    <text x="478" y="320" fill="#c0c0d8" font-size="14">NAT traversal · no exposed ports</text>

    <rect x="478" y="334" width="244" height="44" rx="8" fill="#101028" stroke="#1e1e3a"/>
    <text x="494" y="362" fill="#e08828" font-size="14" font-weight="700">DERP relay</text>
    <text x="708" y="362" text-anchor="end" fill="#6b6b8a" font-size="13">punches through CGNAT</text>
  </g>

  <!-- Tailnet -> subnet router arrow -->
  <line x1="748" y1="307" x2="852" y2="307" stroke="#c8ff00" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="800" y="298" text-anchor="middle" fill="#6b6b8a" font-size="12">tailnet</text>

  <!-- ===== Subnet router ===== -->
  <g>
    <rect x="856" y="232" width="288" height="150" rx="14" fill="#101028" stroke="#5dca7a" stroke-width="1.5"/>
    <text x="1000" y="262" text-anchor="middle" fill="#5dca7a" font-size="13" letter-spacing="2" font-weight="700">SUBNET ROUTER</text>
    <text x="1000" y="294" text-anchor="middle" fill="#e8e8f0" font-size="20" font-weight="800">Proxmox host / LXC</text>
    <text x="1000" y="322" text-anchor="middle" fill="#c0c0d8" font-size="14">--advertise-routes=192.168.1.0/24</text>
    <text x="1000" y="346" text-anchor="middle" fill="#c0c0d8" font-size="13">ip_forward = 1 · TUN device</text>
    <text x="1000" y="368" text-anchor="middle" fill="#6b6b8a" font-size="13">route approved in admin console</text>
  </g>

  <!-- Subnet router -> LAN devices -->
  <line x1="1000" y1="382" x2="1000" y2="426" stroke="#5090e0" stroke-width="2" marker-end="url(#arrowblue)"/>

  <!-- ===== Home LAN devices ===== -->
  <g>
    <rect x="824" y="432" width="352" height="120" rx="12" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="848" y="462" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">REACHABLE WITHOUT TAILSCALE INSTALLED</text>

    <rect x="848" y="476" width="148" height="30" rx="6" fill="#101028" stroke="#1e1e3a"/>
    <text x="922" y="496" text-anchor="middle" fill="#c0c0d8" font-size="13">NAS</text>

    <rect x="1004" y="476" width="148" height="30" rx="6" fill="#101028" stroke="#1e1e3a"/>
    <text x="1078" y="496" text-anchor="middle" fill="#c0c0d8" font-size="13">Router admin</text>

    <rect x="848" y="512" width="98" height="30" rx="6" fill="#101028" stroke="#1e1e3a"/>
    <text x="897" y="532" text-anchor="middle" fill="#c0c0d8" font-size="13">Pi-hole DNS</text>

    <rect x="954" y="512" width="98" height="30" rx="6" fill="#101028" stroke="#1e1e3a"/>
    <text x="1003" y="532" text-anchor="middle" fill="#c0c0d8" font-size="13">IP camera</text>

    <rect x="1060" y="512" width="92" height="30" rx="6" fill="#101028" stroke="#1e1e3a"/>
    <text x="1106" y="532" text-anchor="middle" fill="#c0c0d8" font-size="13">Printer</text>
  </g>

  <!-- MagicDNS callout -->
  <g>
    <rect x="70" y="432" width="690" height="120" rx="12" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="94" y="462" fill="#c8ff00" font-size="13" letter-spacing="2" font-weight="700">MAGICDNS · NAME RESOLUTION</text>
    <text x="94" y="492" fill="#c0c0d8" font-size="15">Devices answer to hostname.your-tailnet.ts.net — e.g. proxmox.coral-raccoon.ts.net</text>
    <text x="94" y="518" fill="#c0c0d8" font-size="15">Open the Proxmox web UI at https://proxmox:8006 from anywhere on the tailnet</text>
    <text x="94" y="540" fill="#6b6b8a" font-size="13">Free tier: up to 100 devices · 3 users · built on WireGuard</text>
  </g>

  <!-- Footer -->
  <text x="70" y="600" fill="#4a4a6a" font-size="13">TechFuel HQ · Setup Tutorial · Topology per Tailscale official documentation</text>
  <text x="1130" y="600" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
