<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>Vaultwarden on Proxmox architecture: a Debian 12 LXC runs the Vaultwarden binary on 127.0.0.1:8080 behind a Caddy reverse proxy that terminates Let's Encrypt HTTPS, with Tailscale access, daily SQLite backups to NAS, and official Bitwarden clients syncing in.</title>
  <desc>Topology diagram showing the Proxmox VE host containing a Debian 12 LXC. Inside the LXC, Vaultwarden listens on localhost port 8080 and Caddy reverse-proxies it over HTTPS. Browser, mobile, and desktop Bitwarden clients connect from the left. A daily backup job copies the SQLite database, attachments, and RSA keys to a NAS. Resource usage is roughly 100MB RAM total.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#5090e0"/>
    </marker>
    <marker id="arrowlime" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#c8ff00"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <text x="70" y="58" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">SETUP TUTORIAL · SELF-HOSTED PASSWORD MANAGER</text>
  <text x="70" y="100" fill="#e8e8f0" font-size="40" font-weight="900">Vaultwarden on Proxmox</text>
  <text x="70" y="130" fill="#6b6b8a" font-size="18">Bitwarden-compatible vault in a Debian LXC, HTTPS via Caddy, ~100MB RAM total</text>

  <!-- Bitwarden clients column -->
  <text x="70" y="186" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">OFFICIAL BITWARDEN CLIENTS</text>
  <g>
    <rect x="70" y="202" width="190" height="56" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="86" y="227" fill="#e8e8f0" font-size="15" font-weight="600">Browser extension</text>
    <text x="86" y="247" fill="#6b6b8a" font-size="12">Chrome · Firefox · Safari</text>
  </g>
  <g>
    <rect x="70" y="270" width="190" height="56" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="86" y="295" fill="#e8e8f0" font-size="15" font-weight="600">Mobile app</text>
    <text x="86" y="315" fill="#6b6b8a" font-size="12">iOS · Android autofill</text>
  </g>
  <g>
    <rect x="70" y="338" width="190" height="56" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="86" y="363" fill="#e8e8f0" font-size="15" font-weight="600">Desktop app</text>
    <text x="86" y="383" fill="#6b6b8a" font-size="12">Self-hosted server URL</text>
  </g>

  <!-- Sync arrows from clients to proxy -->
  <text x="300" y="262" fill="#c8ff00" font-size="12" font-weight="700" text-anchor="middle">HTTPS sync</text>
  <line x1="260" y1="230" x2="378" y2="290" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="298" x2="378" y2="298" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="366" x2="378" y2="306" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Proxmox host outer box -->
  <rect x="390" y="200" width="500" height="288" rx="14" fill="#0d0d28" stroke="#1e1e3a" stroke-width="1.5"/>
  <text x="410" y="224" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">PROXMOX VE 8.x HOST · mini PC, 16GB RAM</text>

  <!-- Debian LXC inner box -->
  <rect x="410" y="238" width="460" height="232" rx="12" fill="#101028" stroke="#c8ff00" stroke-width="1.5"/>
  <text x="428" y="262" fill="#c8ff00" font-size="13" letter-spacing="2" font-weight="700">DEBIAN 12 LXC · 1 core · 256–512MB RAM · 8GB</text>

  <!-- Caddy box -->
  <g>
    <rect x="428" y="278" width="424" height="62" rx="10" fill="#0d0d28" stroke="#5090e0"/>
    <text x="446" y="304" fill="#e8e8f0" font-size="17" font-weight="700">Caddy reverse proxy</text>
    <text x="446" y="326" fill="#c0c0d8" font-size="13">Auto Let's Encrypt HTTPS · ports 80/443 → :8080</text>
    <text x="836" y="313" text-anchor="end" fill="#5090e0" font-size="13" font-weight="700">~15MB</text>
  </g>

  <!-- internal proxy arrow -->
  <text x="640" y="362" fill="#6b6b8a" font-size="12" text-anchor="middle">reverse_proxy localhost:8080</text>
  <line x1="640" y1="340" x2="640" y2="372" stroke="#c8ff00" stroke-width="2" marker-end="url(#arrowlime)"/>

  <!-- Vaultwarden box -->
  <g>
    <rect x="428" y="378" width="424" height="74" rx="10" fill="#0d0d28" stroke="#c8ff00"/>
    <text x="446" y="406" fill="#e8e8f0" font-size="17" font-weight="700">Vaultwarden (Rust)</text>
    <text x="446" y="428" fill="#c0c0d8" font-size="13">Listens 127.0.0.1:8080 · SQLite db.sqlite3</text>
    <text x="446" y="446" fill="#6b6b8a" font-size="12">SIGNUPS_ALLOWED=false · ADMIN_TOKEN · TOTP 2FA</text>
    <text x="836" y="406" text-anchor="end" fill="#c8ff00" font-size="13" font-weight="700">~85MB</text>
  </g>

  <!-- Access methods -->
  <text x="920" y="224" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">ACCESS</text>
  <g>
    <rect x="920" y="238" width="210" height="50" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="936" y="260" fill="#e8e8f0" font-size="14" font-weight="600">Public + Let's Encrypt</text>
    <text x="936" y="278" fill="#6b6b8a" font-size="12">router forwards 80/443</text>
  </g>
  <g>
    <rect x="920" y="298" width="210" height="50" rx="10" fill="#101028" stroke="#5dca7a"/>
    <text x="936" y="320" fill="#e8e8f0" font-size="14" font-weight="600">Tailscale-only HTTPS</text>
    <text x="936" y="338" fill="#5dca7a" font-size="12">no public port exposure</text>
  </g>
  <line x1="852" y1="305" x2="912" y2="290" stroke="#5090e0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="852" y1="312" x2="912" y2="320" stroke="#5dca7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Backup box -->
  <g>
    <rect x="920" y="378" width="210" height="92" rx="10" fill="#101028" stroke="#e08828"/>
    <text x="936" y="400" fill="#e08828" font-size="13" letter-spacing="1" font-weight="700">DAILY BACKUP · 2 AM</text>
    <text x="936" y="422" fill="#c0c0d8" font-size="13">SQLite .backup API</text>
    <text x="936" y="440" fill="#c0c0d8" font-size="13">attachments/ · rsa_key*</text>
    <text x="936" y="460" fill="#6b6b8a" font-size="12">→ NAS, 30-day retention</text>
  </g>
  <line x1="852" y1="415" x2="912" y2="415" stroke="#e08828" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stats strip -->
  <g transform="translate(70,512)">
    <text x="0" y="0" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">MEASURED LOAD · 3 USERS · 1200 VAULT ITEMS</text>
    <text x="0" y="34" fill="#c8ff00" font-size="30" font-weight="900">~100MB</text>
    <text x="0" y="54" fill="#6b6b8a" font-size="13">total container RAM</text>
    <text x="240" y="34" fill="#5dca7a" font-size="30" font-weight="900">&lt;1%</text>
    <text x="240" y="54" fill="#6b6b8a" font-size="13">CPU idle</text>
    <text x="420" y="34" fill="#5090e0" font-size="30" font-weight="900">~45MB</text>
    <text x="420" y="54" fill="#6b6b8a" font-size="13">database + OS disk</text>
    <text x="660" y="34" fill="#e8e8f0" font-size="30" font-weight="900">&lt; 1 hr</text>
    <text x="660" y="54" fill="#6b6b8a" font-size="13">zero to synced</text>
  </g>

  <text x="70" y="592" fill="#4a4a6a" font-size="13">TechFuel HQ · Setup Tutorial · Resource figures measured on the author's Debian 12 LXC</text>
  <text x="1130" y="592" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
