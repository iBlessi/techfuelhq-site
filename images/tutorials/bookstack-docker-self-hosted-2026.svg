<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>BookStack self-hosted Docker stack architecture</title>
  <desc>Topology diagram of the BookStack Docker setup: a browser connects over HTTPS through Nginx Proxy Manager to the bookstack PHP/nginx container on port 6875 mapped to 80, which talks to a MySQL 8 database container. The bookstack container persists uploads in a config volume and the database stores data in /opt/bookstack/db. Idle RAM is approximately 180 MB combined.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="74" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">SETUP TUTORIAL · SELF-HOSTED WIKI</text>
  <text x="70" y="122" fill="#e8e8f0" font-size="44" font-weight="900">BookStack on Docker</text>
  <text x="70" y="156" fill="#6b6b8a" font-size="19">Two-container stack — request flow and persistent storage</text>

  <!-- ============ TOP ROW: request flow ============ -->
  <!-- Browser / user -->
  <g transform="translate(70,210)">
    <rect width="190" height="118" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="20" y="30" fill="#6b6b8a" font-size="12" letter-spacing="2" font-weight="700">CLIENT</text>
    <text x="20" y="62" fill="#e8e8f0" font-size="20" font-weight="700">Browser</text>
    <text x="20" y="88" fill="#c0c0d8" font-size="14">User or team member</text>
    <text x="20" y="108" fill="#5090e0" font-size="13" font-weight="600">responsive · mobile-ready</text>
  </g>

  <!-- Arrow browser -> NPM -->
  <line x1="260" y1="269" x2="332" y2="269" stroke="#5dca7a" stroke-width="2.5"/>
  <polygon points="332,269 322,264 322,274" fill="#5dca7a"/>
  <text x="296" y="258" fill="#5dca7a" font-size="12" font-weight="700" text-anchor="middle">HTTPS</text>
  <text x="296" y="290" fill="#6b6b8a" font-size="11" text-anchor="middle">443</text>

  <!-- Nginx Proxy Manager -->
  <g transform="translate(334,210)">
    <rect width="208" height="118" rx="12" fill="#101028" stroke="#5dca7a" stroke-width="1.5"/>
    <text x="20" y="30" fill="#5dca7a" font-size="12" letter-spacing="2" font-weight="700">REVERSE PROXY</text>
    <text x="20" y="62" fill="#e8e8f0" font-size="20" font-weight="700">Nginx Proxy Mgr</text>
    <text x="20" y="88" fill="#c0c0d8" font-size="14">Let's Encrypt SSL</text>
    <text x="20" y="108" fill="#6b6b8a" font-size="13">client_max_body_size 100M</text>
  </g>

  <!-- Arrow NPM -> bookstack -->
  <line x1="542" y1="269" x2="616" y2="269" stroke="#c8ff00" stroke-width="2.5"/>
  <polygon points="616,269 606,264 606,274" fill="#c8ff00"/>
  <text x="579" y="258" fill="#c8ff00" font-size="12" font-weight="700" text-anchor="middle">HTTP</text>
  <text x="579" y="290" fill="#6b6b8a" font-size="11" text-anchor="middle">6875 to 80</text>

  <!-- bookstack app container -->
  <g transform="translate(618,210)">
    <rect width="232" height="118" rx="12" fill="#101028" stroke="#c8ff00" stroke-width="1.5"/>
    <text x="20" y="30" fill="#c8ff00" font-size="12" letter-spacing="2" font-weight="700">APP CONTAINER</text>
    <text x="20" y="62" fill="#e8e8f0" font-size="20" font-weight="700">bookstack</text>
    <text x="20" y="88" fill="#c0c0d8" font-size="14">PHP + embedded nginx</text>
    <text x="20" y="108" fill="#6b6b8a" font-size="13">lscr.io/linuxserver/bookstack</text>
  </g>

  <!-- Arrow bookstack -> db -->
  <line x1="850" y1="269" x2="922" y2="269" stroke="#5090e0" stroke-width="2.5"/>
  <polygon points="922,269 912,264 912,274" fill="#5090e0"/>
  <text x="886" y="258" fill="#5090e0" font-size="12" font-weight="700" text-anchor="middle">SQL</text>
  <text x="886" y="290" fill="#6b6b8a" font-size="11" text-anchor="middle">3306</text>

  <!-- MySQL db container -->
  <g transform="translate(924,210)">
    <rect width="206" height="118" rx="12" fill="#101028" stroke="#5090e0" stroke-width="1.5"/>
    <text x="20" y="30" fill="#5090e0" font-size="12" letter-spacing="2" font-weight="700">DATABASE</text>
    <text x="20" y="62" fill="#e8e8f0" font-size="20" font-weight="700">bookstack-db</text>
    <text x="20" y="88" fill="#c0c0d8" font-size="14">MySQL 8</text>
    <text x="20" y="108" fill="#6b6b8a" font-size="13">db: bookstackapp</text>
  </g>

  <!-- ============ STORAGE ROW ============ -->
  <text x="70" y="392" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">PERSISTENT STORAGE</text>

  <!-- volume arrow from bookstack down -->
  <line x1="700" y1="328" x2="700" y2="408" stroke="#c8ff00" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>
  <polygon points="700,408 695,398 705,398" fill="#c8ff00" opacity="0.7"/>
  <!-- volume arrow from db down -->
  <line x1="1027" y1="328" x2="1027" y2="408" stroke="#5090e0" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>
  <polygon points="1027,408 1022,398 1032,398" fill="#5090e0" opacity="0.7"/>

  <!-- config volume -->
  <g transform="translate(618,410)">
    <rect width="232" height="92" rx="12" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="20" y="30" fill="#c8ff00" font-size="13" font-weight="700">Volume: bookstack_config</text>
    <text x="20" y="54" fill="#c0c0d8" font-size="14">mounted at /config</text>
    <text x="20" y="76" fill="#6b6b8a" font-size="13">uploads, images, attachments</text>
  </g>

  <!-- db volume -->
  <g transform="translate(924,410)">
    <rect width="206" height="92" rx="12" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="20" y="30" fill="#5090e0" font-size="13" font-weight="700">Host bind mount</text>
    <text x="20" y="54" fill="#c0c0d8" font-size="14">/opt/bookstack/db</text>
    <text x="20" y="76" fill="#6b6b8a" font-size="13">/var/lib/mysql</text>
  </g>

  <!-- ============ LEFT STATS PANEL ============ -->
  <g transform="translate(70,360)">
    <rect width="488" height="172" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="24" y="34" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">STACK FOOTPRINT</text>

    <text x="24" y="68" fill="#c0c0d8" font-size="15">bookstack RAM (idle / peak)</text>
    <text x="464" y="68" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">~80 MB / ~200 MB</text>

    <text x="24" y="98" fill="#c0c0d8" font-size="15">bookstack-db RAM (idle / peak)</text>
    <text x="464" y="98" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">~100 MB / ~300 MB</text>

    <line x1="24" y1="114" x2="464" y2="114" stroke="#1e1e3a" stroke-width="1"/>

    <text x="24" y="142" fill="#c0c0d8" font-size="15">Total combined idle RAM</text>
    <text x="464" y="142" text-anchor="end" fill="#c8ff00" font-size="16" font-weight="700">~180 MB</text>

    <text x="24" y="164" fill="#6b6b8a" font-size="13">No Redis, no Tika — two containers only</text>
  </g>

  <!-- Footer -->
  <text x="70" y="592" fill="#4a4a6a" font-size="13">TechFuel HQ · Tutorial · Stack per linuxserver.io BookStack image &amp; BookStack docs</text>
  <text x="1130" y="592" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
