<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>AdGuard Home DNS topology on Proxmox</title>
  <desc>Network DNS flow: home clients query an AdGuard Home LXC container on a Proxmox host, which filters ads and resolves local .lan records, then forwards either to an optional Unbound recursive resolver reaching the DNS root servers, or to encrypted Quad9 and Cloudflare DNS-over-HTTPS upstreams.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5090e0"/>
    </marker>
    <marker id="arrowlime" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c8ff00"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="62" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">SETUP TUTORIAL · HOMELAB DNS TOPOLOGY</text>
  <text x="70" y="106" fill="#e8e8f0" font-size="44" font-weight="900">AdGuard Home + Local DNS on Proxmox</text>
  <text x="70" y="138" fill="#6b6b8a" font-size="18">Network-wide ad-blocking, *.lan resolution, and an optional Unbound recursive resolver</text>

  <!-- Column labels -->
  <text x="120" y="186" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700" text-anchor="middle">NETWORK CLIENTS</text>
  <text x="475" y="186" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700" text-anchor="middle">PROXMOX HOST · LXC</text>
  <text x="950" y="186" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700" text-anchor="middle">UPSTREAM RESOLUTION</text>

  <!-- CLIENTS -->
  <g transform="translate(40,210)">
    <rect width="170" height="250" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="20" y="34" fill="#e8e8f0" font-size="17" font-weight="700">LAN Devices</text>
    <text x="20" y="58" fill="#6b6b8a" font-size="12">DHCP-assigned DNS</text>

    <rect x="20" y="76" width="130" height="42" rx="7" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="34" y="102" fill="#c0c0d8" font-size="14">PCs &amp; laptops</text>

    <rect x="20" y="126" width="130" height="42" rx="7" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="34" y="152" fill="#c0c0d8" font-size="14">Phones / tablets</text>

    <rect x="20" y="176" width="130" height="42" rx="7" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="34" y="202" fill="#c0c0d8" font-size="14">IoT &amp; TVs</text>

    <text x="20" y="238" fill="#5090e0" font-size="12" font-weight="700">→ all queries to .5</text>
  </g>

  <!-- Arrow clients -> AGH -->
  <line x1="212" y1="335" x2="288" y2="335" stroke="#5090e0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="250" y="324" fill="#6b6b8a" font-size="11" text-anchor="middle">port 53</text>

  <!-- PROXMOX / AGH host -->
  <g transform="translate(292,200)">
    <rect width="368" height="290" rx="14" fill="#0d0d28" stroke="#1e1e3a" stroke-dasharray="5 4"/>
    <text x="20" y="30" fill="#e08828" font-size="13" letter-spacing="1" font-weight="700">PROXMOX · Debian 12 LXC · 256MB · 1 vCPU</text>

    <!-- AdGuard Home core box -->
    <rect x="18" y="48" width="332" height="148" rx="10" fill="#101028" stroke="#c8ff00" stroke-width="1.5"/>
    <text x="36" y="78" fill="#e8e8f0" font-size="20" font-weight="800">AdGuard Home</text>
    <text x="36" y="100" fill="#6b6b8a" font-size="12">192.168.1.5 · DNS server on :53</text>

    <rect x="36" y="114" width="142" height="32" rx="6" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="48" y="135" fill="#5dca7a" font-size="12" font-weight="600">Blocklists: AdGuard + OISD</text>

    <rect x="190" y="114" width="142" height="32" rx="6" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="202" y="135" fill="#5dca7a" font-size="12" font-weight="600">DHCP server (optional)</text>

    <rect x="36" y="152" width="296" height="34" rx="6" fill="#0d0d28" stroke="#1e1e3a"/>
    <text x="48" y="174" fill="#c8ff00" font-size="12" font-weight="700">DNS Rewrites: pve.lan · nas.lan · portainer.lan · adguard.lan</text>

    <!-- Unbound box -->
    <rect x="18" y="208" width="332" height="62" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="36" y="234" fill="#e8e8f0" font-size="16" font-weight="700">Unbound <tspan fill="#6b6b8a" font-size="12" font-weight="400">(optional · recursive)</tspan></text>
    <text x="36" y="256" fill="#6b6b8a" font-size="12">127.0.0.1:5335 · DNSSEC validating</text>
  </g>

  <!-- Local .lan return note -->
  <text x="476" y="514" fill="#c8ff00" font-size="12" text-anchor="middle" font-weight="600">.lan names answered locally — never leave the host</text>

  <!-- Arrow AGH -> upstream (lime, via Unbound) -->
  <line x1="660" y1="335" x2="746" y2="335" stroke="#c8ff00" stroke-width="2.5" marker-end="url(#arrowlime)"/>
  <text x="703" y="324" fill="#6b6b8a" font-size="11" text-anchor="middle">forward</text>

  <!-- UPSTREAM column -->
  <g transform="translate(750,210)">
    <!-- Root servers (via Unbound) -->
    <rect width="400" height="84" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="22" y="34" fill="#e8e8f0" font-size="17" font-weight="700">DNS Root Servers</text>
    <text x="22" y="58" fill="#6b6b8a" font-size="12">Queried directly when Unbound is enabled</text>
    <text x="22" y="74" fill="#6b6b8a" font-size="12">named.cache root hints · no upstream sees queries</text>

    <text x="22" y="120" fill="#6b6b8a" font-size="12" letter-spacing="1" font-weight="700">— OR encrypted DoH upstreams —</text>

    <rect y="134" width="400" height="58" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="22" y="162" fill="#e8e8f0" font-size="16" font-weight="700">Quad9</text>
    <text x="22" y="182" fill="#6b6b8a" font-size="12">dns10.quad9.net/dns-query · blocks malicious domains</text>

    <rect y="206" width="400" height="58" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="22" y="234" fill="#e8e8f0" font-size="16" font-weight="700">Cloudflare</text>
    <text x="22" y="254" fill="#6b6b8a" font-size="12">cloudflare-dns.com/dns-query · DoH fallback</text>
  </g>

  <!-- Footer -->
  <text x="70" y="592" fill="#4a4a6a" font-size="13">TechFuel HQ · Tutorial · Topology per the AdGuard Home + Unbound setup steps in this guide</text>
  <text x="1130" y="592" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
