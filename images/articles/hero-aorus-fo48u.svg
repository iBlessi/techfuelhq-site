<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#0e0e2a"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a38"/>
      <stop offset="50%" stop-color="#0f0f2a"/>
      <stop offset="100%" stop-color="#0a0a1e"/>
    </linearGradient>
    <linearGradient id="bezel-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a3a"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8ff00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a1e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <defs>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131330" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid4)" opacity="0.5"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#e8e8f0"/>

  <!-- Monitor Outline - 48" OLED representation -->
  <!-- Outer bezel -->
  <rect x="340" y="80" width="620" height="390" rx="18" fill="url(#bezel-grad)" stroke="#3a3a5a" stroke-width="3"/>
  <!-- Inner screen area -->
  <rect x="354" y="94" width="592" height="362" rx="10" fill="url(#screen-grad)"/>
  <!-- Screen glow -->
  <rect x="354" y="94" width="592" height="362" rx="10" fill="url(#screen-glow)"/>

  <!-- Screen content - OLED pixel bloom effect -->
  <ellipse cx="650" cy="275" rx="240" ry="140" fill="#c8ff00" opacity="0.03"/>

  <!-- On-screen content -->
  <text x="650" y="210" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#e8e8f0" text-anchor="middle" filter="url(#blur-glow)">4K OLED</text>
  <text x="650" y="255" font-family="system-ui, sans-serif" font-size="18" fill="#c8ff00" text-anchor="middle">3840 × 2160 · 138 Hz · 0.03ms GtG</text>

  <!-- Spec bar on screen -->
  <line x1="420" y1="285" x2="880" y2="285" stroke="#2a2a4a" stroke-width="1"/>

  <!-- Spec icons on screen -->
  <rect x="430" y="300" width="85" height="44" rx="6" fill="#1a1a38" stroke="#c8ff00" stroke-width="1"/>
  <text x="472" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b8a" text-anchor="middle">RESPONSE</text>
  <text x="472" y="335" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#c8ff00" text-anchor="middle">0.03ms</text>

  <rect x="530" y="300" width="85" height="44" rx="6" fill="#1a1a38" stroke="#e8e8f0" stroke-width="1" opacity="0.7"/>
  <text x="572" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b8a" text-anchor="middle">REFRESH</text>
  <text x="572" y="335" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e8e8f0" text-anchor="middle">138 Hz</text>

  <rect x="630" y="300" width="85" height="44" rx="6" fill="#1a1a38" stroke="#5090e0" stroke-width="1"/>
  <text x="672" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b8a" text-anchor="middle">CONTRAST</text>
  <text x="672" y="335" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#5090e0" text-anchor="middle">∞:1</text>

  <rect x="730" y="300" width="85" height="44" rx="6" fill="#1a1a38" stroke="#5dca7a" stroke-width="1"/>
  <text x="772" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b8a" text-anchor="middle">COVERAGE</text>
  <text x="772" y="335" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#5dca7a" text-anchor="middle">99% DCI</text>

  <!-- DP/HDMI port indicators on screen -->
  <text x="450" y="410" font-family="monospace" font-size="11" fill="#4a4a6a">▸ 1× DisplayPort 1.4  ▸ 2× HDMI 2.1  ▸ 3× USB-A  ▸ KVM Switch</text>

  <!-- Monitor stand -->
  <rect x="620" y="470" width="60" height="30" rx="4" fill="#2a2a3a"/>
  <rect x="580" y="498" width="140" height="12" rx="6" fill="#1e1e30"/>
  <!-- Stand upright -->
  <rect x="645" y="465" width="10" height="38" rx="3" fill="#2a2a3a"/>

  <!-- Callout: DisplayPort -->
  <line x1="340" y1="200" x2="240" y2="200" stroke="#5090e0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="240" cy="200" r="4" fill="#5090e0"/>
  <rect x="90" y="186" width="145" height="28" rx="5" fill="#101830" stroke="#5090e0" stroke-width="1"/>
  <text x="162" y="205" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5090e0" text-anchor="middle">DisplayPort 1.4</text>

  <!-- Callout: KVM -->
  <line x1="340" y1="260" x2="240" y2="260" stroke="#c8ff00" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="240" cy="260" r="4" fill="#c8ff00"/>
  <rect x="120" y="246" width="115" height="28" rx="5" fill="#101808" stroke="#c8ff00" stroke-width="1"/>
  <text x="177" y="265" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c8ff00" text-anchor="middle">KVM Switch</text>

  <!-- Callout: 48" size -->
  <line x1="960" y1="200" x2="1050" y2="200" stroke="#e8e8f0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="1050" cy="200" r="4" fill="#e8e8f0"/>
  <rect x="1055" y="186" width="105" height="28" rx="5" fill="#1a1a28" stroke="#e8e8f0" stroke-width="1"/>
  <text x="1107" y="205" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e8e8f0" text-anchor="middle">48-inch panel</text>

  <!-- Title text area (left side, below) -->
  <text x="60" y="548" font-family="system-ui, sans-serif" font-size="13" fill="#6b6b8a" letter-spacing="2">MONITOR REVIEW</text>
  <text x="60" y="578" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#e8e8f0">AORUS FO48U — 48" 4K OLED Gaming Monitor</text>

  <!-- Price badge -->
  <rect x="920" y="548" width="130" height="40" rx="8" fill="#1a1a38" stroke="#c8ff00" stroke-width="2"/>
  <text x="985" y="573" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#c8ff00" text-anchor="middle">$799</text>

  <!-- Footer -->
  <text x="600" y="618" font-family="system-ui, sans-serif" font-size="11" fill="#4a4a6a" text-anchor="middle">techfuelhq.com · Monitor Review · April 2026</text>
</svg>
