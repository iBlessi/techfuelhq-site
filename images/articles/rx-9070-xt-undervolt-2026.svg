<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#1e1e3a" stroke-width="2" rx="10"/>
  <rect x="0" y="0" width="1200" height="6" fill="#c8ff00"/>

  <text x="64" y="78" fill="#c8ff00" font-size="16" font-weight="700" letter-spacing="3">TECHFUELHQ · GPU TUNING · 2026</text>
  <text x="64" y="134" fill="#f2f2f7" font-size="48" font-weight="800" letter-spacing="-1">RX 9070 XT Undervolt</text>
  <text x="64" y="174" fill="#9a9ab5" font-size="21">AMD Adrenalin · the power-limited card that gets <tspan fill="#c8ff00" font-weight="700">faster</tspan> when you undervolt it</text>
  <line x1="64" y1="204" x2="1136" y2="204" stroke="#1e1e3a" stroke-width="1.5"/>

  <!-- Settings panel -->
  <rect x="64" y="232" width="500" height="250" rx="10" fill="rgba(255,255,255,0.03)" stroke="#2a2a44" stroke-width="1"/>
  <text x="88" y="274" fill="#e8e8f0" font-size="22" font-weight="800">Starting settings</text>
  <text x="88" y="300" fill="#8fdca0" font-size="14" font-weight="700">COMMUNITY CONSENSUS · SILICON VARIES</text>
  <text x="88" y="344" fill="#9a9ab5" font-size="17">Voltage offset <tspan x="540" fill="#c8ff00" font-weight="700" text-anchor="end">−80 to −100 mV</tspan></text>
  <text x="88" y="378" fill="#9a9ab5" font-size="17">Power limit <tspan x="540" fill="#c8ff00" font-weight="700" text-anchor="end">−10% to −30%</tspan></text>
  <text x="88" y="412" fill="#9a9ab5" font-size="17">VRAM timing <tspan x="540" fill="#e8e8f0" font-weight="700" text-anchor="end">Fast (optional)</tspan></text>
  <text x="88" y="446" fill="#9a9ab5" font-size="17">Tool <tspan x="540" fill="#e8e8f0" font-weight="700" text-anchor="end">AMD Adrenalin (Alt+R)</tspan></text>

  <!-- Payoff panel -->
  <rect x="636" y="232" width="500" height="250" rx="10" fill="rgba(200,255,0,0.04)" stroke="#3a3a1a" stroke-width="1"/>
  <text x="660" y="274" fill="#e8e8f0" font-size="22" font-weight="800">What you get</text>
  <text x="660" y="300" fill="#f0b060" font-size="14" font-weight="700">ON A 304W CARD THAT HITS ITS LIMIT</text>
  <text x="660" y="344" fill="#9a9ab5" font-size="17">Power draw <tspan x="1112" fill="#8fdca0" font-weight="700" text-anchor="end">−40 to −100 W</tspan></text>
  <text x="660" y="378" fill="#9a9ab5" font-size="17">Temperature <tspan x="1112" fill="#8fdca0" font-weight="700" text-anchor="end">−5 to −10 °C</tspan></text>
  <text x="660" y="412" fill="#9a9ab5" font-size="17">Performance <tspan x="1112" fill="#c8ff00" font-weight="700" text-anchor="end">up to +10% FPS</tspan></text>
  <text x="660" y="446" fill="#9a9ab5" font-size="17">Coil whine <tspan x="1112" fill="#8fdca0" font-weight="700" text-anchor="end">reduced</tspan></text>

  <!-- center arrow badge -->
  <circle cx="600" cy="357" r="28" fill="#0a0a23" stroke="#c8ff00" stroke-width="1.5"/>
  <text x="600" y="365" fill="#c8ff00" font-size="20" font-weight="800" text-anchor="middle">&#8594;</text>

  <!-- Why callout -->
  <rect x="64" y="512" width="1072" height="66" rx="8" fill="rgba(200,255,0,0.06)" stroke="#c8ff00" stroke-width="1.2"/>
  <text x="88" y="542" fill="#c8ff00" font-size="19" font-weight="800">Why it adds FPS: lower voltage = higher sustained clocks within the same power budget.</text>
  <text x="88" y="566" fill="#c8c8dc" font-size="15">XDA measured Cyberpunk 2077 rising 58 → 64 FPS at −100mV. Test stability 15–20 min in a demanding game before you trust it.</text>

  <text x="1136" y="612" fill="#44445a" font-size="14" text-anchor="end">techfuelhq.com · method: AMD Adrenalin / How-To Geek · results: XDA + r/radeon</text>
</svg>
