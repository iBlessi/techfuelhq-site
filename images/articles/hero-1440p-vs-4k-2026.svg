<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#12123a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#c8ff00" font-size="32" font-weight="800">1440p vs 4K GAMING · 2026</text>
  <text x="600" y="90" text-anchor="middle" fill="#9999bb" font-size="15">Is 4K worth it? Pick the resolution your GPU is built for</text>

  <!-- 1080p -->
  <rect x="50" y="120" width="340" height="400" rx="14" fill="#13132e" stroke="#ffb020" stroke-width="1"/>
  <text x="220" y="158" text-anchor="middle" fill="#ffb020" font-size="15" font-weight="700">COMPETITIVE / BUDGET</text>
  <text x="220" y="203" text-anchor="middle" fill="#ffffff" font-size="42" font-weight="800">1080p</text>
  <text x="220" y="232" text-anchor="middle" fill="#9999bb" font-size="13">2.07M pixels</text>
  <line x1="80" y1="252" x2="360" y2="252" stroke="#2a2a4a" stroke-width="1"/>
  <text x="220" y="288" text-anchor="middle" fill="#bbbbcc" font-size="13">Best for 240Hz+ esports</text>
  <text x="220" y="318" text-anchor="middle" fill="#bbbbcc" font-size="13">or a tight budget build</text>
  <text x="220" y="360" text-anchor="middle" fill="#bbbbcc" font-size="13">GPU: RTX 5060-class</text>

  <!-- 1440p sweet spot -->
  <rect x="430" y="105" width="340" height="415" rx="16" fill="#171735" stroke="#c8ff00" stroke-width="3"/>
  <text x="600" y="146" text-anchor="middle" fill="#c8ff00" font-size="15" font-weight="800">THE SWEET SPOT ✓</text>
  <text x="600" y="192" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="800">1440p</text>
  <text x="600" y="222" text-anchor="middle" fill="#9999bb" font-size="13">3.69M pixels · 27-inch</text>
  <line x1="460" y1="242" x2="740" y2="242" stroke="#2a2a4a" stroke-width="1"/>
  <text x="600" y="278" text-anchor="middle" fill="#c8ff00" font-size="13">✓ Best balance: sharp + high refresh</text>
  <text x="600" y="308" text-anchor="middle" fill="#c8ff00" font-size="13">✓ GPU: RTX 5070 / RX 9070 XT</text>
  <text x="600" y="338" text-anchor="middle" fill="#c8ff00" font-size="13">✓ 12GB VRAM · cheaper monitor</text>
  <text x="600" y="380" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">The right pick for most gamers</text>

  <!-- 4K -->
  <rect x="810" y="120" width="340" height="400" rx="14" fill="#13132e" stroke="#5090e0" stroke-width="1"/>
  <text x="980" y="158" text-anchor="middle" fill="#5090e0" font-size="15" font-weight="700">FIDELITY + BIG SCREEN</text>
  <text x="980" y="203" text-anchor="middle" fill="#ffffff" font-size="42" font-weight="800">4K</text>
  <text x="980" y="232" text-anchor="middle" fill="#9999bb" font-size="13">8.29M px = 2.25x 1440p</text>
  <line x1="840" y1="252" x2="1120" y2="252" stroke="#2a2a4a" stroke-width="1"/>
  <text x="980" y="288" text-anchor="middle" fill="#5090e0" font-size="13">Worth it on 32-inch+ screens</text>
  <text x="980" y="318" text-anchor="middle" fill="#bbbbcc" font-size="13">GPU: RTX 5080+ native</text>
  <text x="980" y="338" text-anchor="middle" fill="#bbbbcc" font-size="13">(RTX 4080/5070 upscaled)</text>
  <text x="980" y="380" text-anchor="middle" fill="#e63946" font-size="13">Needs 16GB VRAM</text>

  <text x="600" y="565" text-anchor="middle" fill="#667" font-size="13">4K is 2.25x the GPU load of 1440p (8.29M vs 3.69M pixels) — a flagship at 100+fps at 1440p can halve at native 4K · techfuelhq.com</text>
</svg>
