<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0a0a23"/>
  <text x="600" y="55" text-anchor="middle" fill="#c8ff00" font-size="28" font-weight="800">SELF-HOSTING ESSENTIALS</text>
  <text x="600" y="85" text-anchor="middle" fill="#9999bb" font-size="15">What to Self-Host First and Why — The Priority Stack</text>
  <!-- Priority Stack -->
  <rect x="50" y="110" width="350" height="130" rx="12" fill="#13132e" stroke="#c8ff00" stroke-width="2"/>
  <text x="65" y="135" fill="#c8ff00" font-size="12" font-weight="700">1 • START HERE</text>
  <text x="225" y="165" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">Vaultwarden</text>
  <text x="225" y="190" text-anchor="middle" fill="#9999bb" font-size="12">Password manager • 256MB RAM • Instant impact</text>
  <text x="225" y="215" text-anchor="middle" fill="#c8ff00" font-size="11">Replace LastPass/1Password today</text>
  <rect x="425" y="110" width="350" height="130" rx="12" fill="#13132e" stroke="#c8ff00" stroke-width="1"/>
  <text x="440" y="135" fill="#c8ff00" font-size="12" font-weight="700">2 • WEEK ONE</text>
  <text x="600" y="165" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">AdGuard Home</text>
  <text x="600" y="190" text-anchor="middle" fill="#9999bb" font-size="12">Network-wide ad blocking • 128MB RAM</text>
  <text x="600" y="215" text-anchor="middle" fill="#c8ff00" font-size="11">Every device on your network, ad-free</text>
  <rect x="800" y="110" width="350" height="130" rx="12" fill="#13132e" stroke="#667" stroke-width="1"/>
  <text x="815" y="135" fill="#778" font-size="12" font-weight="700">3 • MONTH ONE</text>
  <text x="975" y="165" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">Nextcloud</text>
  <text x="975" y="190" text-anchor="middle" fill="#9999bb" font-size="12">File sync + calendar • 2GB RAM • Docker</text>
  <text x="975" y="215" text-anchor="middle" fill="#bbbbcc" font-size="11">Replace Google Drive and Calendar</text>
  <rect x="50" y="260" width="350" height="130" rx="12" fill="#13132e" stroke="#667" stroke-width="1"/>
  <text x="65" y="285" fill="#778" font-size="12" font-weight="700">4 • WHEN READY</text>
  <text x="225" y="315" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">Immich</text>
  <text x="225" y="340" text-anchor="middle" fill="#9999bb" font-size="12">Photo backup • 4GB RAM • GPU optional</text>
  <text x="225" y="365" text-anchor="middle" fill="#bbbbcc" font-size="11">Google Photos replacement with AI</text>
  <rect x="425" y="260" width="350" height="130" rx="12" fill="#13132e" stroke="#667" stroke-width="1"/>
  <text x="440" y="285" fill="#778" font-size="12" font-weight="700">5 • INTERMEDIATE</text>
  <text x="600" y="315" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">Paperless-ngx</text>
  <text x="600" y="340" text-anchor="middle" fill="#9999bb" font-size="12">Document management • 1GB RAM</text>
  <text x="600" y="365" text-anchor="middle" fill="#bbbbcc" font-size="11">Digitize and search all your documents</text>
  <rect x="800" y="260" width="350" height="130" rx="12" fill="#13132e" stroke="#667" stroke-width="1"/>
  <text x="815" y="285" fill="#778" font-size="12" font-weight="700">6 • ADVANCED</text>
  <text x="975" y="315" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">Gitea</text>
  <text x="975" y="340" text-anchor="middle" fill="#9999bb" font-size="12">Git hosting • 512MB RAM • Lightweight</text>
  <text x="975" y="365" text-anchor="middle" fill="#bbbbcc" font-size="11">Your own GitHub, your own rules</text>
  <!-- Hardware Note -->
  <rect x="50" y="420" width="1100" height="80" rx="12" fill="#13132e" stroke="#c8ff00" stroke-width="1"/>
  <text x="600" y="450" text-anchor="middle" fill="#c8ff00" font-size="16" font-weight="700">MINIMUM HARDWARE TO START</text>
  <text x="600" y="475" text-anchor="middle" fill="#ffffff" font-size="14">Any old laptop or mini PC • 8GB RAM • 256GB SSD • Docker + Portainer</text>
  <text x="600" y="495" text-anchor="middle" fill="#9999bb" font-size="11">Start with Vaultwarden + AdGuard. Add services as you learn. Don't deploy 50 services on day one.</text>
  <!-- Bottom -->
  <rect x="50" y="530" width="1100" height="70" rx="12" fill="#0d0d28"/>
  <text x="200" y="560" text-anchor="middle" fill="#c8ff00" font-size="13" font-weight="600">✅ Self-host what you use daily</text>
  <text x="500" y="560" text-anchor="middle" fill="#c8ff00" font-size="13" font-weight="600">✅ Start simple, grow gradually</text>
  <text x="800" y="560" text-anchor="middle" fill="#e63946" font-size="13" font-weight="600">✗ Don't deploy 50 services day one</text>
  <text x="1050" y="560" text-anchor="middle" fill="#e63946" font-size="13" font-weight="600">✗ Don't skip backups</text>
  <text x="600" y="590" text-anchor="middle" fill="#556" font-size="11">techfuelhq.com | Self-Hosting Essentials Guide</text>
</svg>
