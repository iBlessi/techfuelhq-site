<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#12123a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="60" text-anchor="middle" fill="#c8ff00" font-size="28" font-weight="800">DDR5 RAM BUYING GUIDE 2026</text>
  <text x="600" y="90" text-anchor="middle" fill="#9999bb" font-size="15">Stop Overpaying for Speed You Can't Feel</text>
  <!-- Speed Tiers -->
  <rect x="50" y="120" width="340" height="200" rx="14" fill="#13132e" stroke="#c8ff00" stroke-width="2"/>
  <text x="220" y="155" text-anchor="middle" fill="#c8ff00" font-size="16" font-weight="700">SWEET SPOT</text>
  <text x="220" y="185" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">DDR5-6000</text>
  <text x="220" y="210" text-anchor="middle" fill="#9999bb" font-size="13">CL30 • 32GB Kit • ~$100</text>
  <text x="220" y="240" text-anchor="middle" fill="#c8ff00" font-size="13">✓ Best price-to-performance</text>
  <text x="220" y="260" text-anchor="middle" fill="#c8ff00" font-size="13">✓ 1:1 FCLK ratio (AMD)</text>
  <text x="220" y="280" text-anchor="middle" fill="#c8ff00" font-size="13">✓ Stable on all platforms</text>
  <rect x="430" y="120" width="340" height="200" rx="14" fill="#13132e" stroke="#667" stroke-width="1"/>
  <text x="600" y="155" text-anchor="middle" fill="#778" font-size="16" font-weight="700">DIMINISHING RETURNS</text>
  <text x="600" y="185" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">DDR5-6400</text>
  <text x="600" y="210" text-anchor="middle" fill="#9999bb" font-size="13">CL32 • 32GB Kit • ~$130</text>
  <text x="600" y="240" text-anchor="middle" fill="#bbbbcc" font-size="13">• 2-4% faster than 6000</text>
  <text x="600" y="260" text-anchor="middle" fill="#bbbbcc" font-size="13">• 30% more expensive</text>
  <text x="600" y="280" text-anchor="middle" fill="#bbbbcc" font-size="13">• May need manual tuning</text>
  <rect x="810" y="120" width="340" height="200" rx="14" fill="#13132e" stroke="#e63946" stroke-width="1"/>
  <text x="980" y="155" text-anchor="middle" fill="#e63946" font-size="16" font-weight="700">OVERPAYING</text>
  <text x="980" y="185" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">DDR5-7200+</text>
  <text x="980" y="210" text-anchor="middle" fill="#9999bb" font-size="13">CL34+ • 32GB Kit • $300+</text>
  <text x="980" y="240" text-anchor="middle" fill="#e63946" font-size="13">✗ 0-4% over DDR5-6000</text>
  <text x="980" y="260" text-anchor="middle" fill="#e63946" font-size="13">✗ 3x the price for no gain</text>
  <text x="980" y="280" text-anchor="middle" fill="#e63946" font-size="13">✗ Instability on AMD</text>
  <!-- Key Takeaway -->
  <rect x="50" y="360" width="1100" height="100" rx="14" fill="#13132e" stroke="#c8ff00" stroke-width="1"/>
  <text x="600" y="395" text-anchor="middle" fill="#c8ff00" font-size="18" font-weight="800">KEY TAKEAWAY</text>
  <text x="600" y="425" text-anchor="middle" fill="#ffffff" font-size="15">DDR5-6000 CL30 at ~$100 delivers 96-100% of the performance of kits costing 3x more</text>
  <text x="600" y="445" text-anchor="middle" fill="#9999bb" font-size="12">Gaming: 0-4% difference between 6000 and 7200 | Productivity: 4-7% overall</text>
  <!-- Platform Recs -->
  <rect x="50" y="490" width="530" height="100" rx="14" fill="#13132e" stroke="#e63946" stroke-width="1"/>
  <text x="315" y="520" text-anchor="middle" fill="#e63946" font-size="15" font-weight="700">AMD RYZEN 7000/9000</text>
  <text x="315" y="545" text-anchor="middle" fill="#bbbbcc" font-size="13">DDR5-6000 CL30 = optimal 1:1 FCLK ratio</text>
  <text x="315" y="565" text-anchor="middle" fill="#bbbbcc" font-size="13">Above 6400 may cause instability</text>
  <rect x="620" y="490" width="530" height="100" rx="14" fill="#13132e" stroke="#4a9eff" stroke-width="1"/>
  <text x="885" y="520" text-anchor="middle" fill="#4a9eff" font-size="15" font-weight="700">INTEL 14TH/15TH GEN</text>
  <text x="885" y="545" text-anchor="middle" fill="#bbbbcc" font-size="13">DDR5-6000 to 6400 CL30-32 = sweet spot</text>
  <text x="885" y="565" text-anchor="middle" fill="#bbbbcc" font-size="13">Less picky about ratios, still diminishing returns</text>
  <text x="600" y="620" text-anchor="middle" fill="#556" font-size="11">techfuelhq.com | DDR5 RAM Buying Guide 2026</text>
</svg>
