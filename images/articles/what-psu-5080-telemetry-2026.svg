<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif">
  <desc>308 HWiNFO64 board-power samples, about 26 minutes of logged gaming in two segments, on the ASUS ROG Astral RTX 5080 OC hand-tuned profile. Power ranges from 87W lulls to the 326W peak; the session average is 261W, well under the ~420W figure used to size supplies for overclocked 5080 boards.</desc>
