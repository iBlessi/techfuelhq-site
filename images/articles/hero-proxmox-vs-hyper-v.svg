<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#12123a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="60" text-anchor="middle" fill="#c8ff00" font-size="32" font-weight="800">PROXMOX vs HYPER-V · 2026</text>
  <text x="600" y="92" text-anchor="middle" fill="#9999bb" font-size="16">Free and open-source vs Windows-licensed</text>

  <!-- Proxmox: free + open -->
  <rect x="70" y="125" width="500" height="400" rx="16" fill="#171735" stroke="#c8ff00" stroke-width="3"/>
  <text x="320" y="168" text-anchor="middle" fill="#c8ff00" font-size="16" font-weight="800">FREE + OPEN-SOURCE</text>
  <text x="320" y="212" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800">Proxmox VE</text>
  <text x="320" y="240" text-anchor="middle" fill="#9999bb" font-size="14">Debian · KVM + LXC · web UI</text>
  <line x1="110" y1="262" x2="530" y2="262" stroke="#2a2a4a" stroke-width="1"/>
  <text x="320" y="298" text-anchor="middle" fill="#c8ff00" font-size="14">✓ No license key, no node limit</text>
  <text x="320" y="330" text-anchor="middle" fill="#c8ff00" font-size="14">✓ Clustering, HA, live migration, backup</text>
  <text x="320" y="362" text-anchor="middle" fill="#c8ff00" font-size="14">✓ Runs great on mini PCs + old hardware</text>
  <text x="320" y="394" text-anchor="middle" fill="#c8ff00" font-size="14">✓ VMs + lightweight containers</text>
  <text x="320" y="450" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">The free home-lab default</text>

  <!-- Hyper-V: licensed -->
  <rect x="630" y="135" width="500" height="380" rx="14" fill="#13132e" stroke="#5090e0" stroke-width="1"/>
  <text x="880" y="176" text-anchor="middle" fill="#5090e0" font-size="16" font-weight="700">NEEDS A WINDOWS LICENSE</text>
  <text x="880" y="220" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800">Hyper-V</text>
  <text x="880" y="248" text-anchor="middle" fill="#9999bb" font-size="14">A role in Windows Server / 11 Pro</text>
  <line x1="670" y1="270" x2="1090" y2="270" stroke="#2a2a4a" stroke-width="1"/>
  <text x="880" y="306" text-anchor="middle" fill="#e63946" font-size="14">✗ Free standalone Server ended after 2019</text>
  <text x="880" y="338" text-anchor="middle" fill="#bbbbcc" font-size="14">Licensed per core (16-core min/server)</text>
  <text x="880" y="370" text-anchor="middle" fill="#bbbbcc" font-size="14">Best for Microsoft / AD-heavy shops</text>
  <text x="880" y="402" text-anchor="middle" fill="#bbbbcc" font-size="14">Familiar if you already run Windows</text>

  <text x="600" y="568" text-anchor="middle" fill="#667" font-size="13">Leaving VMware? The free escape is Proxmox — Microsoft's free option is gone · techfuelhq.com</text>
</svg>
