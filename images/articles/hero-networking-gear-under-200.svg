<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#0d0d28"/>
    </linearGradient>
    <linearGradient id="device-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a38"/>
      <stop offset="100%" stop-color="#111128"/>
    </linearGradient>
    <filter id="device-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5090e0" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <defs>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141432" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid5)" opacity="0.4"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1200" height="5" fill="#5090e0"/>

  <!-- Glow background accent -->
  <ellipse cx="600" cy="320" rx="500" ry="250" fill="#5090e0" opacity="0.03"/>

  <!-- ===== ROUTER (left) ===== -->
  <g filter="url(#device-shadow)">
    <!-- Router body -->
    <rect x="60" y="220" width="240" height="120" rx="14" fill="url(#device-grad)" stroke="#5090e0" stroke-width="2"/>
    <!-- Router top antenna left -->
    <line x1="110" y1="220" x2="95" y2="145" stroke="#2a2a4a" stroke-width="6" stroke-linecap="round"/>
    <!-- Router top antenna right -->
    <line x1="190" y1="220" x2="175" y2="145" stroke="#2a2a4a" stroke-width="6" stroke-linecap="round"/>
    <!-- Antenna tips -->
    <circle cx="95" cy="143" r="5" fill="#5090e0"/>
    <circle cx="175" cy="143" r="5" fill="#5090e0"/>

    <!-- LED row -->
    <circle cx="105" cy="248" r="5" fill="#5dca7a" opacity="0.9"/>
    <circle cx="125" cy="248" r="5" fill="#5090e0" opacity="0.7"/>
    <circle cx="145" cy="248" r="5" fill="#5090e0" opacity="0.5"/>
    <circle cx="165" cy="248" r="5" fill="#6b6b8a" opacity="0.4"/>

    <!-- Port row -->
    <rect x="90" y="280" width="18" height="14" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="115" y="280" width="18" height="14" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="140" y="280" width="18" height="14" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="165" y="280" width="18" height="14" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="205" y="278" width="20" height="16" rx="2" fill="#0f0f28" stroke="#5090e0" stroke-width="1.5"/>

    <!-- Label -->
    <text x="180" y="266" font-family="system-ui, sans-serif" font-size="10" fill="#6b6b8a">WAN</text>
    <text x="180" y="305" font-family="monospace" font-size="8" fill="#5090e0">WAN</text>

    <!-- Device type label -->
    <text x="180" y="326" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e8e8f0">ROUTER</text>
    <text x="180" y="342" font-family="system-ui, sans-serif" font-size="10" fill="#6b6b8a">WiFi 6 · 4-port</text>
  </g>

  <!-- Price tag: Router -->
  <rect x="95" y="360" width="80" height="28" rx="5" fill="#5090e0"/>
  <text x="135" y="379" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0a0a23" text-anchor="middle">$49</text>
  <text x="190" y="379" font-family="system-ui, sans-serif" font-size="12" fill="#6b6b8a">TP-Link</text>

  <!-- ===== SWITCH (center) ===== -->
  <g filter="url(#device-shadow)">
    <rect x="380" y="260" width="300" height="80" rx="12" fill="url(#device-grad)" stroke="#c8ff00" stroke-width="2"/>
    <!-- 8 ports -->
    <rect x="400" y="282" width="22" height="16" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="430" y="282" width="22" height="16" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="460" y="282" width="22" height="16" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="490" y="282" width="22" height="16" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="520" y="282" width="22" height="16" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="550" y="282" width="22" height="16" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="580" y="282" width="22" height="16" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="610" y="282" width="22" height="16" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <!-- LEDs -->
    <circle cx="411" cy="275" r="3" fill="#5dca7a"/>
    <circle cx="441" cy="275" r="3" fill="#5dca7a"/>
    <circle cx="471" cy="275" r="3" fill="#5dca7a"/>
    <circle cx="501" cy="275" r="3" fill="#5090e0"/>
    <circle cx="531" cy="275" r="3" fill="#5dca7a"/>
    <circle cx="561" cy="275" r="3" fill="#6b6b8a"/>
    <circle cx="591" cy="275" r="3" fill="#6b6b8a"/>
    <circle cx="621" cy="275" r="3" fill="#6b6b8a"/>

    <text x="530" y="323" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e8e8f0" text-anchor="middle">8-PORT MANAGED SWITCH</text>
    <text x="530" y="338" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b8a" text-anchor="middle">1GbE · VLAN · PoE+ optional</text>
  </g>

  <!-- Price tag: Switch -->
  <rect x="480" y="358" width="80" height="28" rx="5" fill="#c8ff00"/>
  <text x="520" y="377" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0a0a23" text-anchor="middle">$35</text>
  <text x="576" y="377" font-family="system-ui, sans-serif" font-size="12" fill="#6b6b8a">Netgear GS308</text>

  <!-- ===== ACCESS POINT (right) ===== -->
  <g filter="url(#device-shadow)">
    <!-- AP disc shape -->
    <ellipse cx="960" cy="290" rx="110" ry="110" fill="url(#device-grad)" stroke="#5dca7a" stroke-width="2"/>
    <!-- AP inner ring -->
    <ellipse cx="960" cy="290" rx="80" ry="80" fill="none" stroke="#1e1e3a" stroke-width="1.5"/>
    <ellipse cx="960" cy="290" rx="50" ry="50" fill="none" stroke="#1e1e3a" stroke-width="1"/>
    <!-- AP center LED -->
    <circle cx="960" cy="290" r="12" fill="#5dca7a" opacity="0.2"/>
    <circle cx="960" cy="290" r="6" fill="#5dca7a"/>
    <!-- WiFi signal arcs -->
    <path d="M 920 250 Q 960 225 1000 250" stroke="#5dca7a" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 905 235 Q 960 205 1015 235" stroke="#5dca7a" stroke-width="1.5" fill="none" opacity="0.3"/>

    <text x="960" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e8e8f0" text-anchor="middle">ACCESS POINT</text>
    <text x="960" y="382" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b8a" text-anchor="middle">WiFi 6 · 2.4 + 5GHz</text>
  </g>

  <!-- Price tag: AP -->
  <rect x="905" y="400" width="80" height="28" rx="5" fill="#5dca7a"/>
  <text x="945" y="419" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0a0a23" text-anchor="middle">$65</text>
  <text x="1000" y="419" font-family="system-ui, sans-serif" font-size="12" fill="#6b6b8a">TP-Link EAP</text>

  <!-- Connection lines between devices -->
  <line x1="300" y1="300" x2="380" y2="300" stroke="#5090e0" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="680" y1="300" x2="850" y2="290" stroke="#5dca7a" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Total budget indicator -->
  <rect x="420" y="440" width="360" height="60" rx="12" fill="#1a1a38" stroke="#c8ff00" stroke-width="2"/>
  <text x="600" y="466" font-family="system-ui, sans-serif" font-size="14" fill="#6b6b8a" text-anchor="middle">TOTAL BUILD COST</text>
  <text x="600" y="490" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#c8ff00" text-anchor="middle">$149 — $199</text>

  <!-- Page title -->
  <text x="600" y="52" font-family="system-ui, sans-serif" font-size="13" fill="#5090e0" text-anchor="middle" letter-spacing="2">HOMELAB NETWORKING GUIDE</text>
  <text x="600" y="92" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#e8e8f0" text-anchor="middle">Best Homelab Networking Gear</text>
  <text x="600" y="132" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#c8ff00" text-anchor="middle">Under $200</text>

  <!-- Footer -->
  <text x="600" y="595" font-family="system-ui, sans-serif" font-size="12" fill="#4a4a6a" text-anchor="middle">techfuelhq.com · Networking Gear Guide · April 2026</text>
</svg>
