    <text x="522" y="34" fill="#e08828" font-size="16" font-weight="700">IPS · 4K 60Hz</text>
    <text x="522" y="58" fill="#c0c0d8" font-size="14">3840×2160 · DisplayHDR 600 · USB-C 90W</text>
    <text x="1034" y="50" text-anchor="end" fill="#e8e8f0" font-size="26" font-weight="900">~$399</text>
