<text x="400" y="94" fill="#bbbbcc" font-size="12">Gaming (Avg FPS)</text>
<rect x="530" y="82" width="14" height="14" rx="3" fill="#4a9eff"/>
<text x="550" y="94" fill="#bbbbcc" font-size="12">Productivity (Multi-threaded)</text>
<!-- Chart Area -->
<!-- Y-axis labels -->
<text x="130" y="140" text-anchor="end" fill="#666680" font-size="11">+12%</text>
<line x1="140" y1="137" x2="1100" y2="137" stroke="#1a1a3a" stroke-width="1"/>
<text x="130" y="195" text-anchor="end" fill="#666680" font-size="11">+10%</text>
<line x1="140" y1="192" x2="1100" y2="192" stroke="#1a1a3a" stroke-width="1"/>
<text x="130" y="250" text-anchor="end" fill="#666680" font-size="11">+8%</text>
<line x1="140" y1="247" x2="1100" y2="247" stroke="#1a1a3a" stroke-width="1"/>
<text x="130" y="305" text-anchor="end" fill="#666680" font-size="11">+6%</text>
<line x1="140" y1="302" x2="1100" y2="302" stroke="#1a1a3a" stroke-width="1"/>
<text x="130" y="360" text-anchor="end" fill="#666680" font-size="11">+4%</text>
<line x1="140" y1="357" x2="1100" y2="357" stroke="#1a1a3a" stroke-width="1"/>
<text x="130" y="415" text-anchor="end" fill="#666680" font-size="11">+2%</text>
<line x1="140" y1="412" x2="1100" y2="412" stroke="#1a1a3a" stroke-width="1"/>
<text x="130" y="470" text-anchor="end" fill="#666680" font-size="11">0%</text>
<line x1="140" y1="467" x2="1100" y2="467" stroke="#2a2a4a" stroke-width="2"/>
<!-- DDR5-4800 (Baseline) -->
<rect x="170" y="462" width="50" height="5" rx="3" fill="#c8ff00" opacity="0.4"/>
<rect x="225" y="462" width="50" height="5" rx="3" fill="#4a9eff" opacity="0.4"/>
<text x="222" y="490" text-anchor="middle" fill="#9999bb" font-size="12" font-weight="600">4800</text>
<text x="222" y="505" text-anchor="middle" fill="#666680" font-size="10">Baseline</text>
<!-- DDR5-5200 -->
<rect x="310" y="444" width="50" height="23" rx="3" fill="#c8ff00" opacity="0.6"/>
<rect x="365" y="440" width="50" height="27" rx="3" fill="#4a9eff" opacity="0.6"/>
<text x="310" y="438" fill="#c8ff00" font-size="10" font-weight="600">+1%</text>
<text x="365" y="434" fill="#4a9eff" font-size="10" font-weight="600">+1%</text>
<text x="362" y="490" text-anchor="middle" fill="#9999bb" font-size="12" font-weight="600">5200</text>
<!-- DDR5-5600 -->
<rect x="450" y="426" width="50" height="41" rx="3" fill="#c8ff00" opacity="0.7"/>
<rect x="505" y="412" width="50" height="55" rx="3" fill="#4a9eff" opacity="0.7"/>
<text x="450" y="420" fill="#c8ff00" font-size="10" font-weight="600">+2%</text>
<text x="505" y="406" fill="#4a9eff" font-size="10" font-weight="600">+2%</text>
<text x="502" y="490" text-anchor="middle" fill="#9999bb" font-size="12" font-weight="600">5600</text>
<!-- DDR5-6000 (Sweet Spot) -->
<rect x="590" y="399" width="50" height="68" rx="3" fill="#c8ff00"/>
<rect x="645" y="371" width="50" height="96" rx="3" fill="#4a9eff"/>
<text x="590" y="393" fill="#c8ff00" font-size="10" font-weight="700">+3%</text>
<text x="645" y="365" fill="#4a9eff" font-size="10" font-weight="700">+4%</text>
<text x="642" y="490" text-anchor="middle" fill="#c8ff00" font-size="13" font-weight="800">6000</text>
<text x="642" y="506" text-anchor="middle" fill="#c8ff00" font-size="10">SWEET SPOT</text>
<!-- DDR5-6400 -->
<rect x="730" y="385" width="50" height="82" rx="3" fill="#c8ff00" opacity="0.8"/>
<rect x="785" y="344" width="50" height="123" rx="3" fill="#4a9eff" opacity="0.8"/>
<text x="730" y="379" fill="#c8ff00" font-size="10" font-weight="600">+3.5%</text>
<text x="785" y="338" fill="#4a9eff" font-size="10" font-weight="600">+5.5%</text>
<text x="782" y="490" text-anchor="middle" fill="#9999bb" font-size="12" font-weight="600">6400</text>
<!-- DDR5-6800 -->
<rect x="870" y="376" width="50" height="91" rx="3" fill="#c8ff00" opacity="0.6"/>
<rect x="925" y="330" width="50" height="137" rx="3" fill="#4a9eff" opacity="0.6"/>
<text x="870" y="370" fill="#c8ff00" font-size="10" font-weight="600">+4%</text>
<text x="925" y="324" fill="#4a9eff" font-size="10" font-weight="600">+6%</text>
<text x="922" y="490" text-anchor="middle" fill="#9999bb" font-size="12" font-weight="600">6800</text>
<!-- DDR5-7200 -->
<rect x="1010" y="371" width="50" height="96" rx="3" fill="#e63946" opacity="0.7"/>
<rect x="1065" y="316" width="50" height="151" rx="3" fill="#4a9eff" opacity="0.7"/>
<text x="1010" y="365" fill="#e63946" font-size="10" font-weight="600">+4%</text>
<text x="1065" y="310" fill="#4a9eff" font-size="10" font-weight="600">+7%</text>
<text x="1062" y="490" text-anchor="middle" fill="#e63946" font-size="12" font-weight="600">7200</text>
<text x="1062" y="506" text-anchor="middle" fill="#e63946" font-size="10">OVERPAYING</text>
<!-- Annotation box -->
<rect x="140" y="530" width="1000" height="70" rx="10" fill="#13132e" stroke="#c8ff00" stroke-width="1"/>
<text x="640" y="555" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">KEY INSIGHT</text>
<text x="640" y="575" text-anchor="middle" fill="#bbbbcc" font-size="12">Gaming gains plateau after DDR5-6000 (~3-4%). Productivity sees steadier scaling but DDR5-6000 still hits the best price-to-performance ratio.</text>
<text x="640" y="592" text-anchor="middle" fill="#666680" font-size="10">The extra $200+ for DDR5-7200 buys you 0-1% more gaming FPS over DDR5-6000.</text>
<!-- Footer -->
<text x="600" y="620" text-anchor="middle" fill="#556" font-size="11">techfuelhq.com | DDR5 RAM Buying Guide 2026</text>
