<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0a23"/>
    <stop offset="100%" stop-color="#12123a"/>
  </linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<!-- Title -->
<text x="600" y="45" text-anchor="middle" fill="#c8ff00" font-size="22" font-weight="800">DDR5 SPEED vs REAL-WORLD PERFORMANCE GAIN</text>
<text x="600" y="68" text-anchor="middle" fill="#9999bb" font-size="13">Compiled from multiple independent sources | Baseline: DDR5-4800</text>
<!-- Legend -->
