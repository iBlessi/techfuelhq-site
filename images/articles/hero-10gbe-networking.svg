<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#0e0e2a"/>
    </linearGradient>
    <linearGradient id="sfp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <radialGradient id="speed-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8ff00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a23" stop-opacity="0"/>
    </radialGradient>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="connector-shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#c8ff00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <defs>
    <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid6)" opacity="0.5"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Speed glow orb -->
  <ellipse cx="750" cy="300" rx="350" ry="280" fill="url(#speed-glow)"/>

  <!-- BIG "10GbE" display -->
  <text x="680" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="130" font-weight="900" fill="#c8ff00" text-anchor="middle" filter="url(#text-glow)" opacity="0.9">10GbE</text>

  <!-- Speed indicator lines (data streams) -->
  <line x1="400" y1="240" x2="960" y2="240" stroke="#c8ff00" stroke-width="1" opacity="0.15"/>
  <line x1="400" y1="260" x2="960" y2="260" stroke="#c8ff00" stroke-width="2" opacity="0.25"/>
  <line x1="400" y1="280" x2="960" y2="280" stroke="#c8ff00" stroke-width="1" opacity="0.15"/>

  <!-- SFP+ connector visual (right side) -->
  <g filter="url(#connector-shadow)">
    <!-- Main connector body -->
    <rect x="880" y="280" width="180" height="80" rx="8" fill="url(#sfp-body)" stroke="#c8ff00" stroke-width="2"/>
    <!-- Connector face plate -->
    <rect x="880" y="292" width="30" height="56" rx="4" fill="#1a1a38" stroke="#3a3a5a" stroke-width="1"/>
    <!-- Optical port hole -->
    <circle cx="895" cy="320" r="8" fill="#0a0a1e" stroke="#c8ff00" stroke-width="1.5"/>
    <circle cx="895" cy="320" r="4" fill="#c8ff00" opacity="0.4"/>
    <!-- LC connector -->
    <rect x="912" y="308" width="140" height="24" rx="4" fill="#0f0f28" stroke="#2a2a4a" stroke-width="1"/>
    <!-- Body text -->
    <text x="985" y="304" font-family="monospace" font-size="11" fill="#6b6b8a" text-anchor="middle">SFP+ 10G DAC/SR</text>
    <text x="985" y="348" font-family="monospace" font-size="9" fill="#c8ff00" text-anchor="middle">10GBASE-SR / DAC</text>
    <!-- Pull tab -->
    <rect x="1050" y="310" width="14" height="20" rx="3" fill="#e08040"/>
  </g>

  <!-- Cable coming from connector -->
  <path d="M 1060 320 Q 1120 320 1140 300 Q 1160 280 1180 290" stroke="#c8ff00" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 1060 322 Q 1120 322 1140 302 Q 1160 282 1180 292" stroke="#c8ff00" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- $150 price callout -->
  <circle cx="600" cy="340" r="70" fill="#1a1a38" stroke="#c8ff00" stroke-width="3"/>
  <text x="600" y="328" font-family="system-ui, sans-serif" font-size="14" fill="#6b6b8a" text-anchor="middle">from just</text>
  <text x="600" y="365" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#c8ff00" text-anchor="middle">$150</text>

  <!-- Headline left -->
  <text x="80" y="155" font-family="system-ui, sans-serif" font-size="13" fill="#c8ff00" letter-spacing="3">NETWORK UPGRADE GUIDE</text>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#e8e8f0">The Upgrade That</text>
  <text x="80" y="268" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#e8e8f0">Changes Everything</text>

  <!-- Subtitle -->
  <text x="80" y="310" font-family="system-ui, sans-serif" font-size="17" fill="#6b6b8a">10x faster than Gigabit —</text>
  <text x="80" y="334" font-family="system-ui, sans-serif" font-size="17" fill="#6b6b8a">now affordable for homelab</text>

  <!-- Speed comparison mini chart -->
  <rect x="80" y="380" width="300" height="90" rx="10" fill="#111128" stroke="#1e1e3a" stroke-width="1"/>

  <text x="100" y="402" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b8a">1GbE</text>
  <rect x="140" y="392" width="60" height="14" rx="3" fill="#5090e0" opacity="0.7"/>
  <text x="208" y="403" font-family="system-ui, sans-serif" font-size="11" fill="#5090e0">125 MB/s</text>

  <text x="100" y="427" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b8a">2.5GbE</text>
  <rect x="140" y="417" width="148" height="14" rx="3" fill="#5dca7a" opacity="0.7"/>
  <text x="296" y="428" font-family="system-ui, sans-serif" font-size="11" fill="#5dca7a">312 MB/s</text>

  <text x="100" y="452" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b8a">10GbE</text>
  <rect x="140" y="442" width="220" height="14" rx="3" fill="#c8ff00"/>
  <text x="368" y="453" font-family="system-ui, sans-serif" font-size="11" fill="#c8ff00" font-weight="700">1,250 MB/s</text>

  <!-- Feature badges row -->
  <rect x="80" y="490" width="105" height="28" rx="5" fill="#1a1a38" stroke="#c8ff00" stroke-width="1.5"/>
  <text x="132" y="509" font-family="system-ui, sans-serif" font-size="12" fill="#c8ff00" text-anchor="middle">SFP+ Cards</text>

  <rect x="198" y="490" width="105" height="28" rx="5" fill="#1a1a38" stroke="#5090e0" stroke-width="1.5"/>
  <text x="250" y="509" font-family="system-ui, sans-serif" font-size="12" fill="#5090e0" text-anchor="middle">DAC Cables</text>

  <rect x="316" y="490" width="105" height="28" rx="5" fill="#1a1a38" stroke="#5dca7a" stroke-width="1.5"/>
  <text x="368" y="509" font-family="system-ui, sans-serif" font-size="12" fill="#5dca7a" text-anchor="middle">10G Switches</text>

  <!-- Footer -->
  <text x="600" y="600" font-family="system-ui, sans-serif" font-size="12" fill="#4a4a6a" text-anchor="middle">techfuelhq.com · 10GbE Homelab Networking · April 2026</text>
</svg>
