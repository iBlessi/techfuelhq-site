<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#0c0c28"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a3a"/>
      <stop offset="100%" stop-color="#111128"/>
    </linearGradient>
    <linearGradient id="green-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5dca7a"/>
      <stop offset="100%" stop-color="#2a8a4a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5dca7a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a3a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#5dca7a"/>

  <!-- Left glow accent -->
  <ellipse cx="150" cy="315" rx="200" ry="300" fill="#5dca7a" opacity="0.04"/>

  <!-- Mini PC box — main body -->
  <g filter="url(#shadow)">
    <!-- PC chassis -->
    <rect x="560" y="155" width="200" height="240" rx="14" fill="url(#box-grad)" stroke="#2a2a4a" stroke-width="2"/>
    <!-- Front panel texture -->
    <rect x="575" y="170" width="170" height="200" rx="8" fill="#0f0f28"/>
    <!-- Power button LED -->
    <circle cx="610" cy="185" r="7" fill="#5dca7a" filter="url(#glow)"/>
    <circle cx="610" cy="185" r="4" fill="#8fffa8"/>
    <!-- USB ports -->
    <rect x="580" y="198" width="20" height="10" rx="2" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="580" y="213" width="20" height="10" rx="2" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <!-- Activity LEDs -->
    <circle cx="610" cy="201" r="3" fill="#5dca7a" opacity="0.8"/>
    <circle cx="610" cy="216" r="3" fill="#5090e0" opacity="0.6"/>
    <!-- Ventilation slots -->
    <rect x="625" y="195" width="105" height="4" rx="2" fill="#1a1a3a"/>
    <rect x="625" y="205" width="105" height="4" rx="2" fill="#1a1a3a"/>
    <rect x="625" y="215" width="105" height="4" rx="2" fill="#1a1a3a"/>
    <rect x="625" y="225" width="105" height="4" rx="2" fill="#1a1a3a"/>
    <rect x="625" y="235" width="105" height="4" rx="2" fill="#1a1a3a"/>
    <rect x="625" y="245" width="105" height="4" rx="2" fill="#1a1a3a"/>
    <rect x="625" y="255" width="105" height="4" rx="2" fill="#1a1a3a"/>
    <!-- PVE Logo text in box -->
    <text x="660" y="320" font-family="monospace, 'Courier New'" font-size="28" font-weight="900" fill="#5dca7a" text-anchor="middle" filter="url(#glow)">PVE</text>
    <text x="660" y="342" font-family="monospace" font-size="10" fill="#6b6b8a" text-anchor="middle">PROXMOX VE 8.x</text>
    <!-- Stand -->
    <rect x="630" y="395" width="60" height="8" rx="4" fill="#2a2a4a"/>
    <rect x="610" y="400" width="100" height="6" rx="3" fill="#1e1e38"/>
  </g>

  <!-- Network cables from PC -->
  <!-- Ethernet cable going right -->
  <path d="M 760 310 Q 850 310 850 350 Q 850 390 900 390" stroke="#5dca7a" stroke-width="3" fill="none" stroke-dasharray="8,4" opacity="0.7"/>

  <!-- Network switch icon -->
  <rect x="900" y="370" width="140" height="55" rx="8" fill="#1a1a38" stroke="#5090e0" stroke-width="1.5"/>
  <text x="970" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#6b6b8a" text-anchor="middle">SWITCH</text>
  <!-- Switch ports -->
  <rect x="914" y="397" width="8" height="6" rx="1" fill="#5090e0"/>
  <rect x="926" y="397" width="8" height="6" rx="1" fill="#5090e0"/>
  <rect x="938" y="397" width="8" height="6" rx="1" fill="#5dca7a"/>
  <rect x="950" y="397" width="8" height="6" rx="1" fill="#5dca7a"/>
  <rect x="962" y="397" width="8" height="6" rx="1" fill="#2a2a4a"/>
  <rect x="974" y="397" width="8" height="6" rx="1" fill="#2a2a4a"/>
  <rect x="986" y="397" width="8" height="6" rx="1" fill="#2a2a4a"/>
  <rect x="998" y="397" width="8" height="6" rx="1" fill="#2a2a4a"/>
  <text x="970" y="418" font-family="monospace" font-size="9" fill="#5090e0" text-anchor="middle">1GbE · 8-port</text>

  <!-- VM boxes floating above/around the PC -->
  <!-- VM 1 -->
  <rect x="700" y="110" width="110" height="60" rx="7" fill="#1a1a38" stroke="#5dca7a" stroke-width="1.5"/>
  <text x="755" y="132" font-family="monospace" font-size="11" font-weight="700" fill="#5dca7a" text-anchor="middle">VM 1</text>
  <text x="755" y="148" font-family="monospace" font-size="9" fill="#9090a8" text-anchor="middle">Home Assistant</text>
  <text x="755" y="162" font-family="monospace" font-size="9" fill="#6b6b8a" text-anchor="middle">2 vCPU · 4GB</text>

  <!-- VM 2 -->
  <rect x="830" y="175" width="110" height="60" rx="7" fill="#1a1a38" stroke="#5dca7a" stroke-width="1.5"/>
  <text x="885" y="197" font-family="monospace" font-size="11" font-weight="700" fill="#5dca7a" text-anchor="middle">VM 2</text>
  <text x="885" y="213" font-family="monospace" font-size="9" fill="#9090a8" text-anchor="middle">Nginx Proxy</text>
  <text x="885" y="227" font-family="monospace" font-size="9" fill="#6b6b8a" text-anchor="middle">1 vCPU · 2GB</text>

  <!-- VM 3 -->
  <rect x="830" y="265" width="110" height="60" rx="7" fill="#1a1a38" stroke="#c8ff00" stroke-width="1.5"/>
  <text x="885" y="287" font-family="monospace" font-size="11" font-weight="700" fill="#c8ff00" text-anchor="middle">CT 1</text>
  <text x="885" y="303" font-family="monospace" font-size="9" fill="#9090a8" text-anchor="middle">LXC: Pi-hole</text>
  <text x="885" y="317" font-family="monospace" font-size="9" fill="#6b6b8a" text-anchor="middle">512MB · 4GB</text>

  <!-- Connector lines to VMs -->
  <line x1="725" y1="155" x2="680" y2="165" stroke="#5dca7a" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="760" y1="155" x2="760" y2="155" stroke="#5dca7a" stroke-width="1" opacity="0.4"/>
  <path d="M 760 155 Q 830 160 835 175" stroke="#5dca7a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" opacity="0.6"/>
  <path d="M 760 200 Q 820 240 830 265" stroke="#c8ff00" stroke-width="1.5" fill="none" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Title text area -->
  <text x="80" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5dca7a" font-weight="600" letter-spacing="2">HOMELAB GUIDE</text>
  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#e8e8f0" leading="1.1">Box to First VM</text>
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#e8e8f0">in Under an Hour</text>
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6b6b8a">Proxmox VE 8 on a Mini PC —</text>
  <text x="80" y="374" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6b6b8a">no prior Linux experience needed</text>

  <!-- Feature badges -->
  <rect x="80" y="405" width="130" height="34" rx="6" fill="#1a1a38" stroke="#5dca7a" stroke-width="1.5"/>
  <text x="145" y="427" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5dca7a" text-anchor="middle">Free &amp; Open Source</text>

  <rect x="225" y="405" width="110" height="34" rx="6" fill="#1a1a38" stroke="#c8ff00" stroke-width="1.5"/>
  <text x="280" y="427" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c8ff00" text-anchor="middle">KVM + LXC</text>

  <rect x="350" y="405" width="120" height="34" rx="6" fill="#1a1a38" stroke="#5090e0" stroke-width="1.5"/>
  <text x="410" y="427" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5090e0" text-anchor="middle">Web GUI</text>

  <!-- Footer -->
  <text x="60" y="598" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4a4a6a">techfuelhq.com · Proxmox VE Setup Guide · April 2026</text>
</svg>
