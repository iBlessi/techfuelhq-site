<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<rect width="1200" height="630" fill="#0a0a23"/>
<text x="600" y="40" text-anchor="middle" fill="#c8ff00" font-size="20" font-weight="700" font-family="Inter,sans-serif">SELF-HOSTED SERVICE RAM REQUIREMENTS</text>
<text x="600" y="62" text-anchor="middle" fill="#8888aa" font-size="12" font-family="Inter,sans-serif">Horizontal bars show RAM usage | Docker-based unless noted</text>
<!-- RAM scale -->
<text x="200" y="95" text-anchor="middle" fill="#555570" font-size="10" font-family="Inter,sans-serif">256MB</text>
<text x="350" y="95" text-anchor="middle" fill="#555570" font-size="10" font-family="Inter,sans-serif">512MB</text>
<text x="500" y="95" text-anchor="middle" fill="#555570" font-size="10" font-family="Inter,sans-serif">1GB</text>
<text x="650" y="95" text-anchor="middle" fill="#555570" font-size="10" font-family="Inter,sans-serif">2GB</text>
<text x="800" y="95" text-anchor="middle" fill="#555570" font-size="10" font-family="Inter,sans-serif">4GB</text>
<text x="950" y="95" text-anchor="middle" fill="#555570" font-size="10" font-family="Inter,sans-serif">6GB</text>
<text x="1100" y="95" text-anchor="middle" fill="#555570" font-size="10" font-family="Inter,sans-serif">8GB+</text>
<line x1="130" y1="100" x2="1150" y2="100" stroke="#1a1a3a" stroke-width="1"/>
<!-- Pi-hole -->
<text x="120" y="140" text-anchor="end" fill="#c8ff00" font-size="13" font-weight="600" font-family="Inter,sans-serif">Pi-hole</text>
<rect x="130" y="125" width="120" height="25" fill="#c8ff00" rx="4"/>
<text x="260" y="142" fill="#ccccdd" font-size="11" font-family="Inter,sans-serif">512MB | Instant payoff</text>
<!-- Uptime Kuma -->
<text x="120" y="185" text-anchor="end" fill="#c8ff00" font-size="13" font-weight="600" font-family="Inter,sans-serif">Uptime Kuma</text>
<rect x="130" y="170" width="80" height="25" fill="#c8ff00" rx="4"/>
<text x="220" y="187" fill="#ccccdd" font-size="11" font-family="Inter,sans-serif">256MB | Node.js or Docker</text>
<!-- Nextcloud -->
<text x="120" y="230" text-anchor="end" fill="#6b8f00" font-size="13" font-weight="600" font-family="Inter,sans-serif">Nextcloud</text>
<rect x="130" y="215" width="120" height="25" fill="#6b8f00" rx="4" opacity="0.6"/>
<rect x="130" y="215" width="380" height="25" fill="#6b8f00" rx="4" opacity="0.3"/>
<text x="520" y="232" fill="#ccccdd" font-size="11" font-family="Inter,sans-serif">512MB min → 2GB rec. | AIO install</text>
<!-- Jellyfin -->
<text x="120" y="275" text-anchor="end" fill="#6b8f00" font-size="13" font-weight="600" font-family="Inter,sans-serif">Jellyfin</text>
<rect x="130" y="260" width="500" height="25" fill="#6b8f00" rx="4" opacity="0.4"/>
<rect x="130" y="260" width="700" height="25" fill="#6b8f00" rx="4" opacity="0.2"/>
<text x="840" y="277" fill="#ccccdd" font-size="11" font-family="Inter,sans-serif">4GB min → 8GB rec. | N100 for transcode</text>
<!-- Home Assistant -->
<text x="120" y="320" text-anchor="end" fill="#555570" font-size="13" font-weight="600" font-family="Inter,sans-serif">Home Asst.</text>
<rect x="130" y="305" width="380" height="25" fill="#555570" rx="4" opacity="0.5"/>
<text x="520" y="322" fill="#ccccdd" font-size="11" font-family="Inter,sans-serif">2GB | HA OS recommended | UEFI required</text>
<!-- Immich -->
<text x="120" y="365" text-anchor="end" fill="#555570" font-size="13" font-weight="600" font-family="Inter,sans-serif">Immich</text>
<rect x="130" y="350" width="600" height="25" fill="#ff6b6b" rx="4" opacity="0.3"/>
<rect x="130" y="350" width="700" height="25" fill="#ff6b6b" rx="4" opacity="0.15"/>
<text x="840" y="367" fill="#ff6b6b" font-size="11" font-family="Inter,sans-serif">6GB min → 8GB+ rec. | ML-hungry | Docker only</text>
<!-- Total stacked bar -->
<rect x="130" y="410" width="1020" height="40" fill="#12122a" rx="6"/>
<rect x="130" y="410" width="80" height="40" fill="#c8ff00" rx="6" opacity="0.8"/>
<rect x="210" y="410" width="60" height="40" fill="#c8ff00" rx="0" opacity="0.6"/>
<rect x="270" y="410" width="130" height="40" fill="#6b8f00" rx="0" opacity="0.5"/>
<rect x="400" y="410" width="250" height="40" fill="#6b8f00" rx="0" opacity="0.4"/>
<rect x="650" y="410" width="130" height="40" fill="#555570" rx="0" opacity="0.5"/>
<rect x="780" y="410" width="370" height="40" fill="#ff6b6b" rx="0" opacity="0.3"/>
<text x="600" y="435" text-anchor="middle" fill="#fff" font-size="12" font-weight="600" font-family="Inter,sans-serif">ALL 6 SERVICES: ~16-20GB RAM total (Tier 3 hardware)</text>
<!-- Notes -->
<rect x="130" y="470" width="940" height="65" fill="#12122a" rx="8"/>
<text x="145" y="492" fill="#c8ff00" font-size="12" font-weight="600" font-family="Inter,sans-serif">KEY NOTES:</text>
<text x="260" y="492" fill="#ccccdd" font-size="11" font-family="Inter,sans-serif">Immich is NOT a backup — your photos need separate backups</text>
<text x="145" y="512" fill="#ccccdd" font-size="11" font-family="Inter,sans-serif">AMD GPUs not recommended for Jellyfin transcode | Nextcloud AIO is the only sane install method</text>
<text x="145" y="525" fill="#ccccdd" font-size="11" font-family="Inter,sans-serif">Home Assistant Docker loses Supervisor + add-ons — use HA OS in a VM instead</text>
<!-- Footer -->
<text x="600" y="570" text-anchor="middle" fill="#555570" font-size="11" font-family="Inter,sans-serif">techfuelhq.com | Self-Hosting Essentials 2026</text>
<rect x="200" y="585" width="800" height="3" fill="#c8ff00" rx="2" opacity="0.3"/>
</svg>
