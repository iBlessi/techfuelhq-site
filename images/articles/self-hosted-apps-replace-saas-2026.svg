<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>The 12 best self-hosted apps of 2026 that replace SaaS</title>
  <desc>TechFuel HQ buying guide. The top five self-hosted apps with their SaaS replacement, difficulty score and hardware floor: Immich replaces Google Photos, Nextcloud AIO replaces Google Drive and Dropbox, Vaultwarden replaces 1Password, Paperless-ngx replaces Evernote scan, Jellyfin replaces Plex. The full 12-app stack runs on a 32GB Ryzen 5825U or Intel 12th-gen mini PC with a 1TB NVMe, with RAM the bottleneck at roughly 24GB to run everything.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="78" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">BUYING GUIDE · SELF-HOSTED · 2026</text>
  <text x="70" y="128" fill="#e8e8f0" font-size="48" font-weight="900">12 Self-Hosted Apps That Replace SaaS</text>
  <text x="70" y="162" fill="#6b6b8a" font-size="19">The shortlist that outgrew its SaaS original — top five get full copy-paste compose files</text>

  <!-- Ranked picks panel -->
  <g transform="translate(70,196)">
    <rect width="720" height="358" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="24" y="34" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">THE TOP 5 — FULL SETUPS</text>

    <!-- column labels -->
    <text x="74" y="62" fill="#6b6b8a" font-size="11" letter-spacing="1.5" font-weight="700">APP</text>
    <text x="290" y="62" fill="#6b6b8a" font-size="11" letter-spacing="1.5" font-weight="700">REPLACES</text>
    <text x="556" y="62" text-anchor="middle" fill="#6b6b8a" font-size="11" letter-spacing="1.5" font-weight="700">DIFF</text>
    <text x="696" y="62" text-anchor="end" fill="#6b6b8a" font-size="11" letter-spacing="1.5" font-weight="700">RAM FLOOR</text>

    <!-- row 1 Immich -->
    <rect x="14" y="76" width="692" height="50" rx="6" fill="#13132e"/>
    <text x="28" y="98" fill="#c8ff00" font-size="17" font-weight="900">1</text>
    <text x="48" y="98" fill="#e8e8f0" font-size="17" font-weight="700">Immich</text>
    <text x="48" y="116" fill="#6b6b8a" font-size="12">ML face + object search</text>
    <text x="290" y="107" fill="#c0c0d8" font-size="15">Google Photos / iCloud</text>
    <text x="556" y="107" text-anchor="middle" fill="#e08828" font-size="15" font-weight="700">3</text>
    <text x="696" y="107" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">6 GB · 2 cores</text>

    <!-- row 2 Nextcloud AIO -->
    <rect x="14" y="130" width="692" height="50" rx="6" fill="#0d0d28"/>
    <text x="28" y="152" fill="#c8ff00" font-size="17" font-weight="900">2</text>
    <text x="48" y="152" fill="#e8e8f0" font-size="17" font-weight="700">Nextcloud AIO</text>
    <text x="48" y="170" fill="#6b6b8a" font-size="12">One container, whole stack</text>
    <text x="290" y="161" fill="#c0c0d8" font-size="15">Drive / Dropbox / Office</text>
    <text x="556" y="161" text-anchor="middle" fill="#e08828" font-size="15" font-weight="700">3</text>
    <text x="696" y="161" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">4 GB · 2 cores</text>

    <!-- row 3 Vaultwarden -->
    <rect x="14" y="184" width="692" height="50" rx="6" fill="#13132e"/>
    <text x="28" y="206" fill="#c8ff00" font-size="17" font-weight="900">3</text>
    <text x="48" y="206" fill="#e8e8f0" font-size="17" font-weight="700">Vaultwarden</text>
    <text x="48" y="224" fill="#6b6b8a" font-size="12">Easiest win on the list</text>
    <text x="290" y="215" fill="#c0c0d8" font-size="15">Bitwarden cloud / 1Password</text>
    <text x="556" y="215" text-anchor="middle" fill="#5dca7a" font-size="15" font-weight="700">1</text>
    <text x="696" y="215" text-anchor="end" fill="#c8ff00" font-size="15" font-weight="700">256 MB</text>

    <!-- row 4 Paperless-ngx -->
    <rect x="14" y="238" width="692" height="50" rx="6" fill="#0d0d28"/>
    <text x="28" y="260" fill="#c8ff00" font-size="17" font-weight="900">4</text>
    <text x="48" y="260" fill="#e8e8f0" font-size="17" font-weight="700">Paperless-ngx</text>
    <text x="48" y="278" fill="#6b6b8a" font-size="12">OCR makes paper searchable</text>
    <text x="290" y="269" fill="#c0c0d8" font-size="15">Evernote / Dropbox Scan</text>
    <text x="556" y="269" text-anchor="middle" fill="#e08828" font-size="15" font-weight="700">3</text>
    <text x="696" y="269" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">2 GB</text>

    <!-- row 5 Jellyfin -->
    <rect x="14" y="292" width="692" height="50" rx="6" fill="#13132e"/>
    <text x="28" y="314" fill="#c8ff00" font-size="17" font-weight="900">5</text>
    <text x="48" y="314" fill="#e8e8f0" font-size="17" font-weight="700">Jellyfin</text>
    <text x="48" y="332" fill="#6b6b8a" font-size="12">Still the Plex-killer</text>
    <text x="290" y="323" fill="#c0c0d8" font-size="15">Plex / Netflix / Disney+</text>
    <text x="556" y="323" text-anchor="middle" fill="#5dca7a" font-size="15" font-weight="700">2</text>
    <text x="696" y="323" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">4 GB · iGPU</text>
  </g>

  <!-- Right column: the other 7 + hardware -->
  <g transform="translate(814,196)">
    <rect width="316" height="170" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="22" y="32" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">THE OTHER 7</text>
    <text x="22" y="62" fill="#c0c0d8" font-size="15">AdGuard Home · Tailscale</text>
    <text x="22" y="88" fill="#c0c0d8" font-size="15">Home Assistant OS · n8n</text>
    <text x="22" y="114" fill="#c0c0d8" font-size="15">AudioBookshelf · BookStack</text>
    <text x="22" y="140" fill="#c0c0d8" font-size="15">Uptime Kuma</text>
    <text x="22" y="160" fill="#6b6b8a" font-size="12">Cut: Plex, Pi-hole, self-hosted email</text>
  </g>

  <g transform="translate(814,378)">
    <rect width="316" height="176" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="22" y="32" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">RUNS THE WHOLE STACK</text>
    <text x="22" y="66" fill="#c8ff00" font-size="34" font-weight="900">~24 GB</text>
    <text x="22" y="88" fill="#6b6b8a" font-size="13">RAM to run all 12 with headroom</text>
    <text x="22" y="122" fill="#e8e8f0" font-size="15" font-weight="600">32 GB Ryzen 5825U</text>
    <text x="22" y="144" fill="#c0c0d8" font-size="14">or Intel 12th-gen mini PC</text>
    <text x="22" y="164" fill="#c0c0d8" font-size="14">+ 1 TB NVMe · RAM is the bottleneck</text>
  </g>

  <!-- Footer -->
  <text x="70" y="592" fill="#4a4a6a" font-size="13">TechFuel HQ · Buying Guide · Specs per each project's official docs and Docker image tags</text>
  <text x="1130" y="592" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
