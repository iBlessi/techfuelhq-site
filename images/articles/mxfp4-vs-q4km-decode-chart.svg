<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif">
  <desc>Measured ollama decode speed on an RTX 5080: Llama 3.2 3B 298 to 313 tokens per second, gpt-oss 20B in MXFP4 187 to 190, Qwen 2.5 7B 177 to 180, Qwen 2.5 14B in Q4_K_M 94 to 97. The 21-billion-parameter MoE model decodes twice as fast as the dense 14B and matches the dense 7B.</desc>
