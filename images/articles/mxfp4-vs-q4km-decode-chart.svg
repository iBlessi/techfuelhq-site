<line x1="637" y1="90" x2="637" y2="580" stroke="#1e1e3a" stroke-width="1"/><text x="637" y="606" text-anchor="middle" fill="#8a8aa5" font-size="14">150</text>
<line x1="769" y1="90" x2="769" y2="580" stroke="#1e1e3a" stroke-width="1"/><text x="769" y="606" text-anchor="middle" fill="#8a8aa5" font-size="14">200</text>
<line x1="902" y1="90" x2="902" y2="580" stroke="#1e1e3a" stroke-width="1"/><text x="902" y="606" text-anchor="middle" fill="#8a8aa5" font-size="14">250</text>
<line x1="1034" y1="90" x2="1034" y2="580" stroke="#1e1e3a" stroke-width="1"/><text x="1034" y="606" text-anchor="middle" fill="#8a8aa5" font-size="14">300</text>
