<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>Samsung 970 EVO Plus 1TB review card — 4.2 out of 5 rating with key NVMe specifications</title>
  <desc>TechFuel HQ review card for the Samsung 970 EVO Plus 1TB, rated 4.2 out of 5. Key specifications: PCIe 3.0 x4 NVMe 1.3 interface, 3,500 MB/s sequential read, 3,300 MB/s sequential write, 600,000 / 550,000 random read/write IOPS, LPDDR4 DRAM cache, 600 TBW endurance, and a 5-year warranty.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <text x="70" y="92" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">LONG-TERM REVIEW · NVMe SSD</text>
  <text x="70" y="150" fill="#e8e8f0" font-size="52" font-weight="900">Samsung 970 EVO Plus</text>
  <text x="70" y="190" fill="#6b6b8a" font-size="20">1TB PCIe 3.0 V-NAND — a Gen3 drive worth keeping in 2026</text>

  <text x="70" y="276" fill="#c8ff00" font-size="62" font-weight="900">4.2</text>
  <text x="188" y="276" fill="#6b6b8a" font-size="26" font-weight="700">/ 5</text>

  <g transform="translate(70,320)">
    <text x="0" y="0" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">VERDICT</text>
    <text x="0" y="34" fill="#c0c0d8" font-size="17">Reliable, properly-performing, aged gracefully.</text>
    <text x="0" y="62" fill="#c0c0d8" font-size="17">If it's in your system, keep it.</text>
    <g transform="translate(0,96)">
      <rect width="14" height="14" rx="3" fill="#5dca7a"/>
      <text x="24" y="12" fill="#c0c0d8" font-size="15">600 TBW endurance · 5-year warranty</text>
    </g>
    <g transform="translate(0,124)">
      <rect width="14" height="14" rx="3" fill="#5090e0"/>
      <text x="24" y="12" fill="#c0c0d8" font-size="15">LPDDR4 DRAM cache — no write cliff</text>
    </g>
    <g transform="translate(0,152)">
      <rect width="14" height="14" rx="3" fill="#e08828"/>
      <text x="24" y="12" fill="#c0c0d8" font-size="15">Runs warmer than Gen4 under sustained write</text>
    </g>
  </g>

  <g transform="translate(640,210)">
    <rect width="490" height="340" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <text x="24" y="36" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">KEY SPECIFICATIONS</text>

    <text x="24" y="76" fill="#c0c0d8" font-size="16">Interface</text>
    <text x="466" y="76" text-anchor="end" fill="#e8e8f0" font-size="16" font-weight="600">PCIe 3.0 ×4 · NVMe 1.3</text>

    <text x="24" y="112" fill="#c0c0d8" font-size="16">Sequential read</text>
    <text x="466" y="112" text-anchor="end" fill="#e8e8f0" font-size="16" font-weight="600">3,500 MB/s</text>

    <text x="24" y="148" fill="#c0c0d8" font-size="16">Sequential write</text>
    <text x="466" y="148" text-anchor="end" fill="#e8e8f0" font-size="16" font-weight="600">3,300 MB/s</text>

    <text x="24" y="184" fill="#c0c0d8" font-size="16">Random read (4KB)</text>
    <text x="466" y="184" text-anchor="end" fill="#c8ff00" font-size="16" font-weight="700">600,000 IOPS</text>

    <text x="24" y="220" fill="#c0c0d8" font-size="16">Random write (4KB)</text>
    <text x="466" y="220" text-anchor="end" fill="#c8ff00" font-size="16" font-weight="700">550,000 IOPS</text>

    <text x="24" y="256" fill="#c0c0d8" font-size="16">DRAM cache</text>
    <text x="466" y="256" text-anchor="end" fill="#e8e8f0" font-size="16" font-weight="600">Yes (LPDDR4)</text>

    <text x="24" y="292" fill="#c0c0d8" font-size="16">Endurance</text>
    <text x="466" y="292" text-anchor="end" fill="#e8e8f0" font-size="16" font-weight="600">600 TBW</text>

    <text x="24" y="328" fill="#c0c0d8" font-size="16">Warranty · Form factor</text>
    <text x="466" y="328" text-anchor="end" fill="#e8e8f0" font-size="16" font-weight="600">5 years · M.2 2280</text>
  </g>

  <text x="70" y="592" fill="#4a4a6a" font-size="13">TechFuel HQ · Hardware Review · Specs per Samsung official product page</text>
  <text x="1130" y="592" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
