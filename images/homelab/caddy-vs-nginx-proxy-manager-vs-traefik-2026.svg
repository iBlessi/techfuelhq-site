<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="772" viewBox="0 0 1200 772" font-family="Inter, system-ui, sans-serif" role="img">
  <title>Caddy vs Nginx Proxy Manager vs Traefik reverse proxy comparison for a homelab in 2026</title>
  <desc>Side-by-side comparison of three homelab reverse proxies: Caddy, Nginx Proxy Manager (NPM), and Traefik, across license, interface, automatic HTTPS, Docker auto-discovery, learning curve, and best-fit use. Caddy is Apache 2.0 config-as-code with the most automatic HTTPS; NPM is the MIT web-GUI beginner pick with no Docker auto-discovery; Traefik is MIT open-core with native Docker auto-discovery and the steepest learning curve. The call: NPM to start, Caddy for config-as-code, Traefik for Docker and Kubernetes labs.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="772" fill="#0a0a23"/>
  <rect width="1200" height="772" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="78" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">HOMELAB REVERSE PROXY COMPARISON &#183; 2026</text>
  <text x="70" y="128" fill="#e8e8f0" font-size="42" font-weight="900">Caddy vs Nginx Proxy Manager vs Traefik</text>
  <text x="70" y="162" fill="#6b6b8a" font-size="18">All three free and open source &#183; pick the one whose operating style matches how you like to work</text>

  <!-- Column header band -->
  <g transform="translate(70,198)">
    <!-- spec label column -->
    <rect x="0" y="0" width="320" height="64" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="20" y="29" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">COMPARE ON</text>
    <text x="20" y="50" fill="#6b6b8a" font-size="13" letter-spacing="1">(verified vs each project's repos)</text>

    <!-- Caddy column -->
    <rect x="334" y="0" width="240" height="64" rx="10" fill="#101028" stroke="#5090e0"/>
    <rect x="334" y="0" width="240" height="6" rx="3" fill="#5090e0"/>
    <text x="454" y="33" text-anchor="middle" fill="#e8e8f0" font-size="20" font-weight="900">Caddy</text>
    <text x="454" y="53" text-anchor="middle" fill="#5090e0" font-size="14" font-weight="600">config-as-code</text>

    <!-- NPM column (winner accent: easiest, start here) -->
    <rect x="586" y="0" width="240" height="64" rx="10" fill="#101028" stroke="#c8ff00"/>
    <rect x="586" y="0" width="240" height="6" rx="3" fill="#c8ff00"/>
    <text x="706" y="33" text-anchor="middle" fill="#e8e8f0" font-size="20" font-weight="900">Nginx Proxy Mgr</text>
    <text x="706" y="53" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="600">web GUI &#183; start here</text>

    <!-- Traefik column -->
    <rect x="838" y="0" width="240" height="64" rx="10" fill="#101028" stroke="#e08828"/>
    <rect x="838" y="0" width="240" height="6" rx="3" fill="#e08828"/>
    <text x="958" y="33" text-anchor="middle" fill="#e8e8f0" font-size="20" font-weight="900">Traefik</text>
    <text x="958" y="53" text-anchor="middle" fill="#e08828" font-size="14" font-weight="600">Docker labels</text>
  </g>

  <!-- Spec rows -->
  <g transform="translate(70,278)">
    <!-- Row 1: license -->
    <rect x="0" y="0" width="1008" height="60" rx="8" fill="#13132e"/>
    <text x="20" y="29" fill="#c0c0d8" font-size="16" font-weight="600">License</text>
    <text x="20" y="49" fill="#6b6b8a" font-size="13">all free and open source</text>
    <text x="454" y="36" text-anchor="middle" fill="#c0c0d8" font-size="16" font-weight="700">Apache 2.0</text>
    <text x="706" y="36" text-anchor="middle" fill="#c0c0d8" font-size="16" font-weight="700">MIT</text>
    <text x="958" y="29" text-anchor="middle" fill="#c0c0d8" font-size="16" font-weight="700">MIT</text>
    <text x="958" y="48" text-anchor="middle" fill="#6b6b8a" font-size="12">(open-core add-ons)</text>

    <!-- Row 2: interface -->
    <rect x="0" y="64" width="1008" height="60" rx="8" fill="#0d0d28"/>
    <text x="20" y="93" fill="#c0c0d8" font-size="16" font-weight="600">Interface</text>
    <text x="20" y="113" fill="#6b6b8a" font-size="13">how you configure it</text>
    <text x="454" y="100" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="700">Caddyfile</text>
    <text x="706" y="100" text-anchor="middle" fill="#c8ff00" font-size="15" font-weight="800">Web GUI</text>
    <text x="958" y="100" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="700">Config + labels</text>

    <!-- Row 3: automatic HTTPS -->
    <rect x="0" y="128" width="1008" height="60" rx="8" fill="#13132e"/>
    <text x="20" y="157" fill="#c0c0d8" font-size="16" font-weight="600">Automatic HTTPS</text>
    <text x="20" y="177" fill="#6b6b8a" font-size="13">all automate Let's Encrypt</text>
    <text x="454" y="164" text-anchor="middle" fill="#5090e0" font-size="15" font-weight="800">Most automatic</text>
    <text x="706" y="164" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="700">Per-host, via UI</text>
    <text x="958" y="164" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="700">Cert resolvers</text>

    <!-- Row 4: Docker auto-discovery -->
    <rect x="0" y="192" width="1008" height="60" rx="8" fill="#0d0d28"/>
    <text x="20" y="221" fill="#c0c0d8" font-size="16" font-weight="600">Docker auto-discovery</text>
    <text x="20" y="241" fill="#6b6b8a" font-size="13">routes register on deploy</text>
    <text x="454" y="228" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="700">Plugin only</text>
    <text x="706" y="228" text-anchor="middle" fill="#e06b6b" font-size="15" font-weight="800">No</text>
    <text x="958" y="228" text-anchor="middle" fill="#e08828" font-size="15" font-weight="800">Yes (native)</text>

    <!-- Row 5: learning curve -->
    <rect x="0" y="256" width="1008" height="60" rx="8" fill="#13132e"/>
    <text x="20" y="285" fill="#c0c0d8" font-size="16" font-weight="600">Learning curve</text>
    <text x="20" y="305" fill="#6b6b8a" font-size="13">by community consensus</text>
    <text x="454" y="292" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="700">Moderate</text>
    <text x="706" y="292" text-anchor="middle" fill="#c8ff00" font-size="15" font-weight="800">Lowest</text>
    <text x="958" y="292" text-anchor="middle" fill="#e08828" font-size="15" font-weight="800">Steepest</text>

    <!-- Row 6: best for -->
    <rect x="0" y="320" width="1008" height="60" rx="8" fill="#0d0d28"/>
    <text x="20" y="349" fill="#c0c0d8" font-size="16" font-weight="600">Best for</text>
    <text x="20" y="369" fill="#6b6b8a" font-size="13">match it to yourself</text>
    <text x="454" y="356" text-anchor="middle" fill="#c0c0d8" font-size="14" font-weight="600">Config-as-code, TLS</text>
    <text x="706" y="356" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">Beginners, GUI</text>
    <text x="958" y="356" text-anchor="middle" fill="#c0c0d8" font-size="14" font-weight="600">Docker / K8s labs</text>
  </g>

  <!-- Verdict strip -->
  <g transform="translate(70,684)">
    <rect x="0" y="0" width="1008" height="66" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="#c8ff00"/>
    <text x="26" y="29" fill="#c8ff00" font-size="13" letter-spacing="2" font-weight="700">THE CALL</text>
    <text x="26" y="52" fill="#c0c0d8" font-size="15">Start on NPM's GUI. Caddy for config-as-code and easiest auto HTTPS; Traefik for Docker/Kubernetes labs. The proxy won't be your bottleneck.</text>
  </g>

  <!-- Footer -->
  <text x="70" y="762" fill="#4a4a6a" font-size="13">TechFuel HQ &#183; Homelab Reverse Proxy Comparison &#183; verified against each project's repos and docs</text>
  <text x="1130" y="762" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
