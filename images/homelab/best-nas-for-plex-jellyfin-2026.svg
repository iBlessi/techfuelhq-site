    <text x="64" y="446" fill="#e8e8f0" font-size="25" font-weight="700">TerraMaster F4-424 Pro<tspan fill="#9a9ab5" font-size="18" font-weight="400">   ·  Core i3-N305</tspan></text>
    <rect x="978" y="422" width="158" height="30" rx="15" fill="rgba(93,202,122,0.12)" stroke="#5dca7a" stroke-width="1"/>
    <text x="1057" y="442" fill="#5dca7a" font-size="14.5" font-weight="700" text-anchor="middle">Quick Sync ✓</text>

