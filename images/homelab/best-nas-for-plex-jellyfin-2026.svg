    <rect x="978" y="278" width="158" height="30" rx="15" fill="rgba(93,202,122,0.12)" stroke="#5dca7a" stroke-width="1"/>
    <text x="1057" y="298" fill="#5dca7a" font-size="14.5" font-weight="700" text-anchor="middle">Quick Sync ✓</text>

