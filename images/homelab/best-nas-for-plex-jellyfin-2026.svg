  <text x="88" y="610" fill="#c8c8dc" font-size="16">The 2025 models dropped hardware transcoding — AMD chips with no iGPU, or Intel chips with the driver removed.</text>
  <text x="1136" y="662" fill="#44445a" font-size="14" text-anchor="end">techfuelhq.com</text>
