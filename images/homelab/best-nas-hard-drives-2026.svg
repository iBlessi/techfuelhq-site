  <!-- Bottom rule band -->
  <g transform="translate(70,475)">
    <rect x="0" y="0" width="1072" height="210" rx="12" fill="#0d0d24" stroke="#1e1e3a"/>
    <text x="30" y="46" fill="#c8ff00" font-size="15" letter-spacing="2" font-weight="700">THE CMR-vs-SMR RULE</text>
    <text x="30" y="86" fill="#e8e8f0" font-size="20" font-weight="700">Every current NAS-Pro family is 100% CMR &#8212; that's the drive you want.</text>
    <text x="30" y="122" fill="#a0a0b8" font-size="17">Buy: WD Red Plus, WD Red Pro, Seagate IronWolf &amp; IronWolf Pro, Toshiba N300 &amp; N300 Pro (all CMR).</text>
    <text x="30" y="152" fill="#a0a0b8" font-size="17">Avoid for RAID: the legacy plain WD Red &#8220;EFAX&#8221; drives (WD20/30/40/60EFAX) &#8212; those are SMR.</text>
    <text x="30" y="188" fill="#6b6b8a" font-size="15">Prices: live Amazon snapshot 2026-07-04, move week to week. Specs from manufacturer data sheets.</text>
  </g>

  <text x="70" y="726" fill="#3a3a5a" font-size="13">TechFuel HQ &#183; best-nas-hard-drives-2026 &#183; not first-party tested; editorial picks from cited specs</text>
