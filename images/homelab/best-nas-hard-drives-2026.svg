  <!-- Card 4: Budget recert -->
  <g transform="translate(886,205)">
    <rect x="0" y="0" width="256" height="230" rx="12" fill="#101028" stroke="#c8ff00"/>
    <rect x="0" y="0" width="256" height="6" rx="3" fill="#c8ff00"/>
    <text x="20" y="42" fill="#c8ff00" font-size="13" letter-spacing="1" font-weight="700">BUDGET / VALUE</text>
    <text x="20" y="76" fill="#e8e8f0" font-size="22" font-weight="900">Recertified</text>
    <text x="20" y="101" fill="#e8e8f0" font-size="22" font-weight="900">big-capacity</text>
    <text x="20" y="138" fill="#c8ff00" font-size="30" font-weight="900">$31.25/TB</text>
    <text x="20" y="166" fill="#a0a0b8" font-size="15">recert 16TB IronWolf Pro</text>
    <text x="20" y="194" fill="#a0a0b8" font-size="15">~19&#8211;22% under new</text>
    <text x="20" y="217" fill="#6b6b8a" font-size="14">Check the warranty terms</text>
