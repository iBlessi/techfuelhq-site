<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="772" viewBox="0 0 1200 772" font-family="Inter, system-ui, sans-serif" role="img">
  <title>DAS vs NAS comparison matrix for homelab storage in 2026</title>
  <desc>Side-by-side comparison of direct-attached storage (DAS) and network-attached storage (NAS) across reach, wire speed, power draw and yearly cost, data integrity, and best-fit use case. DAS plugs into one computer, hits 800 to 2,600 MB/s, and costs a few dollars a year. NAS serves every device on the network at 280 to 1,250 MB/s, runs 24/7 at about 60 dollars a year, and adds ZFS self-healing. Neither RAID nor ZFS is a backup; run 3-2-1.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="772" fill="#0a0a23"/>
  <rect width="1200" height="772" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="78" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">HOMELAB STORAGE COMPARISON &#183; 2026</text>
  <text x="70" y="128" fill="#e8e8f0" font-size="44" font-weight="900">DAS vs NAS: Which Do You Need?</text>
  <text x="70" y="162" fill="#6b6b8a" font-size="19">One difference drives everything: storage for &#160;one computer&#160; vs storage for &#160;the whole house</text>

  <!-- Column header band -->
  <g transform="translate(70,198)">
    <!-- spec label column -->
    <rect x="0" y="0" width="380" height="64" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="20" y="29" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">DIMENSION</text>
    <text x="20" y="50" fill="#6b6b8a" font-size="13" letter-spacing="1">(the question that decides it)</text>

    <!-- DAS column (winner on speed / cost / simplicity) -->
    <rect x="394" y="0" width="328" height="64" rx="10" fill="#101028" stroke="#c8ff00"/>
    <rect x="394" y="0" width="328" height="6" rx="3" fill="#c8ff00"/>
    <text x="558" y="33" text-anchor="middle" fill="#e8e8f0" font-size="22" font-weight="900">DAS</text>
    <text x="558" y="53" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="600">direct-attached &#183; one host</text>

    <!-- NAS column -->
    <rect x="736" y="0" width="328" height="64" rx="10" fill="#101028" stroke="#5090e0"/>
    <rect x="736" y="0" width="328" height="6" rx="3" fill="#5090e0"/>
    <text x="900" y="33" text-anchor="middle" fill="#e8e8f0" font-size="22" font-weight="900">NAS</text>
    <text x="900" y="53" text-anchor="middle" fill="#5090e0" font-size="14" font-weight="600">network-attached &#183; every device</text>
  </g>

  <!-- Spec rows -->
  <g transform="translate(70,278)">
    <!-- Row 1: reach -->
    <rect x="0" y="0" width="994" height="62" rx="8" fill="#13132e"/>
    <text x="20" y="29" fill="#c0c0d8" font-size="16" font-weight="600">Reach</text>
    <text x="20" y="49" fill="#6b6b8a" font-size="13">who can use the storage</text>
    <text x="558" y="38" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="700">The one PC it's plugged into</text>
    <text x="900" y="38" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="700">Any device on the net + remote</text>

    <!-- Row 2: wire speed -->
    <rect x="0" y="66" width="994" height="62" rx="8" fill="#0d0d28"/>
    <text x="20" y="95" fill="#c0c0d8" font-size="16" font-weight="600">Wire speed</text>
    <text x="20" y="115" fill="#6b6b8a" font-size="13">real-world throughput</text>
    <text x="558" y="98" text-anchor="middle" fill="#c8ff00" font-size="16" font-weight="800">~800&#8211;2,600 MB/s</text>
    <text x="558" y="117" text-anchor="middle" fill="#6b6b8a" font-size="12">USB 3.2 Gen 2 &#8594; Thunderbolt RAID</text>
    <text x="900" y="98" text-anchor="middle" fill="#c0c0d8" font-size="16" font-weight="700">~280&#8211;1,250 MB/s</text>
    <text x="900" y="117" text-anchor="middle" fill="#6b6b8a" font-size="12">2.5GbE &#8594; 10GbE</text>

    <!-- Row 3: power -->
    <rect x="0" y="132" width="994" height="62" rx="8" fill="#13132e"/>
    <text x="20" y="161" fill="#c0c0d8" font-size="16" font-weight="600">Power draw</text>
    <text x="20" y="181" fill="#6b6b8a" font-size="13">when it actually runs</text>
    <text x="558" y="164" text-anchor="middle" fill="#c8ff00" font-size="16" font-weight="800">~15 W, only with your PC</text>
    <text x="900" y="164" text-anchor="middle" fill="#c0c0d8" font-size="16" font-weight="700">~30&#8211;55 W, 24/7</text>

    <!-- Row 4: yearly cost -->
    <rect x="0" y="198" width="994" height="62" rx="8" fill="#0d0d28"/>
    <text x="20" y="227" fill="#c0c0d8" font-size="16" font-weight="600">Yearly electricity</text>
    <text x="20" y="247" fill="#6b6b8a" font-size="13">2026 US average rate</text>
    <text x="558" y="234" text-anchor="middle" fill="#c8ff00" font-size="17" font-weight="800">A few dollars</text>
    <text x="900" y="234" text-anchor="middle" fill="#c0c0d8" font-size="17" font-weight="700">~$60 / year</text>

    <!-- Row 5: data integrity -->
    <rect x="0" y="264" width="994" height="62" rx="8" fill="#13132e"/>
    <text x="20" y="293" fill="#c0c0d8" font-size="16" font-weight="600">Data integrity</text>
    <text x="20" y="313" fill="#6b6b8a" font-size="13">bit-rot protection</text>
    <text x="558" y="302" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="700">Most boxes: no checksums</text>
    <text x="900" y="302" text-anchor="middle" fill="#5090e0" font-size="15" font-weight="800">ZFS checksums + self-heals</text>

    <!-- Row 6: best-fit -->
    <rect x="0" y="330" width="994" height="62" rx="8" fill="#0d0d28"/>
    <text x="20" y="359" fill="#c0c0d8" font-size="16" font-weight="600">Best-fit use</text>
    <text x="20" y="379" fill="#6b6b8a" font-size="13">match tool to the job</text>
    <text x="558" y="362" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="700">One PC &#183; video editing &#183; low power</text>
    <text x="900" y="362" text-anchor="middle" fill="#5090e0" font-size="14" font-weight="700">Multi-device &#183; 24/7 Plex &#183; Docker/VMs</text>
  </g>

  <!-- Verdict strip -->
  <g transform="translate(70,690)">
    <rect x="0" y="0" width="994" height="56" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <rect x="0" y="0" width="6" height="56" rx="3" fill="#c8ff00"/>
    <text x="26" y="24" fill="#c8ff00" font-size="13" letter-spacing="2" font-weight="700">THE CALL</text>
    <text x="26" y="44" fill="#c0c0d8" font-size="15">One computer? DAS wins on speed, cost, and power. Need a second device, 24/7 media, or ZFS integrity? NAS earns its bill. The drive is usually the real bottleneck &#8212; and neither RAID nor ZFS is a backup, so run 3-2-1.</text>
  </g>

  <!-- Footer -->
  <text x="70" y="766" fill="#4a4a6a" font-size="13">TechFuel HQ &#183; DAS vs NAS &#183; figures cited in-article</text>
  <text x="1130" y="766" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
