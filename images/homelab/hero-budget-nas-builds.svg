<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#0d0d28"/>
    </linearGradient>
    <linearGradient id="nas-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a38"/>
      <stop offset="100%" stop-color="#111128"/>
    </linearGradient>
    <linearGradient id="drive-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1a1a38"/>
    </linearGradient>
    <filter id="nas-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#5090e0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <defs>
    <pattern id="grid8" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid8)" opacity="0.4"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1200" height="5" fill="#5090e0"/>

  <!-- Background glow -->
  <ellipse cx="700" cy="320" rx="320" ry="250" fill="#5090e0" opacity="0.04"/>

  <!-- ===== 4-BAY NAS ENCLOSURE ===== -->
  <g filter="url(#nas-glow)">
    <!-- NAS outer body -->
    <rect x="480" y="120" width="360" height="390" rx="16" fill="url(#nas-body)" stroke="#5090e0" stroke-width="2.5"/>
    <!-- NAS front plate top strip -->
    <rect x="492" y="132" width="336" height="28" rx="6" fill="#0f0f28"/>
    <!-- Status LEDs -->
    <circle cx="516" cy="146" r="5" fill="#5dca7a" opacity="0.9"/>
    <circle cx="536" cy="146" r="5" fill="#5090e0" opacity="0.7"/>
    <circle cx="556" cy="146" r="5" fill="#5090e0" opacity="0.5"/>
    <circle cx="576" cy="146" r="5" fill="#6b6b8a" opacity="0.4"/>
    <!-- Power button -->
    <circle cx="790" cy="146" r="10" fill="#1e1e38" stroke="#5090e0" stroke-width="1.5"/>
    <circle cx="790" cy="146" r="5" fill="#5090e0" opacity="0.6"/>

    <!-- ===== DRIVE BAYS (4 bays) ===== -->
    <!-- Bay 1 (top) -->
    <rect x="492" y="172" width="336" height="72" rx="6" fill="#0f0f22" stroke="#2a2a4a" stroke-width="1"/>
    <!-- Drive 1 inserted -->
    <rect x="500" y="178" width="320" height="60" rx="4" fill="url(#drive-1)" stroke="#3a3a5a" stroke-width="1"/>
    <!-- Drive label area -->
    <rect x="510" y="185" width="200" height="46" rx="3" fill="#141428"/>
    <!-- Drive platters suggestion -->
    <circle cx="700" cy="208" r="18" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="1"/>
    <circle cx="700" cy="208" r="8" fill="#0f0f1e"/>
    <circle cx="700" cy="208" r="3" fill="#2a2a4a"/>
    <text x="512" y="204" font-family="monospace" font-size="10" fill="#6b6b8a">BAY 1</text>
    <text x="512" y="220" font-family="monospace" font-size="11" font-weight="700" fill="#5090e0">8TB IronWolf</text>
    <text x="512" y="236" font-family="monospace" font-size="9" fill="#6b6b8a">SATA III · 5400 RPM</text>
    <!-- Drive activity LED -->
    <circle cx="740" cy="208" r="4" fill="#5dca7a" opacity="0.8"/>

    <!-- Bay 2 -->
    <rect x="492" y="252" width="336" height="72" rx="6" fill="#0f0f22" stroke="#2a2a4a" stroke-width="1"/>
    <rect x="500" y="258" width="320" height="60" rx="4" fill="url(#drive-1)" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="510" y="265" width="200" height="46" rx="3" fill="#141428"/>
    <circle cx="700" cy="288" r="18" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="1"/>
    <circle cx="700" cy="288" r="8" fill="#0f0f1e"/>
    <circle cx="700" cy="288" r="3" fill="#2a2a4a"/>
    <text x="512" y="284" font-family="monospace" font-size="10" fill="#6b6b8a">BAY 2</text>
    <text x="512" y="300" font-family="monospace" font-size="11" font-weight="700" fill="#5090e0">8TB IronWolf</text>
    <text x="512" y="316" font-family="monospace" font-size="9" fill="#6b6b8a">SATA III · 5400 RPM</text>
    <circle cx="740" cy="288" r="4" fill="#5090e0" opacity="0.6"/>

    <!-- Bay 3 -->
    <rect x="492" y="332" width="336" height="72" rx="6" fill="#0f0f22" stroke="#2a2a4a" stroke-width="1"/>
    <rect x="500" y="338" width="320" height="60" rx="4" fill="url(#drive-1)" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="510" y="345" width="200" height="46" rx="3" fill="#141428"/>
    <circle cx="700" cy="368" r="18" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="1"/>
    <circle cx="700" cy="368" r="8" fill="#0f0f1e"/>
    <circle cx="700" cy="368" r="3" fill="#2a2a4a"/>
    <text x="512" y="364" font-family="monospace" font-size="10" fill="#6b6b8a">BAY 3</text>
    <text x="512" y="380" font-family="monospace" font-size="11" font-weight="700" fill="#c8ff00">12TB WD Red</text>
    <text x="512" y="396" font-family="monospace" font-size="9" fill="#6b6b8a">SATA III · 7200 RPM</text>
    <circle cx="740" cy="368" r="4" fill="#5dca7a" opacity="0.8"/>

    <!-- Bay 4 (empty) -->
    <rect x="492" y="412" width="336" height="72" rx="6" fill="#090916" stroke="#1a1a2e" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="660" y="452" font-family="system-ui, sans-serif" font-size="13" fill="#3a3a5a" text-anchor="middle">BAY 4 — EXPANSION READY</text>

    <!-- NAS model label -->
    <text x="660" y="506" font-family="monospace" font-size="11" fill="#6b6b8a" text-anchor="middle">SYNOLOGY DS423+ / QNAP TS-433</text>

    <!-- Network port bottom -->
    <rect x="540" y="520" width="24" height="16" rx="2" fill="#0f0f28" stroke="#5090e0" stroke-width="1.5"/>
    <text x="554" y="546" font-family="monospace" font-size="8" fill="#5090e0" text-anchor="middle">ETH</text>
    <rect x="575" y="520" width="24" height="16" rx="2" fill="#0f0f28" stroke="#3a3a5a" stroke-width="1"/>
    <text x="589" y="546" font-family="monospace" font-size="8" fill="#6b6b8a" text-anchor="middle">USB3</text>
  </g>

  <!-- Left side title -->
  <text x="80" y="150" font-family="system-ui, sans-serif" font-size="13" fill="#5090e0" letter-spacing="2">NAS BUILD GUIDE</text>
  <text x="80" y="220" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#e8e8f0">Best Budget</text>
  <text x="80" y="268" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#e8e8f0">NAS Builds</text>
  <text x="80" y="312" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#c8ff00">2026</text>

  <!-- Badges row -->
  <rect x="80" y="345" width="155" height="36" rx="8" fill="#1a1a38" stroke="#5090e0" stroke-width="2"/>
  <text x="157" y="368" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#5090e0" text-anchor="middle">Under $900</text>

  <rect x="248" y="345" width="145" height="36" rx="8" fill="#1a1a38" stroke="#5dca7a" stroke-width="2"/>
  <text x="320" y="368" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#5dca7a" text-anchor="middle">Under 20W</text>

  <!-- Features list -->
  <circle cx="90" cy="410" r="4" fill="#5090e0"/>
  <text x="104" y="415" font-family="system-ui, sans-serif" font-size="14" fill="#c0c0d8">4-bay enclosures</text>

  <circle cx="90" cy="438" r="4" fill="#5090e0"/>
  <text x="104" y="443" font-family="system-ui, sans-serif" font-size="14" fill="#c0c0d8">Plex + SMB + Time Machine</text>

  <circle cx="90" cy="466" r="4" fill="#5090e0"/>
  <text x="104" y="471" font-family="system-ui, sans-serif" font-size="14" fill="#c0c0d8">RAID 1 / SHR supported</text>

  <circle cx="90" cy="494" r="4" fill="#5dca7a"/>
  <text x="104" y="499" font-family="system-ui, sans-serif" font-size="14" fill="#c0c0d8">Always-on, silent operation</text>

  <!-- Storage capacity callout -->
  <rect x="80" y="524" width="350" height="52" rx="10" fill="#111128" stroke="#c8ff00" stroke-width="2"/>
  <text x="255" y="546" font-family="system-ui, sans-serif" font-size="13" fill="#6b6b8a" text-anchor="middle">EFFECTIVE STORAGE</text>
  <text x="255" y="568" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#c8ff00" text-anchor="middle">Up to 28TB usable</text>

  <!-- Footer -->
  <text x="600" y="610" font-family="system-ui, sans-serif" font-size="12" fill="#4a4a6a" text-anchor="middle">techfuelhq.com · Budget NAS Build Guide · April 2026</text>
</svg>
