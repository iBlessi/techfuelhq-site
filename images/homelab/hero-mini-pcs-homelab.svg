<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="100%" stop-color="#0d0d28"/>
    </linearGradient>
    <linearGradient id="pc-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e3c"/>
      <stop offset="100%" stop-color="#111128"/>
    </linearGradient>
    <linearGradient id="pc-highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1a1a38"/>
    </linearGradient>
    <filter id="mini-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <defs>
    <pattern id="grid9" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid9)" opacity="0.4"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1200" height="5" fill="#5dca7a"/>

  <!-- Background glow -->
  <ellipse cx="750" cy="320" rx="420" ry="260" fill="#5dca7a" opacity="0.03"/>

  <!-- Title area (left) -->
  <text x="60" y="150" font-family="system-ui, sans-serif" font-size="13" fill="#5dca7a" letter-spacing="2">HOMELAB GUIDE · 2026</text>
  <text x="60" y="218" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#e8e8f0">Best Mini PCs for</text>
  <text x="60" y="264" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#e8e8f0">Your First Homelab</text>
  <text x="60" y="308" font-family="system-ui, sans-serif" font-size="17" fill="#6b6b8a">Tiny boxes. Real workloads.</text>
  <text x="60" y="332" font-family="system-ui, sans-serif" font-size="17" fill="#6b6b8a">Proxmox, Docker, NAS — all of it.</text>

  <!-- Entry price callout -->
  <rect x="60" y="366" width="260" height="64" rx="12" fill="#142014" stroke="#5dca7a" stroke-width="2.5"/>
  <text x="190" y="392" font-family="system-ui, sans-serif" font-size="14" fill="#6b6b8a" text-anchor="middle">Entry price from</text>
  <text x="190" y="422" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#5dca7a" text-anchor="middle">$423</text>

  <!-- Key features -->
  <circle cx="70" cy="465" r="4" fill="#5dca7a"/>
  <text x="84" y="470" font-family="system-ui, sans-serif" font-size="14" fill="#c0c0d8">Fanless or near-silent</text>

  <circle cx="70" cy="492" r="4" fill="#5dca7a"/>
  <text x="84" y="497" font-family="system-ui, sans-serif" font-size="14" fill="#c0c0d8">10–35W typical TDP</text>

  <circle cx="70" cy="519" r="4" fill="#5dca7a"/>
  <text x="84" y="524" font-family="system-ui, sans-serif" font-size="14" fill="#c0c0d8">2–4 Ethernet ports on top picks</text>

  <circle cx="70" cy="546" r="4" fill="#c8ff00"/>
  <text x="84" y="551" font-family="system-ui, sans-serif" font-size="14" fill="#c0c0d8">Runs Proxmox, Docker, HA</text>

  <!-- ===== FIVE MINI PCs ===== -->

  <!-- Helper: each mini PC is ~110x110, arranged in a row + 1 below for 5 total -->
  <!-- Row 1: 3 PCs; Row 2: 2 PCs centered -->

  <!-- PC 1 (top-left) - Entry level: Beelink EQ12 -->
  <g>
    <rect x="490" y="115" width="115" height="115" rx="12" fill="url(#pc-body)" stroke="#5dca7a" stroke-width="2"/>
    <rect x="504" y="126" width="87" height="87" rx="7" fill="#0c0c22"/>
    <!-- Ventilation lines -->
    <line x1="510" y1="135" x2="510" y2="205" stroke="#1a1a38" stroke-width="3"/>
    <line x1="520" y1="135" x2="520" y2="205" stroke="#1a1a38" stroke-width="3"/>
    <line x1="530" y1="135" x2="530" y2="205" stroke="#1a1a38" stroke-width="3"/>
    <!-- Power LED -->
    <circle cx="560" cy="135" r="4" fill="#5dca7a" filter="url(#mini-glow)"/>
    <!-- USB ports -->
    <rect x="546" y="196" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="562" y="196" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <!-- Stand -->
    <rect x="532" y="230" width="40" height="8" rx="4" fill="#1a1a38"/>

    <!-- Label below -->
    <text x="547" y="252" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#5dca7a" text-anchor="middle">Beelink</text>
    <text x="547" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#6b6b8a" text-anchor="middle">EQ12</text>
    <rect x="510" y="270" width="74" height="20" rx="4" fill="#5dca7a"/>
    <text x="547" y="284" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0a0a23" text-anchor="middle">$423</text>
  </g>

  <!-- PC 2 (top-center) - N100 Mini PC -->
  <g>
    <rect x="635" y="115" width="115" height="115" rx="12" fill="url(#pc-body)" stroke="#c8ff00" stroke-width="2"/>
    <rect x="649" y="126" width="87" height="87" rx="7" fill="#0c0c22"/>
    <line x1="655" y1="135" x2="655" y2="205" stroke="#1a1a38" stroke-width="3"/>
    <line x1="665" y1="135" x2="665" y2="205" stroke="#1a1a38" stroke-width="3"/>
    <line x1="675" y1="135" x2="675" y2="205" stroke="#1a1a38" stroke-width="3"/>
    <circle cx="705" cy="135" r="4" fill="#c8ff00" filter="url(#mini-glow)"/>
    <rect x="691" y="196" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="707" y="196" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="677" y="230" width="40" height="8" rx="4" fill="#1a1a38"/>
    <text x="692" y="252" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c8ff00" text-anchor="middle">Topton</text>
    <text x="692" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#6b6b8a" text-anchor="middle">N100 · 4×2.5G</text>
    <rect x="655" y="270" width="74" height="20" rx="4" fill="#c8ff00"/>
    <text x="692" y="284" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0a0a23" text-anchor="middle">$179</text>
  </g>

