    <text x="617" y="460" font-family="system-ui, sans-serif" font-size="10" fill="#6b6b8a" text-anchor="middle">UM773 Lite</text>
    <rect x="580" y="465" width="74" height="20" rx="4" fill="#c880e0"/>
    <text x="617" y="479" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0a0a23" text-anchor="middle">$269</text>
