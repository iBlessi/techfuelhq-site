    <circle cx="850" cy="135" r="4" fill="#5090e0" filter="url(#mini-glow)"/>
    <rect x="836" y="196" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="852" y="196" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
