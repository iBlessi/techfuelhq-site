    <text x="762" y="479" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0a0a23" text-anchor="middle">$199</text>
  </g>

  <!-- Network lines connecting the PCs -->
  <line x1="547" y1="230" x2="547" y2="300" stroke="#5dca7a" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="692" y1="230" x2="692" y2="300" stroke="#c8ff00" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="837" y1="230" x2="837" y2="300" stroke="#5090e0" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>

  <!-- Small network switch at bottom center -->
  <rect x="610" y="500" width="160" height="38" rx="6" fill="#111128" stroke="#2a2a4a" stroke-width="1.5"/>
  <text x="690" y="517" font-family="system-ui, sans-serif" font-size="10" fill="#6b6b8a" text-anchor="middle">NETWORK SWITCH</text>
  <!-- Switch ports -->
  <rect x="620" y="521" width="8" height="6" rx="1" fill="#5dca7a"/>
  <rect x="632" y="521" width="8" height="6" rx="1" fill="#c8ff00"/>
  <rect x="644" y="521" width="8" height="6" rx="1" fill="#5090e0"/>
  <rect x="656" y="521" width="8" height="6" rx="1" fill="#c880e0"/>
  <rect x="668" y="521" width="8" height="6" rx="1" fill="#e08040"/>
  <rect x="680" y="521" width="8" height="6" rx="1" fill="#3a3a5a"/>

  <!-- Lines from mini PCs to switch -->
  <line x1="617" y1="425" x2="645" y2="500" stroke="#5dca7a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.3"/>
  <line x1="762" y1="425" x2="725" y2="500" stroke="#e08040" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.3"/>

  <!-- Annotation: power draw -->
  <rect x="865" y="320" width="250" height="70" rx="10" fill="#111128" stroke="#5dca7a" stroke-width="1.5"/>
  <text x="990" y="345" font-family="system-ui, sans-serif" font-size="13" fill="#6b6b8a" text-anchor="middle">COMBINED POWER DRAW</text>
  <text x="990" y="374" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#5dca7a" text-anchor="middle">~95 Watts</text>

  <!-- Annotation: 5 nodes -->
  <rect x="865" y="406" width="250" height="70" rx="10" fill="#111128" stroke="#c8ff00" stroke-width="1.5"/>
  <text x="990" y="431" font-family="system-ui, sans-serif" font-size="13" fill="#6b6b8a" text-anchor="middle">5 PROXMOX NODES</text>
  <text x="990" y="460" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#c8ff00" text-anchor="middle">~20 VMs / CTs</text>

  <!-- Footer -->
  <text x="600" y="600" font-family="system-ui, sans-serif" font-size="12" fill="#4a4a6a" text-anchor="middle">techfuelhq.com · Mini PC Homelab Guide · April 2026</text>
</svg>
