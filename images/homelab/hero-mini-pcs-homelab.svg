  <g>
    <rect x="560" y="310" width="115" height="115" rx="12" fill="url(#pc-body)" stroke="#c880e0" stroke-width="2"/>
    <rect x="574" y="321" width="87" height="87" rx="7" fill="#0c0c22"/>
    <line x1="580" y1="330" x2="580" y2="400" stroke="#1a1a38" stroke-width="3"/>
    <line x1="590" y1="330" x2="590" y2="400" stroke="#1a1a38" stroke-width="3"/>
    <line x1="600" y1="330" x2="600" y2="400" stroke="#1a1a38" stroke-width="3"/>
    <circle cx="630" cy="330" r="4" fill="#c880e0" filter="url(#mini-glow)"/>
    <rect x="616" y="400" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="632" y="400" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="597" y="425" width="40" height="8" rx="4" fill="#1a1a38"/>
