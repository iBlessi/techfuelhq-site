    <rect x="705" y="310" width="115" height="115" rx="12" fill="url(#pc-body)" stroke="#e08040" stroke-width="2"/>
    <rect x="719" y="321" width="87" height="87" rx="7" fill="#0c0c22"/>
    <line x1="725" y1="330" x2="725" y2="400" stroke="#1a1a38" stroke-width="3"/>
    <line x1="735" y1="330" x2="735" y2="400" stroke="#1a1a38" stroke-width="3"/>
    <line x1="745" y1="330" x2="745" y2="400" stroke="#1a1a38" stroke-width="3"/>
    <circle cx="775" cy="330" r="4" fill="#e08040" filter="url(#mini-glow)"/>
    <rect x="761" y="400" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="777" y="400" width="12" height="8" rx="1" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
    <rect x="742" y="425" width="40" height="8" rx="4" fill="#1a1a38"/>
    <text x="762" y="447" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e08040" text-anchor="middle">GMKtec</text>
    <text x="762" y="460" font-family="system-ui, sans-serif" font-size="10" fill="#6b6b8a" text-anchor="middle">G3 Plus</text>
