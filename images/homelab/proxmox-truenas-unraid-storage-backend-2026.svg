<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, system-ui, sans-serif" role="img">
  <title>ZFS vdev topology comparison for a six-drive 6x16TB homelab pool in 2026</title>
  <desc>Side-by-side comparison of three ZFS topologies on a six-drive 16TB pool: a single 6-wide RAIDZ2, two 3-wide RAIDZ1 vdevs, and three 2-wide mirror pairs, comparing small-block random IOPS, usable capacity, fault tolerance, rebuild behavior, and ideal workload. Three mirror pairs win on IOPS; RAIDZ2 wins on capacity and redundancy.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="#0a0a23"/>
  <rect width="1200" height="760" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="78" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">STORAGE BACKEND COMPARISON · ZFS VDEV GEOMETRY</text>
  <text x="70" y="128" fill="#e8e8f0" font-size="44" font-weight="900">RAIDZ vs Mirrors: Where IOPS Live</text>
  <text x="70" y="162" fill="#6b6b8a" font-size="19">Six-drive pool, 6&#215;16&#160;TB drives, OpenZFS 2.3 &#183; the single biggest performance lever in a homelab pool</text>

  <!-- Column header band -->
  <g transform="translate(70,198)">
    <!-- spec label column -->
    <rect x="0" y="0" width="320" height="64" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <text x="20" y="29" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">TOPOLOGY</text>
    <text x="20" y="50" fill="#6b6b8a" font-size="13" letter-spacing="1">(same 6 drives, different layout)</text>

    <!-- RAIDZ2 column -->
    <rect x="334" y="0" width="240" height="64" rx="10" fill="#101028" stroke="#5090e0"/>
    <rect x="334" y="0" width="240" height="6" rx="3" fill="#5090e0"/>
    <text x="454" y="33" text-anchor="middle" fill="#e8e8f0" font-size="20" font-weight="900">1&#215; RAIDZ2</text>
    <text x="454" y="53" text-anchor="middle" fill="#5090e0" font-size="14" font-weight="600">6-wide</text>

    <!-- RAIDZ1 column -->
    <rect x="586" y="0" width="240" height="64" rx="10" fill="#101028" stroke="#e08828"/>
    <rect x="586" y="0" width="240" height="6" rx="3" fill="#e08828"/>
    <text x="706" y="33" text-anchor="middle" fill="#e8e8f0" font-size="20" font-weight="900">2&#215; RAIDZ1</text>
    <text x="706" y="53" text-anchor="middle" fill="#e08828" font-size="14" font-weight="600">two 3-wide vdevs</text>

    <!-- Mirror column (winner accent) -->
    <rect x="838" y="0" width="240" height="64" rx="10" fill="#101028" stroke="#c8ff00"/>
    <rect x="838" y="0" width="240" height="6" rx="3" fill="#c8ff00"/>
    <text x="958" y="33" text-anchor="middle" fill="#e8e8f0" font-size="20" font-weight="900">3&#215; Mirror</text>
    <text x="958" y="53" text-anchor="middle" fill="#c8ff00" font-size="14" font-weight="600">three 2-wide pairs</text>
  </g>

  <!-- Spec rows -->
  <g transform="translate(70,278)">
    <!-- Row 1: small-block IOPS -->
    <rect x="0" y="0" width="1008" height="64" rx="8" fill="#13132e"/>
    <text x="20" y="30" fill="#c0c0d8" font-size="16" font-weight="600">Small-block random IOPS</text>
    <text x="20" y="51" fill="#6b6b8a" font-size="13">per OpenZFS workload-tuning behavior</text>
    <text x="454" y="40" text-anchor="middle" fill="#c0c0d8" font-size="17" font-weight="700">~1 drive</text>
    <text x="706" y="40" text-anchor="middle" fill="#c0c0d8" font-size="17" font-weight="700">~2 drives</text>
    <text x="958" y="40" text-anchor="middle" fill="#c8ff00" font-size="17" font-weight="800">~3 drives</text>

    <!-- Row 2: usable capacity -->
    <rect x="0" y="68" width="1008" height="64" rx="8" fill="#0d0d28"/>
    <text x="20" y="98" fill="#c0c0d8" font-size="16" font-weight="600">Usable capacity</text>
    <text x="20" y="119" fill="#6b6b8a" font-size="13">6&#215;16&#160;TB raw</text>
    <text x="454" y="108" text-anchor="middle" fill="#5090e0" font-size="17" font-weight="800">64 TB</text>
    <text x="706" y="108" text-anchor="middle" fill="#e08828" font-size="17" font-weight="800">64 TB</text>
    <text x="958" y="108" text-anchor="middle" fill="#c0c0d8" font-size="17" font-weight="700">48 TB</text>

    <!-- Row 3: fault tolerance -->
    <rect x="0" y="136" width="1008" height="64" rx="8" fill="#13132e"/>
    <text x="20" y="166" fill="#c0c0d8" font-size="16" font-weight="600">Fault tolerance</text>
    <text x="20" y="187" fill="#6b6b8a" font-size="13">drives that can fail</text>
    <text x="454" y="176" text-anchor="middle" fill="#5dca7a" font-size="17" font-weight="800">2 drives</text>
    <text x="706" y="176" text-anchor="middle" fill="#c0c0d8" font-size="17" font-weight="700">1 per vdev</text>
    <text x="958" y="176" text-anchor="middle" fill="#c0c0d8" font-size="17" font-weight="700">1 per vdev</text>

    <!-- Row 4: streaming throughput -->
    <rect x="0" y="204" width="1008" height="64" rx="8" fill="#0d0d28"/>
    <text x="20" y="234" fill="#c0c0d8" font-size="16" font-weight="600">Streaming throughput</text>
    <text x="20" y="255" fill="#6b6b8a" font-size="13">scales with data-disk count</text>
    <text x="454" y="244" text-anchor="middle" fill="#5dca7a" font-size="16" font-weight="700">High (4 data)</text>
    <text x="706" y="244" text-anchor="middle" fill="#c0c0d8" font-size="16" font-weight="700">High (4 data)</text>
    <text x="958" y="244" text-anchor="middle" fill="#c0c0d8" font-size="16" font-weight="700">Moderate</text>

    <!-- Row 5: best workload -->
    <rect x="0" y="272" width="1008" height="64" rx="8" fill="#13132e"/>
    <text x="20" y="302" fill="#c0c0d8" font-size="16" font-weight="600">Best-fit workload</text>
    <text x="20" y="323" fill="#6b6b8a" font-size="13">match topology to traffic</text>
    <text x="454" y="312" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="600">Plex / media</text>
    <text x="706" y="312" text-anchor="middle" fill="#c0c0d8" font-size="15" font-weight="600">Balanced</text>
    <text x="958" y="312" text-anchor="middle" fill="#c8ff00" font-size="15" font-weight="700">VMs / iSCSI / DB</text>
  </g>

  <!-- Verdict strip -->
  <g transform="translate(70,640)">
    <rect x="0" y="0" width="1008" height="66" rx="10" fill="#101028" stroke="#1e1e3a"/>
    <rect x="0" y="0" width="6" height="66" rx="3" fill="#c8ff00"/>
    <text x="26" y="29" fill="#c8ff00" font-size="13" letter-spacing="2" font-weight="700">THE CALL</text>
    <text x="26" y="52" fill="#c0c0d8" font-size="16">Mirrors for VMs &amp; databases (small-block IOPS); RAIDZ2 for media (streaming + capacity). The OS choice matters less than the vdev layout.</text>
  </g>

  <!-- Footer -->
  <text x="70" y="738" fill="#4a4a6a" font-size="13">TechFuel HQ &#183; Storage Backend Comparison &#183; IOPS &amp; capacity per OpenZFS workload-tuning guide</text>
  <text x="1130" y="738" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
