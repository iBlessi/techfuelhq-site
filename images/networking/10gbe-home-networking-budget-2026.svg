<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif" role="img">
  <title>10GbE Homelab Networking on a Budget — three build tiers for 2026</title>
  <desc>Buying guide summary of three 10GbE homelab build tiers: point-to-point at about $65, a four-port switched fabric at about $280, and a six-to-eight node cluster at about $520, all built on used Mellanox ConnectX-3 SFP+ cards, passive DACs, and MikroTik switches.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131333" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0a23"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1200" height="5" fill="#c8ff00"/>

  <!-- Header -->
  <text x="70" y="92" fill="#c8ff00" font-size="14" letter-spacing="3" font-weight="700">BUYING GUIDE · 10GbE HOMELAB · 2026</text>
  <text x="70" y="148" fill="#e8e8f0" font-size="50" font-weight="900">10GbE on a Budget</text>
  <text x="70" y="184" fill="#c0c0d8" font-size="20">Three honest build tiers, all on used SFP+ gear — &#8220;a $65 weekend project.&#8221;</text>

  <!-- Tier cards -->
  <!-- Tier 1 -->
  <g transform="translate(70,222)">
    <rect width="350" height="270" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <rect x="0" y="0" width="6" height="270" rx="3" fill="#5dca7a"/>
    <text x="28" y="44" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">TIER 1 · POINT-TO-POINT</text>
    <text x="28" y="92" fill="#5dca7a" font-size="40" font-weight="900">~$65</text>
    <text x="160" y="92" fill="#6b6b8a" font-size="16" font-weight="700">2 machines, no switch</text>
    <text x="28" y="134" fill="#c0c0d8" font-size="15">2&#215; Mellanox ConnectX-3</text>
    <text x="322" y="134" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">$50</text>
    <text x="28" y="164" fill="#c0c0d8" font-size="15">1&#215; 3m passive SFP+ DAC</text>
    <text x="322" y="164" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">$15</text>
    <line x1="28" y1="184" x2="322" y2="184" stroke="#1e1e3a" stroke-width="1"/>
    <text x="28" y="214" fill="#6b6b8a" font-size="14">Combined draw under 15W. Highest-ROI</text>
    <text x="28" y="238" fill="#6b6b8a" font-size="14">10G build that exists.</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(440,222)">
    <rect width="350" height="270" rx="12" fill="#101028" stroke="#c8ff00" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="270" rx="3" fill="#c8ff00"/>
    <text x="28" y="44" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">TIER 2 · SWITCHED FABRIC</text>
    <text x="28" y="92" fill="#c8ff00" font-size="40" font-weight="900">~$280</text>
    <text x="166" y="92" fill="#6b6b8a" font-size="16" font-weight="700">3&#8211;4 devices</text>
    <text x="28" y="134" fill="#c0c0d8" font-size="15">MikroTik CRS305 (4&#215; SFP+)</text>
    <text x="322" y="134" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">$160</text>
    <text x="28" y="164" fill="#c0c0d8" font-size="15">3&#215; ConnectX-3 + 3&#215; DAC</text>
    <text x="322" y="164" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">$120</text>
    <line x1="28" y1="184" x2="322" y2="184" stroke="#1e1e3a" stroke-width="1"/>
    <text x="28" y="214" fill="#6b6b8a" font-size="14">Fanless, ~8W idle, RouterOS or</text>
    <text x="28" y="238" fill="#6b6b8a" font-size="14">SwOS. The sweet-spot tier.</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(810,222)">
    <rect width="320" height="270" rx="12" fill="#101028" stroke="#1e1e3a"/>
    <rect x="0" y="0" width="6" height="270" rx="3" fill="#5090e0"/>
    <text x="28" y="44" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">TIER 3 · SMALL CLUSTER</text>
    <text x="28" y="92" fill="#5090e0" font-size="40" font-weight="900">~$520</text>
    <text x="166" y="92" fill="#6b6b8a" font-size="16" font-weight="700">6&#8211;8 devices</text>
    <text x="28" y="134" fill="#c0c0d8" font-size="15">MikroTik CRS309 (8&#215; SFP+)</text>
    <text x="292" y="134" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">$280</text>
    <text x="28" y="164" fill="#c0c0d8" font-size="15">6&#215; ConnectX-3 + 6&#215; DAC</text>
    <text x="292" y="164" text-anchor="end" fill="#e8e8f0" font-size="15" font-weight="600">$240</text>
    <line x1="28" y1="184" x2="292" y2="184" stroke="#1e1e3a" stroke-width="1"/>
    <text x="28" y="214" fill="#6b6b8a" font-size="14">Managed, VLANs, Ceph / Proxmox</text>
    <text x="28" y="238" fill="#6b6b8a" font-size="14">HA. Pure SFP+ wins on power.</text>
  </g>

  <!-- Bottom rule of thumb strip -->
  <g transform="translate(70,520)">
    <text x="0" y="20" fill="#6b6b8a" font-size="13" letter-spacing="2" font-weight="700">THE CALL</text>
    <text x="120" y="20" fill="#c0c0d8" font-size="16">Spinning-disk NAS? Skip 10G — <tspan fill="#c8ff00" font-weight="600">2.5GbE</tspan> beats your disks.   NVMe NAS or Proxmox cluster? <tspan fill="#c8ff00" font-weight="600">10G pays off day one.</tspan></text>
  </g>

  <!-- Footer -->
  <text x="70" y="592" fill="#4a4a6a" font-size="13">TechFuel HQ · Homelab Buying Guide · Prices per May 2026 used-market &amp; manufacturer listings</text>
  <text x="1130" y="592" text-anchor="end" fill="#4a4a6a" font-size="13">techfuelhq.com</text>
</svg>
